  }, true));

  // ── SECTION: Announcements ──────────────────────────────────────────────────
  el.appendChild(collapsibleSection('Announcements', body=>{
    if(!Array.isArray(d.announcementList))d.announcementList=[];
    body.appendChild(dynamicList(d.announcementList,
      (item,i,rebuild)=>{
        const row=document.createElement('div');row.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:8px;';
        const inp2=document.createElement('input');inp2.type='text';inp2.placeholder='Announcement text';inp2.value=item||'';inp2.style.flex='1';
        inp2.addEventListener('input',()=>{d.announcementList[i]=inp2.value;});
        const rm=document.createElement('button');rm.className='remove-row-btn';rm.textContent='×';
        rm.addEventListener('click',()=>{d.announcementList.splice(i,1);rebuild();});
        row.appendChild(inp2);row.appendChild(rm);return row;
      },'+ Add announcement',()=>''));
  }, false));

  // ── SECTION: Ward Business ──────────────────────────────────────────────────
  el.appendChild(collapsibleSection('Ward Business', body=>{
    // New Records
    if(!Array.isArray(d.newRecordsList))d.newRecordsList=[];
    const nrLbl=document.createElement('div');nrLbl.className='agenda-field';nrLbl.innerHTML='<label>New Record(s)</label>';
    nrLbl.appendChild(dynamicList(d.newRecordsList,(item,i,rebuild)=>{
      const row=document.createElement('div');row.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:8px;';
      const inp2=document.createElement('input');inp2.type='text';inp2.placeholder='Member name';inp2.value=item||'';inp2.style.flex='1';
      inp2.addEventListener('input',()=>{d.newRecordsList[i]=inp2.value;});
      const rm=document.createElement('button');rm.className='remove-row-btn';rm.textContent='×';
      rm.addEventListener('click',()=>{d.newRecordsList.splice(i,1);rebuild();});
      row.appendChild(inp2);row.appendChild(rm);return row;
    },'+ Add new record',()=>''));
    body.appendChild(nrLbl);

    // Releases
    if(!Array.isArray(d.releases))d.releases=[];
    const relLbl=document.createElement('div');relLbl.className='agenda-field';relLbl.innerHTML='<label>Release(s)</label>';
    relLbl.appendChild(dynamicList(d.releases,(item,i,rebuild)=>{
      const row=document.createElement('div');row.className='release-row';
      const m=document.createElement('input');m.type='text';m.placeholder='Member name';m.value=item.member||'';
      m.addEventListener('input',()=>{d.releases[i].member=m.value;});
      const c=document.createElement('input');c.type='text';c.placeholder='Calling being released from';c.value=item.calling||'';
      c.addEventListener('input',()=>{d.releases[i].calling=c.value;});
      const rm=document.createElement('button');rm.className='remove-row-btn';rm.textContent='×';
      rm.addEventListener('click',()=>{d.releases.splice(i,1);rebuild();});
      row.appendChild(m);row.appendChild(c);row.appendChild(rm);return row;
    },'+ Add release',()=>({member:'',calling:''})));
    body.appendChild(relLbl);

    // Sustainings
    if(!Array.isArray(d.sustainings))d.sustainings=[];
    const susLbl=document.createElement('div');susLbl.className='agenda-field';susLbl.innerHTML='<label>Calling Sustaining(s)</label>';
    susLbl.appendChild(dynamicList(d.sustainings,(item,i,rebuild)=>{
      const row=document.createElement('div');row.className='sustain-row';
      const m=document.createElement('input');m.type='text';m.placeholder='Member name';m.value=item.member||'';
      m.addEventListener('input',()=>{d.sustainings[i].member=m.value;});
      const c=document.createElement('input');c.type='text';c.placeholder='Calling/Assignment';c.value=item.calling||'';
      c.addEventListener('input',()=>{d.sustainings[i].calling=c.value;});
      const rm=document.createElement('button');rm.className='remove-row-btn';rm.textContent='×';
      rm.addEventListener('click',()=>{d.sustainings.splice(i,1);rebuild();});
      row.appendChild(m);row.appendChild(c);row.appendChild(rm);return row;
    },'+ Add sustaining',()=>({member:'',calling:''})));
    body.appendChild(susLbl);

    // Ordinations
    if(!Array.isArray(d.ordinations))d.ordinations=[];
    const ordLbl=document.createElement('div');ordLbl.className='agenda-field';ordLbl.innerHTML='<label>Priesthood Ordination(s)</label>';
    ordLbl.appendChild(dynamicList(d.ordinations,(item,i,rebuild)=>{
      const row=document.createElement('div');row.className='ordination-row';
      const m=document.createElement('input');m.type='text';m.placeholder='Member name';m.value=item.member||'';
      m.addEventListener('input',()=>{d.ordinations[i].member=m.value;});
      const of2=document.createElement('select');
      ['Deacon','Teacher','Priest','Elder','High Priest'].forEach(v=>{const op=document.createElement('option');op.value=v;op.textContent=v;if(v===item.office)op.selected=true;of2.appendChild(op);});
      of2.addEventListener('change',()=>{d.ordinations[i].office=of2.value;});
      const rm=document.createElement('button');rm.className='remove-row-btn';rm.textContent='×';
      rm.addEventListener('click',()=>{d.ordinations.splice(i,1);rebuild();});
      row.appendChild(m);row.appendChild(of2);row.appendChild(rm);return row;
    },'+ Add ordination',()=>({member:'',office:'Deacon'})));
    body.appendChild(ordLbl);

    // Baby Blessings
    if(!Array.isArray(d.babyBlessingsList))d.babyBlessingsList=[];
    const bbLbl=document.createElement('div');bbLbl.className='agenda-field';bbLbl.innerHTML='<label>Baby Blessing(s)</label>';
    bbLbl.appendChild(dynamicList(d.babyBlessingsList,(item,i,rebuild)=>{
      const row=document.createElement('div');row.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:8px;';
      const inp2=document.createElement('input');inp2.type='text';inp2.placeholder="Child's name";inp2.value=item||'';inp2.style.flex='1';
      inp2.addEventListener('input',()=>{d.babyBlessingsList[i]=inp2.value;});
      const rm=document.createElement('button');rm.className='remove-row-btn';rm.textContent='×';
      rm.addEventListener('click',()=>{d.babyBlessingsList.splice(i,1);rebuild();});
      row.appendChild(inp2);row.appendChild(rm);return row;
    },'+ Add baby blessing',()=>''));
    body.appendChild(bbLbl);

    // Confirmations
    if(!Array.isArray(d.confirmationsList))d.confirmationsList=[];
    const cfLbl=document.createElement('div');cfLbl.className='agenda-field';cfLbl.innerHTML='<label>Confirmation(s)</label>';
    cfLbl.appendChild(dynamicList(d.confirmationsList,(item,i,rebuild)=>{
      const row=document.createElement('div');row.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:8px;';
      const inp2=document.createElement('input');inp2.type='text';inp2.placeholder="Member's name";inp2.value=item||'';inp2.style.flex='1';
      inp2.addEventListener('input',()=>{d.confirmationsList[i]=inp2.value;});
      const rm=document.createElement('button');rm.className='remove-row-btn';rm.textContent='×';
      rm.addEventListener('click',()=>{d.confirmationsList.splice(i,1);rebuild();});
      row.appendChild(inp2);row.appendChild(rm);return row;
    },'+ Add confirmation',()=>''));
    body.appendChild(cfLbl);
  }, false));

  // ── SECTION: Hymns ──────────────────────────────────────────────────────────
  el.appendChild(collapsibleSection('Hymns', body=>{
    body.appendChild(hymnRow('openingHymnNum','openingHymnTitle','Opening Hymn'));
    body.appendChild(hymnRow('sacramentHymnNum','sacramentHymnTitle','Sacrament Hymn'));
    if(d.meetingType!=='Fast & Testimony'){
      body.appendChild(hymnRow('intermediateHymn','intermediateHymnTitle','Intermediate Hymn / Musical Number'));
    }
    body.appendChild(hymnRow('closingHymnNum','closingHymnTitle','Closing Hymn'));
  }, true));

  // ── SECTION: Prayers ───────────────────────────────────────────────────────
  el.appendChild(collapsibleSection('Prayers', body=>{
    body.appendChild(field('Opening Prayer<span class="req">*</span>',inp(d.openingPrayer,'openingPrayer','Full name')));
    body.appendChild(field('Closing Prayer<span class="req">*</span>',inp(d.closingPrayer,'closingPrayer','Full name')));
  }, true));

  // ── SECTION: Speakers ───────────────────────────────────────────────────────
  el.appendChild(collapsibleSection(d.meetingType==='Fast & Testimony'?'Fast & Testimony':'Speakers', body=>{
    if(d.meetingType==='Fast & Testimony'){
      body.appendChild(field('Meeting Notes (optional)',inp(d.speaker1Topic,'speaker1Topic','Any special notes for the meeting')));
    } else {
      function speakerRow(numLbl,nameKey,topicKey){
        const r=document.createElement('div');r.className='speaker-row';r.style.marginBottom='10px;';
        const nf=document.createElement('div');nf.className='agenda-field';nf.style.marginBottom='0';
        nf.innerHTML=`<label>${numLbl}</label>`;nf.appendChild(inp(d[nameKey],nameKey,'Full name'));
        const tf=document.createElement('div');tf.className='agenda-field';tf.style.marginBottom='0';
        tf.innerHTML='<label>Topic (optional)</label>';tf.appendChild(inp(d[topicKey],topicKey,'Topic'));
        r.appendChild(nf);r.appendChild(tf);return r;
      }
      body.appendChild(speakerRow('Speaker 1','speaker1','speaker1Topic'));
      const s2=speakerRow('Speaker 2 (optional)','speaker2','speaker2Topic');s2.style.marginTop='8px';body.appendChild(s2);
      const fs=speakerRow('Final Speaker (optional)','finalSpeaker','finalSpeakerTopic');fs.style.marginTop='8px';body.appendChild(fs);
    }
  }, false));

  // ── Required note + Save ────────────────────────────────────────────────────
  const reqNote=document.createElement('div');reqNote.style.cssText='font-size:11px;color:#aaa;margin:12px 0 8px;';
  reqNote.innerHTML='<span class="req">*</span> Required field';el.appendChild(reqNote);

  const submitBtn=document.createElement('button');submitBtn.className='btn-primary';
  submitBtn.style.cssText='width:100%;padding:14px;font-size:15px;border-radius:10px;';
  submitBtn.textContent=isEditing?'Save Changes':'Save Agenda & Generate Script';
  submitBtn.addEventListener('click',()=>{
    if(!d.date){alert('Please enter a meeting date.');return;}
    if(!d.conducting){alert('Please enter who is conducting.');return;}
    if(!d.presiding){alert('Please enter who is presiding.');return;}
    if(isEditing){
      // Update existing agenda in place
      Object.assign(editingAgenda,d);
      window._agendaDraft=null;
      state.view='detail';render();
      dbSaveAgenda(editingAgenda);
    } else {
      const tempId=Date.now();
      const agenda={id:tempId,...JSON.parse(JSON.stringify(d))};
      if(!state.agendas)state.agendas=[];
      state.agendas.push(agenda);
      window._agendaDraft=null;
      state.view='detail';state.detailId=tempId;render();
      dbSaveAgenda(agenda).then(realId=>{
        if(realId){
          const a=state.agendas.find(x=>x.id===tempId);
          if(a){a.id=realId;state.detailId=realId;}
        }
      });
    }
  });
  el.appendChild(submitBtn);
}


// ── Build Script ──────────────────────────────────────────────────────────────
function buildScript(a){
  const blocks=[];
  const ward=a.ward||'the ward';
  const date=fmtDate(a.date);
  const isFast=a.meetingType==='Fast & Testimony';

  // 1 — Welcome
  blocks.push({step:'Welcome',text:`Good ${date&&new Date(a.date+'T12:00:00').getHours()<12?'morning':'afternoon'} brothers and sisters.\nWe welcome you to the Church of Jesus Christ of Latter-day Saints!\n\nThis is the ${isFast?'Fast and Testimony Meeting':'Sacrament Meeting'} for the ${ward} on ${date}.`});

  // 2 — Introduction
  let intro=`My name is ${a.conducting||'[Conducting]'}. ${a.presiding?`${a.presiding}, who presides at today's meeting, has asked that I conduct.`:''}`;
  if(a.highCounselor) intro+=`\n\nWe welcome ${a.highCounselor} from the stake high council who is visiting with us today${a.stakeVisiting?' to conduct stake business.':'.'}`;
  if(a.chorister||a.accompanist){
    intro+=`\n\nWe'd like to extend a special thank you to our Chorister ${a.chorister||'[Chorister]'} and our Accompanist ${a.accompanist||'[Accompanist]'} who will provide the music for today's meeting.`;
  }
  blocks.push({step:'Introduction',text:intro.trim()});

  // 3 — Opening Hymn & Prayer
  let hymnLine=a.openingHymnNum?`We will open by singing hymn number ${a.openingHymnNum}${a.openingHymnTitle?`, "${a.openingHymnTitle}"`:''}.`:'We will now sing our opening hymn.';
  hymnLine+=a.openingPrayer?`\n\nFollowing the hymn, ${a.openingPrayer} will offer our opening prayer.`:'\n\nFollowing the hymn we will have our opening prayer.';
  blocks.push({step:'Opening Hymn & Prayer',text:hymnLine});

  // 4 — Announcements
  const annList=a.announcementList?a.announcementList.filter(Boolean):a.announcements?a.announcements.split('\n').filter(Boolean):[];
  if(annList.length){
    const annText=annList.length===1
      ?annList[0]
      :annList.map((ann,i)=>`${i+1}. ${ann}`).join('\n');
    blocks.push({step:'Announcements',text:`By way of announcements:\n\n${annText}`});
  }

  // 5 — Ward Business (if any)
  const hasWB=(a.releases&&a.releases.some(r=>r.member))||
              (a.sustainings&&a.sustainings.some(s=>s.member))||
              (a.ordinations&&a.ordinations.some(o=>o.member))||
              (a.babyBlessingsList&&a.babyBlessingsList.some(Boolean))||a.babyBlessings||
              (a.confirmationsList&&a.confirmationsList.some(Boolean))||a.confirmations||
              (a.newRecordsList&&a.newRecordsList.some(Boolean))||a.newRecords;

  if(hasWB){
    blocks.push({step:'Ward Business',text:'Before we Continue with the Sacrament portion of our program, we have some Ward Business to take care of.'});

    const nrList=a.newRecordsList?a.newRecordsList.filter(Boolean):a.newRecords?[a.newRecords]:[];
  if(nrList.length){
      blocks.push({step:'New Records',text:`We'd like to welcome the following member(s) whose records have been received into our ward:\n\n${nrList.join('\n')}`});
    }

    const releases=a.releases?a.releases.filter(r=>r.member):[];
    if(releases.length){
      const plural=releases.length>1;
      let txt=plural
        ?'The following members have been released from their calling:\n\n'
        :'The following member has been released from his/her calling:\n\n';
      txt+=releases.map(r=>`${r.member}${r.calling?` as ${r.calling}`:''}`).join('\n');
      txt+=plural
        ?'\n\nWe propose that they be given a vote of thanks for their service. Those who wish to express their appreciation may manifest by the uplifted hand.'
        :'\n\nWe propose that he/she be given a vote of thanks for his/her service. Those who wish to express their appreciation may manifest by the uplifted hand.';
      blocks.push({step:'Release(s)',text:txt});
    }

    const sustainings=a.sustainings?a.sustainings.filter(s=>s.member):[];
    if(sustainings.length){
      let txt='';
      txt+=sustainings.map(s=>`${s.member}${s.calling?` as ${s.calling}`:''}`).join('\n');
      const plural2=sustainings.length>1;
      const header=plural2
        ?'The following members have been called. If they are here, will they please stand until after the vote is taken. We have called:\n\n'
        :'The following member has been called. If he/she is here, will he/she please stand until after the vote is taken. We have called:\n\n';
      const footer=plural2
        ?'\n\nWe propose that they be sustained. Those in favor may manifest it by the uplifted hand. [Pause briefly for the sustaining vote.] Those opposed, if any, may manifest it. [Pause briefly to allow for a dissenting vote, if any.] Thank you.'
        :'\n\nWe propose that he/she be sustained. Those in favor may manifest it by the uplifted hand. [Pause briefly for the sustaining vote.] Those opposed, if any, may manifest it. [Pause briefly to allow for a dissenting vote, if any.] Thank you.';
      txt=header+txt+footer;
      blocks.push({step:'Sustaining(s)',text:txt.trim()});
    }

    const ords=a.ordinations?a.ordinations.filter(o=>o.member):[];
    if(ords.length){
      let txt=ords.map(o=>`We will now proceed with the ordination of ${o.member} to the office of ${o.office} in the ${['Deacon','Teacher','Priest'].includes(o.office)?'Aaronic':'Melchizedek'} Priesthood.`).join('\n\n');
      blocks.push({step:'Ordination(s)',text:txt});
    }

    const bbList=a.babyBlessingsList?a.babyBlessingsList.filter(Boolean):a.babyBlessings?[a.babyBlessings]:[];
    if(bbList.length){
      blocks.push({step:'Baby Blessing(s)',text:`We will now proceed with the blessing of the following child${bbList.length>1?'ren':''}:\n\n${bbList.join('\n')}`});
    }

    const cfList=a.confirmationsList?a.confirmationsList.filter(Boolean):a.confirmations?[a.confirmations]:[];
    if(cfList.length){
      blocks.push({step:'Confirmation(s)',text:`We will now proceed with the confirmation of the following individual${cfList.length>1?'s':''}:\n\n${cfList.join('\n')}`});
    }
  }

  // 6 — Sacrament Hymn
  let sacLine=a.sacramentHymnNum?`We will prepare to partake of the Sacrament by singing hymn number ${a.sacramentHymnNum}${a.sacramentHymnTitle?`, "${a.sacramentHymnTitle}"`:''}.`:'We will now sing our Sacrament hymn.';
  blocks.push({step:'Sacrament Hymn',text:sacLine});

  // 7 — After Sacrament
  blocks.push({step:'After Sacrament',text:"We'd like to thank the Aaronic Priesthood for the reverent manner in which they administered the Sacrament."});

  // 8 — Program
  if(isFast){
    blocks.push({step:'Fast & Testimony',text:"We will now open the meeting for the bearing of testimonies. We invite all who feel so inclined to come to the podium and share their testimony."});
  } else {
    const speakers=[];
    if(a.speaker1) speakers.push({name:a.speaker1,topic:a.speaker1Topic});
    if(a.speaker2) speakers.push({name:a.speaker2,topic:a.speaker2Topic});

    let progText='The remainder of our program will go as follows:\n\n';
    speakers.forEach((s,i)=>{
      progText+=`- We will ${i===0?'first be privileged':'next be pleased'} to hear from ${s.name}.`;
      if(i<speakers.length-1) progText+='\n\n';
    });
    if(a.intermediateHymn||a.intermediateHymnTitle){
      progText+=`\n\n- Our Intermediate Hymn will be ${a.intermediateHymn?`#${a.intermediateHymn} `:''}${a.intermediateHymnTitle?`"${a.intermediateHymnTitle}"`:''}.`;
    }
    if(a.finalSpeaker){
      progText+=`\n\n- And our concluding speaker will be ${a.finalSpeaker}.`;
    }
    blocks.push({step:'Program Overview',text:progText});
  }

  // 9 — Closing
  let closingLine=a.closingHymnNum?`We will close by singing hymn number ${a.closingHymnNum}${a.closingHymnTitle?`, "${a.closingHymnTitle}"`:''}.`:'We will now sing our closing hymn.';
  closingLine+=a.closingPrayer?`\n\n${a.closingPrayer} will then offer our closing prayer.`:'\n\nWe will then have our closing prayer.';
  blocks.push({step:'Closing Hymn & Prayer',text:closingLine});
  blocks.push({step:'Dismissal',text:'This meeting is now dismissed.'});

  return blocks;
}

// ── Render Agenda Detail (Script View) ────────────────────────────────────────
function renderAgendaDetail(el,role){
  const a=state.agendas.find(x=>x.id===state.detailId);
  if(!a){el.innerHTML='<div class="empty-state">Agenda not found.</div>';return;}

  const hdr=document.createElement('div');hdr.className='detail-header';
  const bb=document.createElement('button');bb.className='back-btn';bb.innerHTML='&larr;';
  bb.addEventListener('click',()=>{state.view='list';state.detailId=null;render();});
  const hdi=document.createElement('div');
  const typeBadge=`<span class="agenda-type-badge${a.meetingType==='Fast & Testimony'?' fast':''}" style="font-size:12px;vertical-align:middle;margin-left:8px;">${a.meetingType}</span>`;
  hdi.innerHTML=`<div class="detail-calling">${fmtDate(a.date)}${typeBadge}</div><div class="detail-member">${a.ward} &middot; Conducting: ${a.conducting||'—'}</div>`;
  hdr.appendChild(bb);hdr.appendChild(hdi);el.appendChild(hdr);

  const actions=document.createElement('div');actions.className='script-actions';
  const printBtn=document.createElement('button');printBtn.className='btn-primary';
  printBtn.innerHTML='🖨 Print';printBtn.addEventListener('click',()=>window.print());
  const editBtn2=document.createElement('button');
  editBtn2.style.cssText='background:#fff;border:1px solid rgba(0,0,0,0.15);color:#1c2537;padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;';
  editBtn2.textContent='✏ Edit';
  editBtn2.addEventListener('click',()=>{window._agendaDraft=JSON.parse(JSON.stringify(a));state.view='new';render();});
  const delBtn2=document.createElement('button');
  delBtn2.style.cssText='background:transparent;border:1px solid #e57373;color:#c62828;padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;';
  delBtn2.textContent='Delete';
  delBtn2.addEventListener('click',()=>{
    if(confirm('Delete this agenda?')){
      const deletedId=a.id;
      state.agendas=state.agendas.filter(x=>x.id!==a.id);
      state.view='list';state.detailId=null;render();
      dbDeleteAgenda(deletedId);
    }
  });
  actions.appendChild(printBtn);actions.appendChild(editBtn2);actions.appendChild(delBtn2);
  el.appendChild(actions);

  // ── Document ──────────────────────────────────────────────────────────────
  const doc=document.createElement('div');

  // Header row: logo | text | spacer
  const docHdr=document.createElement('div');

  logoWrap.innerHTML=LOGO_SVG;

  hdrText.innerHTML=`
    <div style="font-size:12px;font-weight:700;letter-spacing:0.05em;color:#1c2537;margin-bottom:3px;">THE CHURCH OF JESUS CHRIST OF LATTER-DAY SAINTS</div>
    <div style="font-size:17px;font-weight:700;color:#1c2537;">${a.ward}</div>
    <div style="font-size:14px;font-weight:600;margin-top:2px;color:#333;">Sacrament Meeting — ${a.meetingType==='Fast & Testimony'?'Fast &amp; Testimony':'Regular'}</div>

  const logoSpacer=document.createElement('div');logoSpacer.style.width='60px';
  docHdr.appendChild(logoWrap);docHdr.appendChild(hdrText);docHdr.appendChild(logoSpacer);
  doc.appendChild(docHdr);

  const hr1=document.createElement('hr');hr1.style.cssText='border:none;border-top:2px solid #1c2537;margin:12px 0 16px;';doc.appendChild(hr1);

  // Meta lines
  function metaLine(lbl,val){
    if(!val)return;
    const row=document.createElement('div');row.style.cssText='display:flex;gap:20px;margin-bottom:5px;font-size:13px;';
    const l=document.createElement('span');l.style.cssText='font-weight:700;min-width:110px;color:#1c2537;';l.innerHTML=lbl+':';
    const v=document.createElement('span');v.style.color='#333';v.textContent=val;
    row.appendChild(l);row.appendChild(v);doc.appendChild(row);
  }
  metaLine('Presiding',a.presiding);
  metaLine('Conducting',a.conducting);
  if(a.highCounselor)metaLine('Visiting HC',a.highCounselor+(a.stakeVisiting?' (Stake Business)':''));
  metaLine('Chorister',a.chorister);
  metaLine('Accompanist',a.accompanist);

  const hr2=document.createElement('hr');hr2.style.cssText='border:none;border-top:1px solid #ccc;margin:14px 0 16px;';doc.appendChild(hr2);

  // Helpers
  function agendaItem(lbl,val){
    const row=document.createElement('div');row.style.cssText='display:flex;gap:16px;margin-bottom:8px;font-size:13px;align-items:baseline;';
    const l=document.createElement('span');l.style.cssText='font-weight:700;min-width:130px;color:#1c2537;flex-shrink:0;';l.textContent=lbl+':';
    const v=document.createElement('span');v.style.color='#333';v.innerHTML=val;
    row.appendChild(l);row.appendChild(v);doc.appendChild(row);
  }
  function scriptPara(txt){
    if(!txt||!txt.trim())return;
    const p=document.createElement('p');
    p.style.cssText='font-size:13px;line-height:1.75;color:#555;font-style:italic;margin:8px 0 14px 0;padding-left:14px;border-left:3px solid #ddd;white-space:pre-wrap;';
    p.textContent=txt;doc.appendChild(p);
  }
  function sectionDiv(lbl){
    const d2=document.createElement('div');
    d2.style.cssText='font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#999;margin:18px 0 10px;';
    d2.textContent=lbl;doc.appendChild(d2);
  }

  const isFast=a.meetingType==='Fast & Testimony';

  // Welcome
  scriptPara(`Good afternoon brothers and sisters. We welcome you to the ${isFast?'Fast and Testimony Meeting':'Sacrament Meeting'} for the ${a.ward} of the Church of Jesus Christ of Latter-day Saints.`);

  // Introduction
  let intro=`My name is ${a.conducting||'[Conducting]'}. ${a.presiding?`${a.presiding}, who presides at today's meeting, has asked that I conduct.`:''}`;
  if(a.highCounselor)intro+=`\n\nWe welcome ${a.highCounselor} from the Stake High Council on the stand with us today.`;
  if(a.chorister||a.accompanist)intro+=`\n\nWe'd like to extend a special thank you to our Chorister ${a.chorister||'[Chorister]'} and our Accompanist ${a.accompanist||'[Accompanist]'} who will provide the music for today's meeting.`;
  scriptPara(intro.trim());

  // Announcements
  const annList=a.announcementList?a.announcementList.filter(Boolean):[];
  if(annList.length){
    sectionDiv('Announcements');
    scriptPara('By way of announcements:\n\n'+annList.map((x,i)=>annList.length>1?`${i+1}. ${x}`:x).join('\n'));
  }

  // Opening Hymn & Prayer
  scriptPara(`Our opening hymn will be hymn number ${a.openingHymnNum||'[hymn number]'}${a.openingHymnTitle?`, "${a.openingHymnTitle}"`:''}.  After the conclusion of the hymn ${a.openingPrayer||'[opening prayer]'} will offer our opening prayer.`);
  if(a.openingHymnNum||a.openingHymnTitle)
    agendaItem('Opening Hymn',`#${a.openingHymnNum||'—'}${a.openingHymnTitle?`, "${a.openingHymnTitle}"`:''}`);
  if(a.openingPrayer)agendaItem('Invocation',a.openingPrayer);

  // Stake Business
  if(a.highCounselor&&a.stakeVisiting){
    sectionDiv('Stake Business');
    scriptPara(`We'll now turn the time over to ${a.highCounselor} for some stake business.`);
    agendaItem('Stake Business',a.highCounselor);
  }

  // Ward Business
  const releases=a.releases?a.releases.filter(r=>r.member):[];
  const sustainings=a.sustainings?a.sustainings.filter(s=>s.member):[];
  const ords=a.ordinations?a.ordinations.filter(o=>o.member):[];
  const blessings=a.babyBlessingsList?a.babyBlessingsList.filter(Boolean):[];
  const confs=a.confirmationsList?a.confirmationsList.filter(Boolean):[];
  const newRecs=a.newRecordsList?a.newRecordsList.filter(Boolean):[];
  const hasWB=releases.length||sustainings.length||ords.length||blessings.length||confs.length||newRecs.length;

  if(hasWB){
    sectionDiv('Ward Business');
    scriptPara('Before we Continue with the Sacrament portion of our program, we have some Ward Business to take care of.');
    if(newRecs.length){
      scriptPara(`We'd like to welcome the following member${newRecs.length>1?'s':''} whose records have been received into our ward:\n\n${newRecs.join('\n')}`);
      agendaItem('New Record(s)',newRecs.join('<br>'));
    }
    if(releases.length){
      const pl=releases.length>1;
      scriptPara(`The following member${pl?'s have':' has'} been released from ${pl?'their':'his/her'} calling:\n\n${releases.map(r=>`${r.member}${r.calling?` as ${r.calling}`:''}`).join('\n')}\n\nWe propose that ${pl?'they':'he/she'} be given a vote of thanks for ${pl?'their':'his/her'} service. Those who wish to express their appreciation may manifest by the uplifted hand.`);

      // Release agenda items with optional "mark complete" checkbox for linked callings
      const relDiv=document.createElement('div');relDiv.style.cssText='margin-bottom:8px;';
      const relLblEl=document.createElement('span');relLblEl.style.cssText='font-weight:700;min-width:130px;font-size:13px;color:#1c2537;display:inline-block;';relLblEl.textContent='Release(s):';
      relDiv.appendChild(relLblEl);
      releases.forEach(r=>{
        const rrow=document.createElement('div');rrow.style.cssText='display:flex;align-items:center;gap:8px;margin-top:4px;padding-left:130px;font-size:13px;';
        const rname=document.createElement('span');rname.style.flex='1';rname.textContent=`${r.member}${r.calling?` — ${r.calling}`:''}`;
        rrow.appendChild(rname);
        if(r._callingId){
          const linkedC=state.callings.find(c=>c.id===r._callingId);
          if(linkedC){
            const steps=getSteps(linkedC);
            const relIdx=Math.max(steps.indexOf('Release Current'),steps.indexOf('Release over Pulpit'));
            const alreadyDone=relIdx>=0&&linkedC.currentStep>relIdx;
            const cb=document.createElement('input');cb.type='checkbox';cb.checked=alreadyDone;
            cb.title='Mark Release as complete in Callings';
            cb.style.cssText='width:16px;height:16px;cursor:pointer;accent-color:#1c7a45;';
            const cblbl=document.createElement('span');cblbl.style.cssText='font-size:11px;color:#888;white-space:nowrap;';cblbl.textContent='Mark released';
            cb.addEventListener('change',()=>{
              if(cb.checked){
                if(relIdx>=0){linkedC.stepDates[relIdx]=today();linkedC.currentStep=Math.max(linkedC.currentStep,relIdx+1);}
              } else {
                if(relIdx>=0){linkedC.stepDates[relIdx]=undefined;if(linkedC.currentStep===relIdx+1)linkedC.currentStep=relIdx;}
              }
              saveState();
            });
            rrow.appendChild(cb);rrow.appendChild(cblbl);
          }
        }
        relDiv.appendChild(rrow);
      });
      doc.appendChild(relDiv);
    }
    if(sustainings.length){
      const pl=sustainings.length>1;
      scriptPara(`The following member${pl?'s have':' has'} been called. If ${pl?'they are':'he/she is'} here, will ${pl?'they':'he/she'} please stand until after the vote is taken. We have called:\n\n${sustainings.map(s=>`${s.member}${s.calling?` as ${s.calling}`:''}`).join('\n')}\n\nWe propose that ${pl?'they':'he/she'} be sustained. Those in favor may manifest it by the uplifted hand. [Pause briefly for the sustaining vote.] Those opposed, if any, may manifest it. [Pause briefly to allow for a dissenting vote, if any.] Thank you.`);

      // Sustaining agenda items with optional "mark complete" checkbox for linked callings
      const susDiv=document.createElement('div');susDiv.style.cssText='margin-bottom:8px;';
      const susLblEl=document.createElement('span');susLblEl.style.cssText='font-weight:700;min-width:130px;font-size:13px;color:#1c2537;display:inline-block;';susLblEl.textContent='Sustaining(s):';
      susDiv.appendChild(susLblEl);

        const sname=document.createElement('span');sname.style.flex='1';sname.textContent=`${s.member}${s.calling?` — ${s.calling}`:''}`;
        srow.appendChild(sname);
        if(s._callingId){
          const linkedC=state.callings.find(c=>c.id===s._callingId);
          if(linkedC){
            const steps=getSteps(linkedC);
            const sustainIdx=Math.max(steps.indexOf('Sustain over Pulpit'),steps.indexOf('Sustain & Release over Pulpit'));
            const alreadyDone=sustainIdx>=0&&linkedC.currentStep>sustainIdx;
            const cb=document.createElement('input');cb.type='checkbox';cb.checked=alreadyDone;
            cb.title='Mark Sustain over Pulpit as complete in Callings';
            cb.style.cssText='width:16px;height:16px;cursor:pointer;accent-color:#1c7a45;';
            const cblbl=document.createElement('span');cblbl.style.cssText='font-size:11px;color:#888;white-space:nowrap;';cblbl.textContent='Mark sustained';
            cb.addEventListener('change',()=>{
              if(cb.checked){
                if(sustainIdx>=0){linkedC.stepDates[sustainIdx]=today();linkedC.currentStep=Math.max(linkedC.currentStep,sustainIdx+1);}
              } else {
                if(sustainIdx>=0){linkedC.stepDates[sustainIdx]=undefined;if(linkedC.currentStep===sustainIdx+1)linkedC.currentStep=sustainIdx;}
              }
              saveState();
            });
            srow.appendChild(cb);srow.appendChild(cblbl);
          }
        }
        susDiv.appendChild(srow);
      });
      doc.appendChild(susDiv);
    }
    if(ords.length){
      ords.forEach(o=>scriptPara(`We will now proceed with the ordination of ${o.member} to the office of ${o.office} in the ${['Deacon','Teacher','Priest'].includes(o.office)?'Aaronic':'Melchizedek'} Priesthood.`));
      agendaItem('Ordination(s)',ords.map(o=>`${o.member} — ${o.office}`).join('<br>'));
    }
    if(blessings.length){
      scriptPara(`We will now proceed with the blessing of the following child${blessings.length>1?'ren':''}:\n\n${blessings.join('\n')}`);
      agendaItem('Baby Blessing(s)',blessings.join('<br>'));
    }
    if(confs.length){
      scriptPara(`We will now proceed with the confirmation of the following individual${confs.length>1?'s':''}:\n\n${confs.join('\n')}`);
      agendaItem('Confirmation(s)',confs.join('<br>'));
    }
  }

  // Sacrament
  sectionDiv('Sacrament');
  scriptPara(`We will now prepare for the partaking of the Sacrament by singing hymn #${a.sacramentHymnNum||'[hymn number]'}${a.sacramentHymnTitle?`, "${a.sacramentHymnTitle}"`:''}.  Following the hymn, the Sacrament will be administered by the Aaronic Priesthood.`);
  if(a.sacramentHymnNum||a.sacramentHymnTitle)
    agendaItem('Sacrament Hymn',`#${a.sacramentHymnNum||'—'}${a.sacramentHymnTitle?`, "${a.sacramentHymnTitle}"`:''}`);
  agendaItem('Administration','Sacrament administered by the Aaronic Priesthood');

  // Program
  sectionDiv(isFast?'Fast & Testimony':'Program');
  if(isFast){
    scriptPara('We will now open the meeting for the bearing of testimonies. We invite all who feel so inclined to come to the podium and share their testimony.');
  } else {
    const spk=[];
    if(a.speaker1)spk.push({name:a.speaker1,topic:a.speaker1Topic});
    if(a.speaker2)spk.push({name:a.speaker2,topic:a.speaker2Topic});
    if(spk.length||a.finalSpeaker){
      let prog="We'd like to thank the Aaronic Priesthood for the reverent manner in which they administered the Sacrament.\n\nThe remainder of our program will go as follows:\n\n";
      if(spk.length>0) prog+=`- We will first be privileged to hear from ${spk[0].name}.`;
      if(spk.length>1) prog+=`\n\n- Following ${spk[0].name}'s remarks we will be pleased to hear from ${spk[1].name}.`;
      if(a.intermediateHymn||a.intermediateHymnTitle) prog+=`\n\n- Our Intermediate Hymn will be ${a.intermediateHymn?`#${a.intermediateHymn}`:''}${a.intermediateHymn&&a.intermediateHymnTitle?', ':''}${a.intermediateHymnTitle||''}.`;
      if(a.finalSpeaker) prog+=`\n\n- And our concluding speaker will be ${a.finalSpeaker}.`;
      scriptPara(prog.trim());
    }
    spk.forEach(s=>{
      agendaItem('Speaker',s.name);
    });
    if(a.intermediateHymn||a.intermediateHymnTitle){
      agendaItem('Intermediate',`${a.intermediateHymn?`#${a.intermediateHymn} `:''}${a.intermediateHymnTitle?`"${a.intermediateHymnTitle}"`:''}` );
    }
    if(a.finalSpeaker){
      agendaItem('Final Speaker',a.finalSpeaker);
    }
  }

  // Closing
  sectionDiv('Closing');
  scriptPara(`I'd like to thank our speakers for the spirit that was felt here today.\n\nOur closing hymn will be hymn #${a.closingHymnNum||'[hymn number]'}${a.closingHymnTitle?`, "${a.closingHymnTitle}"`:''}.\n\nAfter the hymn the closing prayer will be offered by ${a.closingPrayer||'[closing prayer]'}.`);
  if(a.closingHymnNum||a.closingHymnTitle)
    agendaItem('Closing Hymn',`#${a.closingHymnNum||'—'}${a.closingHymnTitle?`, "${a.closingHymnTitle}"`:''}`);
  if(a.closingPrayer)agendaItem('Benediction',a.closingPrayer);

  el.appendChild(doc);
}




function renderCallingDetail(el,role){
  const c=state.callings.find(x=>x.id===state.detailId);if(!c)return;
  if(!c.stepMeta)c.stepMeta={};
  const steps=getSteps(c),status=getStatusBadge(c);
  const canEdit=canAdvanceWorkflow(role)&&!isReadOnly(role);

  // ── Header: calling prominent, member below ──────────────────────────────
  const hdr=document.createElement('div');hdr.className='detail-header';
  const bb=document.createElement('button');bb.className='back-btn';bb.innerHTML='&larr;';bb.addEventListener('click',()=>{state.view='list';state.detailId=null;render();});
  const hdi=document.createElement('div');
  hdi.innerHTML=`<div class="detail-calling">${c.calling}${c.custom?' <span class="badge badge-teal" style="font-size:11px;vertical-align:middle">Custom</span>':''}</div><div class="detail-member">${c.name}</div>`;
  hdr.appendChild(bb);hdr.appendChild(hdi);

  // Edit button — right side of header
  if(canEdit){
    const editBtn=document.createElement('button');
    editBtn.style.cssText='margin-left:auto;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid rgba(0,0,0,0.15);color:#1c2537;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;flex-shrink:0;transition:background 0.15s;';
    editBtn.innerHTML='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> Edit';
    editBtn.addEventListener('mouseenter',()=>{editBtn.style.background='#f5f7ff';});
    editBtn.addEventListener('mouseleave',()=>{editBtn.style.background='#fff';});
    editBtn.addEventListener('click',()=>openCallingEditModal(c,role));
    hdr.appendChild(editBtn);
  }

  el.appendChild(hdr);

  if(isReadOnly(role)){const ro=document.createElement('div');ro.className='read-only-notice';ro.innerHTML='<span>&#128065;</span><span>View only.</span>';el.appendChild(ro);}

  // ── Info grid ─────────────────────────────────────────────────────────────
  const info=document.createElement('div');info.className='info-grid';
  info.innerHTML=`<div><div class="info-cell-label">Ward</div><div class="info-cell-value">${c.ward}</div></div><div><div class="info-cell-label">Organization</div><div class="info-cell-value">${c.org}</div></div><div><div class="info-cell-label">Level</div><div class="info-cell-value">${c.level}</div></div><div><div class="info-cell-label">Action</div><div class="info-cell-value">${c.action}</div></div><div><div class="info-cell-label">Status</div><div class="info-cell-value"><span class="badge ${status.cls}">${status.label}</span></div></div><div><div class="info-cell-label">Submitted</div><div class="info-cell-value">${fmt(c.submittedDate)}</div></div>`;
  el.appendChild(info);

  // Member extra info
  const mi=document.createElement('div');mi.className='info-grid';mi.style.marginTop='4px';
  let miHTML='';
  if(c.memberCallings&&c.memberCallings.length>0){
    const callingsDisplay=c.memberCallings.map(cl=>`<div style="display:flex;align-items:center;gap:6px;">${cl} <span class="badge badge-amber" style="font-size:10px">To be released</span></div>`).join('');
    miHTML+=`<div><div class="info-cell-label">Callings to Release</div><div class="info-cell-value">${callingsDisplay}</div></div>`;
  } else if(c.memberCurrentCalling){
    miHTML+=`<div><div class="info-cell-label">Current Calling</div><div class="info-cell-value">${c.memberCurrentCalling}${c.memberNeedsRelease?' <span class="badge badge-amber" style="font-size:10px">To be released</span>':''}</div></div>`;
  }
  if(c.spouseName){miHTML+=`<div><div class="info-cell-label">Spouse</div><div class="info-cell-value">${c.spouseName}</div></div>`;}
  if(c.spouseCalling){miHTML+=`<div><div class="info-cell-label">Spouse's Calling</div><div class="info-cell-value">${c.spouseCalling}</div></div>`;}
  if(miHTML){mi.innerHTML=miHTML;el.appendChild(mi);}

  if(c.currentlyFilled&&c.releaseName){
    const rb=document.createElement('div');rb.className='currently-filled-box';rb.style.margin='12px 0';
    rb.innerHTML=`<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:#7a5400;margin-bottom:6px;">Current Holder — To Be Released</div><div style="font-size:14px;font-weight:600;color:#1c2537">${c.releaseName}</div><div style="font-size:12px;color:#666;margin-top:2px">${c.calling}</div>`;
    el.appendChild(rb);
  }
  if(c.notes){
    const nb=document.createElement('div');nb.style.cssText='font-size:12px;color:#666;background:#f8f9fb;border-radius:8px;padding:10px 12px;margin-bottom:8px;';
    nb.innerHTML=`<span style="font-weight:600;color:#888;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;">Notes</span><div style="margin-top:4px">${c.notes}</div>`;
    el.appendChild(nb);
  }

  const dv=document.createElement('div');dv.className='divider';el.appendChild(dv);
  const wl=document.createElement('div');wl.style.cssText='font-size:13px;font-weight:700;color:#1c2537;margin-bottom:8px;';wl.textContent='Workflow Progress';el.appendChild(wl);

  // ── Step list with checkboxes ─────────────────────────────────────────────
  const sl=document.createElement('div');sl.className='step-list';

  const allPrevDone=c.currentStep>=steps.length-1||c.stepDates[steps.length-1]!=null;

  steps.forEach((step,i)=>{
    if(step==='Completed'){
      // Render as special Complete step
      const compItem=document.createElement('div');compItem.className='step-item';
      const compRow=document.createElement('div');compRow.className='step-row';

      // Permission: stake presidency/admin for all callings; bishopric for ward callings
      const isStakeRole=role.scope==='stake'||role.scope==='admin';
      const isWardBishopricRole=role.scope==='ward'&&role.org==='Bishopric';
      const canComplete=(c.level==='Stake Issued'||c.level==='Stake')
        ? isStakeRole
        : isStakeRole||isWardBishopricRole;

      const compCb=document.createElement('div');
      compCb.className='step-cb'+(allPrevDone?' checked':'')+(canComplete?'':' disabled');
      if(allPrevDone)compCb.style.background='#1c7a45';

      const compBody=document.createElement('div');compBody.className='step-body';
      const compName=document.createElement('div');compName.className='step-name';
      compName.style.cssText='font-weight:700;color:'+(allPrevDone?'#1c7a45':'#1c2537')+';';
      compName.textContent='Complete';
      compBody.appendChild(compName);

      if(allPrevDone&&c.stepDates[i]){
        const dateEl=document.createElement('div');dateEl.className='step-date';
        dateEl.textContent='Completed '+fmt(c.stepDates[i]);
        compBody.appendChild(dateEl);
      }

      compCb.addEventListener('click',()=>{
        if(!canComplete)return;
        if(allPrevDone){
          // Uncheck — restore from snapshot if available
          if(c._completedSnapshot){
            c.currentStep=c._completedSnapshot.currentStep;
            c.stepDates=c._completedSnapshot.stepDates.slice();
            delete c._completedSnapshot;
          } else {
            // No snapshot — just revert to second-to-last step
            c.currentStep=steps.length-2;
            c.stepDates[steps.length-1]=undefined;
          }
          render();
        } else {
          // Save snapshot before completing
          c._completedSnapshot={
            currentStep:c.currentStep,
            stepDates:c.stepDates.slice()
          };
          // Complete all steps with today's date
          steps.forEach((_,si)=>{
            if(!c.stepDates[si])c.stepDates[si]=today();
          });
          c.currentStep=steps.length-1;
          c.stepDates[steps.length-1]=today();
          render();
        }
      });

      compRow.appendChild(compCb);compRow.appendChild(compBody);
      compItem.appendChild(compRow);sl.appendChild(compItem);
      return;
    } // Don't render the final "Completed" marker as a step
    const isDual=step===DUAL_STEP;
    const isChecked=i<c.currentStep;
    // A step is checkable if the previous step is checked (or it's step 0)
    // Unchecking is always allowed — it just lowers currentStep to i
    const prevChecked=i===0||(i-1)<c.currentStep;

    // Step-level permissions for Stake Issued / Stake callings
    let canCheckStep=canEdit&&prevChecked;
    if(canCheckStep&&(c.level==='Stake Issued'||c.level==='Stake')){
      const isStake=role.scope==='stake'||role.scope==='admin';
      const isWardBishopric=role.scope==='ward'&&role.org==='Bishopric';
      const isHighCouncilor=role.id==='high_council';
      // Steps a High Councilor can complete when assigned
      const hcSteps=["Set Appt to Extend","Extend Calling","Sustain over Pulpit","Set Apart",
                     "Set Appts to Extend & Release Current","Sustain & Release over Pulpit",
                     "Set Appt to Release","Release Current","Release over Pulpit"];
      if(step==="Bishop's Approval"||step==="Stake Presidency Approval"){
        canCheckStep=isStake||isWardBishopric;
      } else if(step==='Q12 Approval'){
        canCheckStep=isStake; // Stake Presidency records this, HC cannot
      } else if(isHighCouncilor&&hcSteps.includes(step)){
        canCheckStep=prevChecked; // HC can check these steps
      } else {
        canCheckStep=isStake;
      }
    }
    const canCheck=canCheckStep;

    const extendIdx=steps.indexOf('Extend Calling');
    const isAfterDeclined=c.declined&&extendIdx>=0&&i>extendIdx;
    const item=document.createElement('div');item.className='step-item';
    if(isAfterDeclined)item.style.opacity='0.35';

    // Top row
    const row=document.createElement('div');row.className='step-row';
    const cb=document.createElement('div');
    cb.className='step-cb'+(isChecked?' checked':'')+(canCheck&&!isAfterDeclined?'':' disabled');

    const body=document.createElement('div');body.className='step-body';
    const nameEl=document.createElement('div');nameEl.className='step-name';nameEl.textContent=step;
    body.appendChild(nameEl);

    // For dual step that is upcoming: show compact date pre-entry fields (optional, auto-filled on check)
    // ── SET APPT TO EXTEND (single) — date input ─────────────────────────────
    if(step==='Set Appt to Extend'&&prevChecked&&canCheck&&!isChecked){
      if(!c.stepMeta[i])c.stepMeta[i]={};
      const m=c.stepMeta[i];
      const row2=document.createElement('div');row2.style.cssText='display:flex;align-items:center;gap:8px;margin-top:10px;';
      const lbl2=document.createElement('span');lbl2.style.cssText='font-size:12px;color:#555;white-space:nowrap;';lbl2.textContent='Appointment Date:';
      const dateInp2=document.createElement('input');dateInp2.type='date';dateInp2.value=m.apptDate||'';
      dateInp2.style.cssText='font-size:12px;padding:4px 8px;border:1px solid rgba(0,0,0,0.15);border-radius:6px;color:#1c2537;cursor:pointer;';
      dateInp2.addEventListener('change',()=>{
        m.apptDate=dateInp2.value||null;
        if(m.apptDate){c.stepDates[i]=m.apptDate;c.currentStep=Math.max(c.currentStep,i+1);}
        else{c.stepDates[i]=undefined;if(c.currentStep===i+1)c.currentStep=i;}
        render();dbSaveCalling(c);
      });
      row2.appendChild(lbl2);row2.appendChild(dateInp2);body.appendChild(row2);
    }

    // ── SET APPT TO RELEASE (single) — date input ────────────────────────────
    if(step==='Set Appt to Release'&&prevChecked&&canCheck&&!isChecked){
      if(!c.stepMeta[i])c.stepMeta[i]={};
      const m=c.stepMeta[i];
      const row2=document.createElement('div');row2.style.cssText='display:flex;align-items:center;gap:8px;margin-top:10px;';
      const lbl2=document.createElement('span');lbl2.style.cssText='font-size:12px;color:#555;white-space:nowrap;';lbl2.textContent='Appointment Date:';
      const dateInp2=document.createElement('input');dateInp2.type='date';dateInp2.value=m.apptDate||'';
      dateInp2.style.cssText='font-size:12px;padding:4px 8px;border:1px solid rgba(0,0,0,0.15);border-radius:6px;color:#1c2537;cursor:pointer;';
      dateInp2.addEventListener('change',()=>{
        m.apptDate=dateInp2.value||null;
        if(m.apptDate){c.stepDates[i]=m.apptDate;c.currentStep=Math.max(c.currentStep,i+1);}
        else{c.stepDates[i]=undefined;if(c.currentStep===i+1)c.currentStep=i;}
        render();dbSaveCalling(c);
      });
      row2.appendChild(lbl2);row2.appendChild(dateInp2);body.appendChild(row2);
    }

    // ── SET APPTS TO EXTEND & RELEASE CURRENT — dual date inputs ─────────────
    if(isDual&&prevChecked&&canCheck&&!isChecked){
      if(!c.stepMeta[i])c.stepMeta[i]={};
      const m=c.stepMeta[i];
      function makeApptDateRow(label,key){
        const row2=document.createElement('div');row2.style.cssText='display:flex;align-items:center;gap:8px;margin-top:10px;';
        const lbl2=document.createElement('span');lbl2.style.cssText='font-size:12px;color:#555;white-space:nowrap;';lbl2.textContent=label+':';
        const dateInp2=document.createElement('input');dateInp2.type='date';dateInp2.value=m[key]||'';
        dateInp2.style.cssText='font-size:12px;padding:4px 8px;border:1px solid rgba(0,0,0,0.15);border-radius:6px;color:#1c2537;cursor:pointer;';
          dateInp2.addEventListener('change',()=>{
          m[key]=dateInp2.value||null;
          if(m.extendDate&&m.releaseDate){c.stepDates[i]=m.extendDate;c.currentStep=Math.max(c.currentStep,i+1);}
          else{c.stepDates[i]=undefined;if(c.currentStep===i+1)c.currentStep=i;}
          render();dbSaveCalling(c);
        });
        row2.appendChild(lbl2);row2.appendChild(dateInp2);return row2;
      }
      body.appendChild(makeApptDateRow('Extend Calling Appt','extendDate'));
      body.appendChild(makeApptDateRow('Release Current Holder Appt','releaseDate'));
    }

    // ── EXTEND CALLING — Accepted/Declined toggle ────────────────────────────
    if(step==='Extend Calling'&&prevChecked&&canCheck&&!isChecked){
      if(!c.stepMeta[i])c.stepMeta[i]={};
      const response=c.stepMeta[i].response;
      const toggleRow=document.createElement('div');toggleRow.style.cssText='display:flex;gap:8px;margin-top:8px;';
      ['Accepted','Declined'].forEach(opt=>{
        const btn=document.createElement('button');
        const isSel=response===opt;
        btn.textContent=(opt==='Accepted'?'✓ ':'✗ ')+opt;
        btn.style.cssText=`padding:5px 14px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:2px solid ${isSel?(opt==='Accepted'?'#1c7a45':'#c62828'):'#ddd'};background:${isSel?(opt==='Accepted'?'#e6f7ee':'#fdecea'):'#fff'};color:${isSel?(opt==='Accepted'?'#1c7a45':'#c62828'):'#888'};`;
        btn.addEventListener('click',()=>{
          c.stepMeta[i].response=opt;
          c.stepDates[i]=today();
          c.currentStep=Math.max(c.currentStep,i+1);
          if(opt==='Declined'){
            c.declined=true;
            if(!c._declinedSnapshot)c._declinedSnapshot={currentStep:c.currentStep,stepDates:c.stepDates.slice()};
            getSteps(c).forEach((_,si)=>{if(!c.stepDates[si])c.stepDates[si]=today();});
            c.currentStep=getSteps(c).length-1;
          } else {
            c.declined=false;
            if(c._declinedSnapshot){c.currentStep=c._declinedSnapshot.currentStep;c.stepDates=c._declinedSnapshot.stepDates.slice();delete c._declinedSnapshot;}
          }
          render();dbSaveCalling(c);
        });
        toggleRow.appendChild(btn);
      });
      body.appendChild(toggleRow);
    }

    // Note on Extend Calling step if member needs release from prior calling
    if(step==='Extend Calling'&&c.memberNeedsRelease&&c.memberCurrentCalling){
      const note=document.createElement('div');
      note.style.cssText='font-size:11px;color:#a05c00;background:#fef3e2;border-radius:6px;padding:4px 8px;margin-top:4px;display:inline-block;';
      note.textContent=`Also release ${c.name} from ${c.memberCurrentCalling}`;
      body.appendChild(note);
    }

    // Note on Release Current step showing who is being released
    if(step==='Release Current'&&c.currentlyFilled&&c.releaseName){
      const note=document.createElement('div');
      note.style.cssText='font-size:11px;color:#a05c00;background:#fef3e2;border-radius:6px;padding:4px 8px;margin-top:4px;display:inline-block;';
      note.textContent=`${c.releaseName} as ${c.calling}`;
      body.appendChild(note);
    }

    // Date info under completed step — with pencil to edit
    if(isChecked){
      if(isDual){
        const m=c.stepMeta[i]||{};
        ['extendDate','releaseDate'].forEach(key=>{
          const lbl=key==='extendDate'?'Extend appt':'Release appt';
          const val=m[key]||'';
          const wrap=document.createElement('div');wrap.style.cssText='display:flex;align-items:center;gap:6px;margin-top:3px;';
          const txt=document.createElement('span');txt.className='step-date';txt.textContent=lbl+': '+fmt(val);
          const pencil=document.createElement('span');
          pencil.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>';
          pencil.style.cssText='display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border:1px solid rgba(0,0,0,0.18);border-radius:4px;cursor:pointer;color:#666;background:#fff;flex-shrink:0;transition:background 0.15s,border-color 0.15s;';
          pencil.title='Edit date';
          pencil.addEventListener('mouseenter',()=>{pencil.style.background='#f0f4ff';pencil.style.borderColor='#1c2537';pencil.style.color='#1c2537';});
          pencil.addEventListener('mouseleave',()=>{pencil.style.background='#fff';pencil.style.borderColor='rgba(0,0,0,0.18)';pencil.style.color='#666';});
          // Toggle inline editor
          let editing=false;
          pencil.addEventListener('click',e=>{
            e.stopPropagation();
            if(editing){return;}editing=true;
            const inp=document.createElement('input');inp.type='date';inp.className='compact';inp.value=val;
            inp.style.marginLeft='4px';
            wrap.replaceChildren(txt,inp);
            inp.focus();
            function save(){
              if(!c.stepMeta[i])c.stepMeta[i]={};
              c.stepMeta[i][key]=inp.value||val;
              if(key==='extendDate')c.stepDates[i]=inp.value||val;
              render();dbSaveCalling(c);
            }
            inp.addEventListener('blur',save);
            inp.addEventListener('keydown',e=>{if(e.key==='Enter')save();});
          });
          wrap.appendChild(txt);if(canEdit)wrap.appendChild(pencil);
          body.appendChild(wrap);
        });
      } else if(c.stepDates[i]){
        const wrap=document.createElement('div');wrap.style.cssText='display:flex;align-items:center;gap:6px;margin-top:3px;';
        const txt=document.createElement('span');txt.className='step-date';txt.textContent='Completed '+fmt(c.stepDates[i]);
        const pencil=document.createElement('span');
        pencil.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>';
        pencil.style.cssText='display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border:1px solid rgba(0,0,0,0.18);border-radius:4px;cursor:pointer;color:#666;background:#fff;flex-shrink:0;transition:background 0.15s,border-color 0.15s;';
        pencil.title='Edit date';
        pencil.addEventListener('mouseenter',()=>{pencil.style.background='#f0f4ff';pencil.style.borderColor='#1c2537';pencil.style.color='#1c2537';});
        pencil.addEventListener('mouseleave',()=>{pencil.style.background='#fff';pencil.style.borderColor='rgba(0,0,0,0.18)';pencil.style.color='#666';});
        let editing=false;
        pencil.addEventListener('click',e=>{
          e.stopPropagation();
          if(editing)return;editing=true;
          const inp=document.createElement('input');inp.type='date';inp.className='compact';inp.value=c.stepDates[i];
          inp.style.marginLeft='4px';
          wrap.replaceChildren(txt,inp);
          inp.focus();
          function save(){c.stepDates[i]=inp.value||c.stepDates[i];render();dbSaveCalling(c);}
          inp.addEventListener('blur',save);
          inp.addEventListener('keydown',e=>{if(e.key==='Enter')save();});
        });
        wrap.appendChild(txt);if(canEdit)wrap.appendChild(pencil);
        body.appendChild(wrap);
      }
    }

    row.appendChild(cb);row.appendChild(body);
    item.appendChild(row);

    // ── Checkbox click handler ─────────────────────────────────────────────
    const isApptStep=step==='Set Appt to Extend'||step==='Set Appt to Release'||isDual;
    cb.addEventListener('click',()=>{
      if(!canCheck)return;
      if(isApptStep)return; // auto-checks only via date input
      if(isChecked){
        // Uncheck: revert
        c.currentStep=i;
        c.stepDates[i]=undefined;
        if(isDual)delete c.stepMeta[i];
        render();dbSaveCalling(c);
      } else {
        // Check: mark complete with today's date
        if(isDual){
          if(!c.stepMeta[i])c.stepMeta[i]={};
          if(!c.stepMeta[i].extendDate)c.stepMeta[i].extendDate=today();
          if(!c.stepMeta[i].releaseDate)c.stepMeta[i].releaseDate=today();
          c.stepDates[i]=c.stepMeta[i].extendDate;
        } else {
          c.stepDates[i]=today();
        }
        c.currentStep=Math.max(c.currentStep,i+1);
        render();dbSaveCalling(c);
      }
    });

    sl.appendChild(item);
  });

  el.appendChild(sl);

  // Delete button (admin and workflow-eligible roles only)
  if(canEdit){
    const delDivider=document.createElement('div');delDivider.className='divider';el.appendChild(delDivider);
    const delBtn=document.createElement('button');
    delBtn.style.cssText='background:transparent;border:1px solid #e57373;color:#c62828;padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;';
    delBtn.textContent='Delete Calling';
    delBtn.addEventListener('mouseenter',()=>{delBtn.style.background='#fff5f5';});
    delBtn.addEventListener('mouseleave',()=>{delBtn.style.background='transparent';});
    delBtn.addEventListener('click',()=>{
      if(confirm(`Delete the calling for "${c.calling} — ${c.name}"? This cannot be undone.`)){
        const deletedId=c.id;
        state.callings=state.callings.filter(x=>x.id!==c.id);
        state.view='list';state.detailId=null;
        render();dbDeleteCalling(deletedId);
      }
    });
    el.appendChild(delBtn);
  }
}


function renderCallings(el,role){
  el.innerHTML=`<div class="page-title">Callings Tracker</div><div class="page-sub">${scopeLabel(role)}</div>`;
  const hdr=document.createElement('div');hdr.className='section-header';hdr.innerHTML='<span class="section-title">All Callings</span>';
  if(!isReadOnly(role)){const btn=document.createElement('button');btn.className='btn-primary';btn.textContent='+ New Calling';btn.addEventListener('click',()=>openCallingModal(role));hdr.appendChild(btn);}
  el.appendChild(hdr);
  if(isReadOnly(role)){const ro=document.createElement('div');ro.className='read-only-notice';ro.innerHTML='<span>&#128065;</span><span>View only.</span>';el.appendChild(ro);}
  const lf=getLevelFilters(role);
  if(lf.length>1){const fr=document.createElement('div');fr.className='filter-row';lf.forEach(f=>{const chip=document.createElement('button');chip.className='filter-chip'+(state.filterLevel===f?' active':'');chip.textContent=f;chip.addEventListener('click',()=>{state.filterLevel=f;render();});fr.appendChild(chip);});el.appendChild(fr);}
  let list=filterCallings(state.callings,role);
  // Only show active (non-completed) callings here
  list=list.filter(c=>c.currentStep<getSteps(c).length-1);
  if(state.filterLevel!=='All')list=list.filter(c=>c.level===state.filterLevel);

  // Archive link
  const archiveRow=document.createElement('div');archiveRow.style.cssText='display:flex;justify-content:flex-end;margin-bottom:10px;';
  const archiveLink=document.createElement('a');archiveLink.href='#';archiveLink.style.cssText='font-size:13px;font-weight:600;color:#185fa5;text-decoration:none;';
  const completedCount=filterCallings(state.callings,role).filter(c=>c.currentStep>=getSteps(c).length-1).length;
  archiveLink.textContent=`Callings Archive (${completedCount}) →`;
  archiveLink.addEventListener('click',e=>{e.preventDefault();state.view='archive';render();});
  archiveRow.appendChild(archiveLink);el.appendChild(archiveRow);

  if(!list.length){const es=document.createElement('div');es.className='empty-state';es.textContent='No active callings to display';el.appendChild(es);return;}

  const COLS=[
    {key:'calling', label:'Calling',  val:c=>c.calling},
    {key:'name',    label:'Member',   val:c=>c.name},
    {key:'ward',    label:'Ward',     val:c=>c.ward},
    {key:'level',   label:'Level',    val:c=>c.level},
    {key:'action',  label:'Action',   val:c=>c.action},
    {key:'status',  label:'Status',   val:c=>getStatusBadge(c).label},
    {key:'progress',label:'Progress', val:c=>c.currentStep/(getSteps(c).length-1)},
    {key:'next',    label:'Next Step',val:c=>c.currentStep<getSteps(c).length?getSteps(c)[c.currentStep]:''},
  ];

  // Apply sort
  const {col:sortCol,dir:sortDir}=state.callingsSort;
  if(sortCol){
    const colDef=COLS.find(c=>c.key===sortCol);
    if(colDef){
      list=[...list].sort((a,b)=>{
        const av=colDef.val(a),bv=colDef.val(b);
        const cmp=typeof av==='number'?av-bv:String(av).localeCompare(String(bv));
        return sortDir==='asc'?cmp:-cmp;
      });
    }
  }

  const table=document.createElement('table');table.className='callings-table';
  const thead=document.createElement('thead');
  const hrow=document.createElement('tr');
  COLS.forEach(col=>{
    const th=document.createElement('th');
    th.textContent=col.label;
    if(sortCol===col.key) th.className=sortDir==='asc'?'sort-asc':'sort-desc';
    th.addEventListener('click',()=>{
      if(state.callingsSort.col===col.key){
        state.callingsSort.dir=state.callingsSort.dir==='asc'?'desc':'asc';
      } else {
        state.callingsSort={col:col.key,dir:'asc'};
      }
      render();
    });
    hrow.appendChild(th);
  });
  thead.appendChild(hrow);
  table.appendChild(thead);

  const tbody=document.createElement('tbody');
  list.forEach(c=>{
    const steps=getSteps(c),status=getStatusBadge(c),lvl=getLevelBadge(c.level),pct=Math.round((c.currentStep/(steps.length-1))*100);
    const tr=document.createElement('tr');
    // Badge disappears once Release Current step is checked
    const steps_=getSteps(c);
    const releaseStepIdx=steps_.indexOf('Release Current');
    const releaseStepDone=releaseStepIdx>=0&&c.currentStep>releaseStepIdx;
    const holderBadge=c.currentlyFilled&&c.releaseName&&!releaseStepDone
      ?`<span class="badge badge-amber" style="font-size:10px;margin-left:4px;">⚠ Release ${c.releaseName}</span>`:'';
    const declinedBadge=c.declined?`<span class="badge" style="font-size:10px;margin-left:4px;background:#fdecea;color:#c62828;">✗ Declined</span>`:'';
    tr.innerHTML=`
      <td class="td-calling">${c.calling}${c.custom?' <span class="badge badge-teal" style="font-size:10px">Custom</span>':''}${holderBadge}</td>
      <td>${c.name}</td>
      <td class="td-sub">${c.ward}</td>
      <td><span class="badge ${lvl.cls}">${lvl.label}</span></td>
      <td class="td-sub">${c.action}</td>
      <td><span class="badge ${status.cls}">${status.label}</span></td>
      <td class="progress-cell">
        <div style="font-size:11px;color:#aaa;">${c.currentStep} / ${steps.length-1}</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      </td>
      <td class="td-sub">${c.currentStep<steps.length?steps[c.currentStep]:'—'}</td>`;
    tr.addEventListener('click',()=>{state.view='detail';state.detailId=c.id;render();});
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  el.appendChild(table);
}

function render(){
  if(state.tab==='dashboard')state.tab='callings';
  updateChrome();
  saveState();
  const el=document.getElementById('content');el.innerHTML='';
  const role=getRole();
  if(state.loading){
    el.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:300px;flex-direction:column;gap:14px;color:#aaa;"><div style="font-size:28px;">⏳</div><div style="font-size:14px;font-weight:500;">Loading from Supabase...</div></div>';
    return;
  }
  if(state.tab==='callings'){if(state.view==='detail')renderCallingDetail(el,role);else if(state.view==='archive')renderArchive(el,role);else renderCallings(el,role);}
  else if(state.tab==='agendas'){if(state.view==='detail')renderAgendaDetail(el,role);else if(state.view==='new'){const editingA=state.detailId&&window._agendaDraft?state.agendas.find(a=>a.id===state.detailId):null;renderAgendaWizard(el,role,editingA);}else renderAgendas(el,role);}
  if(state.tab==='callings'){if(state.view==='detail')renderCallingDetail(el,role);else if(state.view==='archive')renderArchive(el,role);else renderCallings(el,role);}
  else if(state.tab==='agendas'){if(state.view==='detail')renderAgendaDetail(el,role);else if(state.view==='new'){const editingA=state.detailId&&window._agendaDraft?state.agendas.find(a=>a.id===state.detailId):null;renderAgendaWizard(el,role,editingA);}else renderAgendas(el,role);}
  else if(state.tab==='users'){renderUsers(el,role);}
}

async function renderUsers(el,role){
  const isStake=role.scope==='admin'||role.scope==='stake';
  const isWardRole=role.scope==='ward';

  el.innerHTML=`<div class="page-title">User Management</div><div class="page-sub">${isStake?'Manage all users across the stake':'Manage users in '+role.ward}</div>`;

  // Loading indicator
  const loadWrap=document.createElement('div');loadWrap.style.cssText='text-align:center;padding:32px;color:#aaa;font-size:13px;';loadWrap.textContent='Loading users…';
  el.appendChild(loadWrap);

  // Load profiles from Supabase
  let query=sb.from('profiles').select('*').order('full_name',{ascending:true});
  if(isWardRole) query=query.eq('ward',role.ward);
  const{data:profiles,error}=await query;
  if(error){loadWrap.textContent='Error loading users.';console.error(error);return;}
  loadWrap.remove();

  // Header with invite button
  const hdr=document.createElement('div');hdr.className='section-header';
  hdr.innerHTML='<span class="section-title">Users</span>';
  const inviteBtn=document.createElement('button');inviteBtn.className='btn-primary';inviteBtn.textContent='+ Invite User';
  inviteBtn.addEventListener('click',()=>openInviteModal(role,()=>{state.tab='users';render();}));
  hdr.appendChild(inviteBtn);
  el.appendChild(hdr);

  if(!profiles||profiles.length===0){
    const empty=document.createElement('div');empty.className='empty-state';empty.textContent='No users yet. Invite someone to get started.';
    el.appendChild(empty);return;
  }

  // Role color/label helpers
  const roleInfo=(rid)=>{const r=ROLES.find(x=>x.id===rid);return r||{label:rid,color:'#aaa'};};

  // Table
  const wrap=document.createElement('div');wrap.style.cssText='background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.07);';
  const tbl=document.createElement('table');tbl.className='user-table';
  tbl.innerHTML=`<thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Ward</th><th></th></tr></thead>`;
  const tbody=document.createElement('tbody');

  profiles.forEach(p=>{
    const ri=roleInfo(p.role_id);
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td style="font-weight:600;">${p.full_name||'—'}</td>
      <td style="color:#666;">${p.email}</td>
      <td><span class="user-badge" style="background:${ri.color}22;color:${ri.color};">${ri.label}</span></td>
      <td style="color:#666;">${p.ward||'—'}</td>
      <td style="text-align:right;"></td>
    `;
    // Edit button
    const editTd=tr.querySelector('td:last-child');
    const editBtn=document.createElement('button');
    editBtn.style.cssText='background:transparent;border:1px solid rgba(0,0,0,0.12);color:#1c2537;padding:4px 12px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;';
    editBtn.textContent='Edit';
    editBtn.addEventListener('click',()=>openEditUserModal(p,role,()=>{state.tab='users';render();}));
    editTd.appendChild(editBtn);
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);
  wrap.appendChild(tbl);
  el.appendChild(wrap);
}

function openInviteModal(callerRole,onDone){
  const root=document.getElementById('modal-root');root.innerHTML='';
  const overlay=document.createElement('div');overlay.className='modal-overlay';
  overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal();});
  const modal=document.createElement('div');modal.className='modal';
  modal.innerHTML='<div class="modal-handle"></div>';

  const title=document.createElement('div');title.className='modal-title';title.textContent='Invite New User';modal.appendChild(title);
  const sub=document.createElement('div');sub.style.cssText='font-size:13px;color:#888;margin-bottom:20px;';
  sub.textContent='They\'ll receive an email to set their password.';modal.appendChild(sub);

  const errEl=document.createElement('div');errEl.className='auth-error';modal.appendChild(errEl);

  // Fields
  function fg(lbl,el){const g=document.createElement('div');g.className='form-group';const l=document.createElement('label');l.className='form-label';l.innerHTML=lbl;g.appendChild(l);g.appendChild(el);modal.appendChild(g);return el;}

  const nameInp=document.createElement('input');nameInp.type='text';nameInp.placeholder='Full name';fg('Full Name<span class="req">*</span>',nameInp);
  const emailInp=document.createElement('input');emailInp.type='email';emailInp.placeholder='email@example.com';fg('Email<span class="req">*</span>',emailInp);

  // Role selector — stake can assign any role; bishop can only assign ward roles
  const isStake=callerRole.scope==='admin'||callerRole.scope==='stake';
  const availableRoles=isStake?ROLES:ROLES.filter(r=>r.scope==='ward'&&(r.ward===callerRole.ward||!r.ward));
  const roleSel=document.createElement('select');
  availableRoles.forEach(r=>{const o=document.createElement('option');o.value=r.id;o.textContent=r.label;roleSel.appendChild(o);});
  fg('Role<span class="req">*</span>',roleSel);

  // Ward selector
  const wardSel=document.createElement('select');
  const wardOpts=isStake?['','Stake',...WARDS_ONLY]:['',callerRole.ward];
  wardOpts.forEach(w=>{const o=document.createElement('option');o.value=w;o.textContent=w||'— Select ward —';wardSel.appendChild(o);});
  if(!isStake&&callerRole.ward){wardSel.value=callerRole.ward;}
  fg('Ward',wardSel);

  // Temp password
  const passInp=document.createElement('input');passInp.type='password';passInp.placeholder='Temporary password';fg('Temporary Password<span class="req">*</span>',passInp);

  const saveBtn=document.createElement('button');saveBtn.className='btn-primary';
  saveBtn.style.cssText='width:100%;padding:12px;font-size:14px;border-radius:10px;margin-top:4px;';
  saveBtn.textContent='Create User';
  saveBtn.addEventListener('click',async()=>{
    const name=nameInp.value.trim();
    const email=emailInp.value.trim();
    const password=passInp.value;
    const role_id=roleSel.value;
    const ward=wardSel.value||null;
    errEl.classList.remove('visible');
    if(!name||!email||!password){errEl.textContent='Please fill in all required fields.';errEl.classList.add('visible');return;}
    saveBtn.disabled=true;saveBtn.textContent='Creating…';

    // Use Supabase admin API via service role — but we only have anon key in frontend.
    // Instead: create user via signUp (with autoconfirm), then upsert their profile.
    const{data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:name}}});
    if(error){errEl.textContent=error.message;errEl.classList.add('visible');saveBtn.disabled=false;saveBtn.textContent='Create User';return;}

    // Upsert profile
    if(data.user){
      await sb.from('profiles').upsert({id:data.user.id,email,full_name:name,role_id,ward},{ onConflict:'id'});
    }
    closeModal();onDone();
  });
  modal.appendChild(saveBtn);
  overlay.appendChild(modal);root.appendChild(overlay);
}

  saveBtn.textContent='Save Changes';
  saveBtn.addEventListener('click',async()=>{
    saveBtn.disabled=true;saveBtn.textContent='Saving…';
    const{error}=await sb.from('profiles').update({
      full_name:nameInp.value.trim(),
      role_id:roleSel.value,
      ward:wardSel.value||null,
    }).eq('id',profile.id);
    if(error){errEl.textContent=error.message;errEl.classList.add('visible');saveBtn.disabled=false;saveBtn.textContent='Save Changes';return;}
    closeModal();onDone();
  });
  modal.appendChild(saveBtn);

  // Delete user (superadmin only)
  if(isSuperAdmin()&&profile.id!==currentUser?.id){
    const delBtn=document.createElement('button');
    delBtn.style.cssText='width:100%;margin-top:8px;background:transparent;border:1px solid #e57373;color:#c62828;padding:10px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;';
    delBtn.textContent='Remove User';
    delBtn.addEventListener('click',async()=>{
      if(!confirm(`Remove ${profile.full_name||profile.email}? This will delete their profile (not their login).`))return;
      await sb.from('profiles').delete().eq('id',profile.id);
      closeModal();onDone();
    });
    modal.appendChild(delBtn);
  }

  overlay.appendChild(modal);root.appendChild(overlay);
}
</script>
</body>
</html>
