// ── PDF generation ────────────────────────────────────────────────────────────
async function generateAgendaPDF(a, role){
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'letter'});
  const pw = doc.internal.pageSize.getWidth();
  const lm=18, rm=18, tm=18;
  let y = tm;

  // Get favicon base64 for the Christus logo
  const faviconEl=document.querySelector('link[rel="icon"]');
  const faviconB64=faviconEl?faviconEl.href.split(',')[1]||'':'';

  // Header: Christus image left, title center
  if(faviconB64){
    try{doc.addImage('data:image/png;base64,'+faviconB64,'PNG',lm,y,18,18);}catch(e){}
  }
  doc.setFont('helvetica','bold');
  doc.setFontSize(15);
  const types=getMeetingTypes(role);
  const mt=types.find(t=>t.key===a.meetingCategory)||{label:a.meetingCategory||'Meeting'};
  doc.text(mt.label, pw/2, y+7, {align:'center'});
  doc.setFont('helvetica','normal');
  doc.setFontSize(10);
  doc.setTextColor(100);
  doc.text(`${a.ward} · ${fmtDate(a.date)}`, pw/2, y+13, {align:'center'});
  doc.setTextColor(0);
  y+=24;

  // Divider
  doc.setDrawColor(28,37,55);doc.setLineWidth(0.5);
  doc.line(lm,y,pw-rm,y);
  y+=6;

  // Field rows
  doc.setFontSize(11);
  function pdfRow(label, value){
    if(!value) return;
    doc.setFont('helvetica','bold');
    doc.text(label+':', lm, y);
    doc.setFont('helvetica','normal');
    const wrapped=doc.splitTextToSize(value, pw-rm-lm-36);
    doc.text(wrapped, lm+38, y);
    y+=(wrapped.length*5.5)+2;
    if(y>260){doc.addPage();y=tm;}
  }

  pdfRow('Conducting', a.conducting);
  pdfRow('Opening Prayer', a.openingPrayer);
  if(a.openingHymnNum||a.openingHymnTitle)
    pdfRow('Opening Hymn', `#${a.openingHymnNum||'—'}${a.openingHymnTitle?' — '+a.openingHymnTitle:''}`);

  const thoughtLabel=a.meetingType&&['Spiritual Thought','Handbook Moment','Devotional'].includes(a.meetingType)?a.meetingType:'Spiritual Thought';
  pdfRow(thoughtLabel, a.spiritualThought);

  // Minutes from last meeting
  if(a.finalSpeakerTopic){
    y+=2;
    doc.setDrawColor(200);doc.setLineWidth(0.3);doc.line(lm,y,pw-rm,y);y+=5;
    doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(120);
    doc.text('MINUTES FROM LAST MEETING',lm,y);
    doc.setTextColor(0);doc.setFont('helvetica','normal');doc.setFontSize(11);y+=5;
    // Strip HTML tags
    const minText=a.finalSpeakerTopic.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
    const minLines=doc.splitTextToSize(minText,pw-lm-rm);
    minLines.forEach(line=>{
      if(y>260){doc.addPage();y=tm;}
      doc.text(line,lm,y);y+=5.5;
    });
    y+=3;
    doc.setDrawColor(200);doc.line(lm,y,pw-rm,y);y+=5;
  }

  // Agenda items
  if(a.announcementList&&a.announcementList.filter(Boolean).length){
    doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(120);
    doc.text('AGENDA ITEMS',lm,y);
    doc.setTextColor(0);doc.setFont('helvetica','normal');doc.setFontSize(11);y+=5;
    a.announcementList.filter(Boolean).forEach((item,i)=>{
      if(y>260){doc.addPage();y=tm;}
      const lines=doc.splitTextToSize(`${i+1}. ${item}`,pw-lm-rm);
      lines.forEach(l=>{doc.text(l,lm,y);y+=5.5;});
    });
    y+=3;
  }

  pdfRow('Closing Prayer', a.closingPrayer);
  if(a.closingHymnNum||a.closingHymnTitle)
    pdfRow('Closing Hymn', `#${a.closingHymnNum||'—'}${a.closingHymnTitle?' — '+a.closingHymnTitle:''}`);

  // Footer on each page
  const totalPages=doc.internal.getNumberOfPages();
  for(let p=1;p<=totalPages;p++){
    doc.setPage(p);
    doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(160);
    doc.text('LeaderTools · leadertools.app',lm,doc.internal.pageSize.getHeight()-8);
    doc.text(`${p} / ${totalPages}`,pw-rm,doc.internal.pageSize.getHeight()-8,{align:'right'});
    doc.setTextColor(0);
  }

  const filename=`${a.ward.replace(/\s+/g,'-')}-${mt.label.replace(/\s+/g,'-')}-${a.date}.pdf`;
  doc.save(filename);
}

// ── Agenda category list ───────────────────────────────────────────────────────
function renderAgendaCategory(el,role,categoryKey){
  const types=getMeetingTypes(role);
  const mt=types.find(t=>t.key===categoryKey)||{label:categoryKey,icon:'📋'};

  el.innerHTML=`<div class="page-title">${mt.label}</div>`;

  // Back link + New Agenda button
  const hdr=document.createElement('div');hdr.className='section-header';hdr.style.marginBottom='16px';
  const back=document.createElement('a');back.href='#';back.style.cssText='font-size:13px;font-weight:600;color:#185fa5;text-decoration:none;';
  back.textContent='← Back to Agendas';
  back.addEventListener('click',e=>{e.preventDefault();state.agendaCategory=null;render();});
  hdr.appendChild(back);
  if(role.scope==='admin'||role.scope==='ward'||role.scope==='stake') {
    const newBtn=document.createElement('button');newBtn.className='btn-primary';newBtn.textContent='+ New Agenda';
    newBtn.addEventListener('click',()=>{
      window._agendaDraft={meetingCategory:categoryKey};
      state.view='new';render();
    });
    hdr.appendChild(newBtn);
  }  el.appendChild(hdr);

  // Filter agendas to this category
  const roleWard=getAgendaWard(role);
  const all=state.agendas||[];
  const filtered=all.filter(a=>{
    const cat=a.meetingCategory||(categoryKey==='sacrament'?'sacrament':null);
    if(cat!==categoryKey) return false;
    if(role.scope==='admin') return true;
    return a.ward===roleWard;
  }).sort((a,b)=>b.date.localeCompare(a.date));

  if(!filtered.length){
    const es=document.createElement('div');es.className='empty-state';
    es.innerHTML=`<div style="font-size:32px;margin-bottom:12px;">${mt.icon}</div><div>No ${mt.label} agendas yet.</div><div style="font-size:12px;color:#bbb;margin-top:6px;">Click "+ New Agenda" to create one.</div>`;
    el.appendChild(es);return;
  }

  const isSacrament=categoryKey==='sacrament';

  // Checkbox selection state
  const selected=new Set();

  function renderBulkBar(){
    const existing=el.querySelector('.bulk-bar');if(existing)existing.remove();
    if(!selected.size) return;
    const bar=document.createElement('div');bar.className='bulk-bar';
    const count=document.createElement('div');count.className='bulk-bar-count';
    count.textContent=`${selected.size} selected`;bar.appendChild(count);
    const dlBtn=document.createElement('button');dlBtn.className='bulk-bar-btn';dlBtn.textContent='⬇ Download PDF';
    dlBtn.addEventListener('click',async()=>{
      for(const id of selected){
        const ag=filtered.find(x=>x.id===id);if(ag) await generateAgendaPDF(ag,role);
      }
    });
    bar.appendChild(dlBtn);
    const delBtn=document.createElement('button');delBtn.className='bulk-bar-btn danger';delBtn.textContent='🗑 Delete Selected';
    delBtn.addEventListener('click',async()=>{
      if(!confirm(`Delete ${selected.size} agenda(s)? This cannot be undone.`)) return;
      for(const id of selected){
        await sb.from('agendas').delete().eq('id',id);
        state.agendas=state.agendas.filter(x=>x.id!==id);
      }
      selected.clear();state.agendaCategory=categoryKey;render();
    });
    bar.appendChild(delBtn);
    const cancelBtn=document.createElement('button');cancelBtn.className='bulk-bar-btn';cancelBtn.textContent='✕';
    cancelBtn.addEventListener('click',()=>{selected.clear();renderBulkBar();updateCheckboxes();});
    bar.appendChild(cancelBtn);
    // Insert after the hdr
    hdr.after(bar);
  }

  function updateCheckboxes(){
    table.querySelectorAll('input[type=checkbox]').forEach(cb=>{
      cb.checked=selected.has(Number(cb.dataset.id)||cb.dataset.id);
    });
  }

  const table=document.createElement('table');table.className='agenda-table';
  const thead=document.createElement('thead');
  // Checkbox col + action col
  if(isSacrament){
    thead.innerHTML='<tr><th style="width:32px;padding-right:0;"></th><th>Date</th><th>Type</th><th>Conducting</th><th>Presiding</th><th>Speakers</th><th style="width:70px;"></th></tr>';
  } else {
    thead.innerHTML='<tr><th style="width:32px;padding-right:0;"></th><th>Date</th><th>Conducting</th><th>Opening / Thought</th><th>Topics / Notes</th><th style="width:70px;"></th></tr>';
  }
  table.appendChild(thead);
  const tbody=document.createElement('tbody');

  filtered.forEach(a=>{
    const tr=document.createElement('tr');
    tr.style.cursor='pointer';

    // Checkbox cell
    const cbTd=document.createElement('td');cbTd.style.cssText='padding-right:0;width:32px;';
    const cb=document.createElement('input');cb.type='checkbox';cb.className='agenda-row-cb';cb.dataset.id=a.id;
    cb.addEventListener('change',e=>{
      e.stopPropagation();
      if(cb.checked)selected.add(a.id);else selected.delete(a.id);
      renderBulkBar();
    });
    cbTd.appendChild(cb);tr.appendChild(cbTd);

    // Data cells
    if(isSacrament){
      const typeBadge=`<span class="agenda-type-badge${a.meetingType==='Fast & Testimony'?' fast':''}">${a.meetingType||'Regular'}</span>`;
      const speakers=(a.speakers||[]).map(s=>s.name).filter(Boolean).join(', ')||'—';
      tr.innerHTML+=`<td class="td-date">${fmtDate(a.date)}</td><td>${typeBadge}</td><td>${a.conducting||'—'}</td><td>${a.presiding||'—'}</td><td style="color:#555;font-size:12px;">${speakers}</td>`;
    } else {
      const hasItems=a.announcementList&&a.announcementList.filter(Boolean).length;
      const notesPlain=(a.speaker1Topic||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
      const notesSnippet=hasItems
        ? a.announcementList.filter(Boolean).slice(0,3).join(', ')+(a.announcementList.filter(Boolean).length>3?'…':'')
        : notesPlain?(notesPlain.substring(0,60)+(notesPlain.length>60?'…':'')):'—';
      const thought=a.spiritualThought||a.openingPrayer||'—';
      tr.innerHTML+=`<td class="td-date">${fmtDate(a.date)}</td><td>${a.conducting||'—'}</td><td style="font-size:12px;color:#555;">${thought}</td><td style="font-size:12px;color:#888;">${notesSnippet}</td>`;
    }

    // Action cell: PDF + trash
    const actTd=document.createElement('td');actTd.style.cssText='text-align:right;white-space:nowrap;';
    actTd.addEventListener('click',e=>e.stopPropagation());

    const pdfBtn=document.createElement('button');pdfBtn.className='agenda-trash';pdfBtn.title='Download PDF';pdfBtn.textContent='⬇';
    pdfBtn.addEventListener('click',()=>generateAgendaPDF(a,role));
    actTd.appendChild(pdfBtn);

    const trashBtn=document.createElement('button');trashBtn.className='agenda-trash';trashBtn.title='Delete';trashBtn.textContent='🗑';
    trashBtn.addEventListener('click',async()=>{
      if(!confirm(`Delete agenda for ${fmtDate(a.date)}?`)) return;
      await sb.from('agendas').delete().eq('id',a.id);
      state.agendas=state.agendas.filter(x=>x.id!==a.id);
      selected.delete(a.id);
      state.agendaCategory=categoryKey;render();
    });
    actTd.appendChild(trashBtn);
    tr.appendChild(actTd);

    tr.addEventListener('click',()=>{state.detailId=a.id;state.view='detail';render();});
    tbody.appendChild(tr);
  });

  table.appendChild(tbody);el.appendChild(table);
}

// ── Agenda Wizard ─────────────────────────────────────────────────────────────
function dateInp(val,onChange){
  // Create a simple date input that works reliably on mobile
  const inp=document.createElement('input');
  inp.type='date';
  inp.value=val||'';
  inp.style.cssText='width:100%;padding:8px 12px;border:1px solid rgba(0,0,0,0.15);border-radius:8px;font-size:14px;background:#fff;color:#1a1a1a;';
  inp.addEventListener('change',()=>{if(onChange)onChange(inp.value);});
  inp.addEventListener('input',()=>{if(onChange)onChange(inp.value);});
  return inp;
}

// ── Simple agenda form for non-sacrament meetings ────────────────────────────
function renderSimpleAgendaForm(el,role,categoryKey){
  const types=getMeetingTypes(role);
  const mt=types.find(t=>t.key===categoryKey)||{label:categoryKey,custom:false};
  const ward=getAgendaWard(role)||'';
  const d=window._agendaDraft||{};
  const isEditing=!!(d.id);

  const customTypes=getCustomMeetingTypes(ward);
  const customDef=customTypes.find(t=>t.key===categoryKey);
  const fields=customDef?.fields||{openingPrayer:true,openingHymn:true,spiritualThought:true,agendaItems:true,closingHymn:false,closingPrayer:true};

  el.innerHTML=`<div class="page-title">${isEditing?'Edit':'New'} ${mt.label} Agenda</div>`;

  const hdr=document.createElement('div');hdr.className='section-header';hdr.style.marginBottom='16px';
  const back=document.createElement('a');back.href='#';back.style.cssText='font-size:13px;font-weight:600;color:#185fa5;text-decoration:none;';
  back.textContent='← Back';
  back.addEventListener('click',e=>{
    e.preventDefault();
    window._agendaDraft=null;
    if(isEditing){state.view='detail';}
    else{state.view='list';}
    render();
  });
  hdr.appendChild(back);el.appendChild(hdr);

  const card=document.createElement('div');
  card.style.cssText='background:#fff;border-radius:12px;padding:24px;max-width:560px;box-shadow:0 1px 4px rgba(0,0,0,0.07);';

  function fld(label,inp){const wrap=document.createElement('div');wrap.className='agenda-field';wrap.innerHTML=`<label>${label}</label>`;wrap.appendChild(inp);return wrap;}
  function ti(key,placeholder,value){const inp=document.createElement('input');inp.type='text';inp.placeholder=placeholder;inp.value=value||'';inp.style.cssText='width:100%;padding:9px 12px;border:1px solid rgba(0,0,0,0.15);border-radius:8px;font-size:14px;box-sizing:border-box;';inp.addEventListener('input',()=>{d[key]=inp.value;});return inp;}
  function hymnRow(numKey,titleKey,numVal,titleVal){const row=document.createElement('div');row.style.cssText='display:flex;gap:8px;';const n=document.createElement('input');n.type='text';n.placeholder='#';n.value=numVal||'';;n.style.cssText='width:70px;padding:9px 10px;border:1px solid rgba(0,0,0,0.15);border-radius:8px;font-size:14px;box-sizing:border-box;';n.addEventListener('input',()=>{d[numKey]=n.value;});const t=document.createElement('input');t.type='text';t.placeholder='Hymn title (optional)';t.value=titleVal||'';t.style.cssText='flex:1;padding:9px 12px;border:1px solid rgba(0,0,0,0.15);border-radius:8px;font-size:14px;box-sizing:border-box;';t.addEventListener('input',()=>{d[titleKey]=t.value;});row.appendChild(n);row.appendChild(t);return row;}

  const dateEl=document.createElement('input');dateEl.type='date';dateEl.value=d.date||'';;dateEl.style.cssText='width:100%;padding:9px 12px;border:1px solid rgba(0,0,0,0.15);border-radius:8px;font-size:14px;box-sizing:border-box;';dateEl.addEventListener('change',()=>{d.date=dateEl.value;});
  card.appendChild(fld('Date *',dateEl));
  card.appendChild(fld('Conducting',ti('conducting','Full name',d.conducting)));

  if(fields.openingPrayer) card.appendChild(fld('Opening Prayer',ti('openingPrayer','Full name',d.openingPrayer)));
  if(fields.openingHymn){const hw=document.createElement('div');hw.className='agenda-field';hw.innerHTML='<label>Opening Hymn</label>';hw.appendChild(hymnRow('openingHymnNum','openingHymnTitle',d.openingHymnNum,d.openingHymnTitle));card.appendChild(hw);}
  if(fields.spiritualThought){
    // Label is selectable per-meeting: Spiritual Thought, Handbook Moment, Devotional, or skip
    const THOUGHT_LABELS=['Spiritual Thought','Handbook Moment','Devotional','— None —'];
    const HANDBOOK_MOMENT_TYPES=new Set(['bishopric','stake-presidency','ward-council','stake-council','high-council']);
    if(!d.spiritualThoughtLabel){
      if(THOUGHT_LABELS.includes(d.meetingType)) d.spiritualThoughtLabel=d.meetingType;
      else if(HANDBOOK_MOMENT_TYPES.has(categoryKey)) d.spiritualThoughtLabel='Handbook Moment';
      else d.spiritualThoughtLabel='Spiritual Thought';
    }
    const stWrap=document.createElement('div');stWrap.className='agenda-field';
    function renderST(){
      stWrap.innerHTML='';
      const headerRow=document.createElement('div');headerRow.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:4px;';
      const labelSel=document.createElement('select');
      labelSel.style.cssText='font-size:12px;font-weight:600;color:#1c2537;border:none;background:transparent;cursor:pointer;padding:0;appearance:auto;';
      ['Spiritual Thought','Handbook Moment','Devotional','— None —'].forEach(opt=>{
        const o=document.createElement('option');o.value=opt;o.textContent=opt;
        if(d.spiritualThoughtLabel===opt)o.selected=true;
        labelSel.appendChild(o);
      });
      labelSel.addEventListener('change',()=>{
        d.spiritualThoughtLabel=labelSel.value;
        renderST();
      });
      headerRow.appendChild(labelSel);
      stWrap.appendChild(headerRow);
      if(d.spiritualThoughtLabel!=='— None —'){
        const inp=ti('spiritualThought','Name or topic',d.spiritualThought);
        stWrap.appendChild(inp);
      }
    }
    renderST();
    card.appendChild(stWrap);
  }

  // ── Minutes from last meeting ──────────────────────────────────────────────
  if(isEditing){
    // Editing: show the saved minutes (stored in finalSpeakerTopic)
    if(d.lastMeetingMinutes===undefined) d.lastMeetingMinutes=d.finalSpeakerTopic||'';
  } else if(d.lastMeetingMinutes===undefined){
    // New agenda: find most recent prior agenda of this category and pre-populate
    const prior=(state.agendas||[])
      .filter(a=>a.meetingCategory===categoryKey&&a.ward===ward)
      .sort((a,b)=>b.date.localeCompare(a.date))[0];
    d.lastMeetingMinutes=prior?.speaker1Topic||'';
    d.lastMeetingDate=prior?.date||'';
  }

  const minutesWrap=document.createElement('div');minutesWrap.className='agenda-field';
  const minutesLbl=document.createElement('label');
  minutesLbl.textContent=d.lastMeetingDate
    ?`Minutes from Last Meeting (${fmtDate(d.lastMeetingDate)})`
    :'Minutes from Last Meeting';
  minutesWrap.appendChild(minutesLbl);

  if(!isEditing&&!d.lastMeetingMinutes){
    // No prior notes — show a soft placeholder note
    const none=document.createElement('div');
    none.style.cssText='font-size:12px;color:#bbb;padding:6px 0;';
    none.textContent='No notes found from previous meeting.';
    minutesWrap.appendChild(none);
  } else {
    const minutesTa=document.createElement('textarea');
    minutesTa.placeholder='Minutes or notes from the previous meeting…';
    minutesTa.value=d.lastMeetingMinutes||'';
    minutesTa.style.cssText='width:100%;min-height:100px;padding:9px 12px;border:1px solid rgba(0,0,0,0.15);border-radius:8px;font-size:13px;resize:vertical;box-sizing:border-box;font-family:inherit;line-height:1.5;';
    minutesTa.addEventListener('input',()=>{d.lastMeetingMinutes=minutesTa.value;});
    minutesWrap.appendChild(minutesTa);
  }
  card.appendChild(minutesWrap);

  if(fields.agendaItems){
    // On edit, seed agendaItems from the saved announcementList
    if(!d.agendaItems||!Array.isArray(d.agendaItems)){
      d.agendaItems=(d.announcementList&&d.announcementList.length)
        ? [...d.announcementList]
        : [''];
    }
    const aiWrap=document.createElement('div');aiWrap.className='agenda-field';aiWrap.innerHTML='<label>Agenda Items</label>';
    const aiList=document.createElement('div');aiList.style.cssText='display:flex;flex-direction:column;gap:6px;';
    let focusIdx=null;
    function renderAI(){
      aiList.innerHTML='';
      d.agendaItems.forEach((val,idx)=>{
        const row=document.createElement('div');row.style.cssText='display:flex;gap:6px;align-items:center;';
        const inp=document.createElement('input');inp.type='text';inp.placeholder=`Item ${idx+1}`;inp.value=val||'';
        inp.style.cssText='flex:1;padding:8px 10px;border:1px solid rgba(0,0,0,0.15);border-radius:8px;font-size:13px;';
        inp.addEventListener('input',()=>{d.agendaItems[idx]=inp.value;});
        inp.addEventListener('keydown',e=>{
          if(e.key==='Enter'){
            e.preventDefault();
            d.agendaItems[idx]=inp.value; // save current
            d.agendaItems.splice(idx+1,0,''); // insert blank after
            focusIdx=idx+1;
            renderAI();
          } else if(e.key==='Backspace'&&inp.value===''&&d.agendaItems.length>1){
            e.preventDefault();
            d.agendaItems.splice(idx,1);
            focusIdx=Math.max(0,idx-1);
            renderAI();
          }
        });
        if(focusIdx===idx){setTimeout(()=>inp.focus(),0);focusIdx=null;}
        const rm=document.createElement('button');rm.textContent='×';rm.style.cssText='background:none;border:none;font-size:18px;color:#aaa;cursor:pointer;padding:0 4px;line-height:1;flex-shrink:0;';
        rm.addEventListener('click',()=>{d.agendaItems.splice(idx,1);if(!d.agendaItems.length)d.agendaItems=[''];focusIdx=null;renderAI();});
        row.appendChild(inp);row.appendChild(rm);aiList.appendChild(row);
      });
      const addBtn=document.createElement('button');addBtn.textContent='+ Add item';
      addBtn.style.cssText='background:none;border:none;color:#185fa5;font-size:12px;font-weight:600;cursor:pointer;padding:4px 0;';
      addBtn.addEventListener('click',()=>{d.agendaItems.push('');focusIdx=d.agendaItems.length-1;renderAI();});
      aiList.appendChild(addBtn);
    }
    renderAI();aiWrap.appendChild(aiList);card.appendChild(aiWrap);
  }

  if(fields.closingHymn!==undefined){
    // Closing hymn is optional per-meeting — toggle shows/hides the inputs
    if(d.includeClosingHymn===undefined) d.includeClosingHymn=!!fields.closingHymn;
    const chWrap=document.createElement('div');chWrap.className='agenda-field';
    function renderCH(){
      chWrap.innerHTML='';
      const headerRow=document.createElement('div');headerRow.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:4px;';
      const cb=document.createElement('input');cb.type='checkbox';cb.checked=d.includeClosingHymn;
      cb.style.cssText='width:15px;height:15px;accent-color:#1c2537;cursor:pointer;flex-shrink:0;';
      const lbl=document.createElement('label');lbl.textContent='Closing Hymn';
      lbl.style.cssText='font-size:12px;font-weight:600;color:#1c2537;cursor:pointer;user-select:none;';
      cb.addEventListener('change',()=>{d.includeClosingHymn=cb.checked;renderCH();});
      lbl.addEventListener('click',()=>{cb.checked=!cb.checked;d.includeClosingHymn=cb.checked;renderCH();});
      headerRow.appendChild(cb);headerRow.appendChild(lbl);chWrap.appendChild(headerRow);
      if(d.includeClosingHymn){
        chWrap.appendChild(hymnRow('closingHymnNum','closingHymnTitle',d.closingHymnNum,d.closingHymnTitle));
      }
    }
    renderCH();
    card.appendChild(chWrap);
  }
  if(fields.closingPrayer) card.appendChild(fld('Closing Prayer',ti('closingPrayer','Full name',d.closingPrayer)));

  const saveBtn=document.createElement('button');saveBtn.className='btn-primary';saveBtn.style.cssText='margin-top:8px;padding:12px 24px;font-size:14px;';saveBtn.textContent=isEditing?'Save Changes':'Save Agenda';
  saveBtn.addEventListener('click',async()=>{
    if(!d.date){alert('Please enter a date.');dateEl.focus();return;}
    saveBtn.disabled=true;saveBtn.textContent='Saving…';
    try{
      const agendaItems=(d.agendaItems||[]).filter(Boolean);
      const payload={
        ward,
        date:d.date,
        meeting_type:d.spiritualThoughtLabel||'Spiritual Thought',
        meeting_category:categoryKey,
        conducting:d.conducting||'',
        presiding:'',
        opening_prayer:d.openingPrayer||'',
        closing_prayer:d.closingPrayer||'',
        spiritual_thought:d.spiritualThoughtLabel==='— None —'?'':d.spiritualThought||'',
        opening_hymn_num:d.openingHymnNum||'',
        opening_hymn_title:d.openingHymnTitle||'',
        closing_hymn_num:d.includeClosingHymn?d.closingHymnNum||'':'',
        closing_hymn_title:d.includeClosingHymn?d.closingHymnTitle||'':'',
        announcement_list:agendaItems,
        final_speaker_topic:d.lastMeetingMinutes||'', // minutes from last meeting
        // Zero out sacrament-specific fields
        high_counselor:'',stake_visiting:false,chorister:'',accompanist:'',
        sacrament_hymn_num:'',sacrament_hymn_title:'',
        intermediate_hymn:'',intermediate_hymn_title:'',
        speaker1:'',speaker1_topic:'',speaker2:'',speaker2_topic:'',
        final_speaker:'',
        new_records_list:[],releases:[],sustainings:[],
        ordinations:[],baby_blessings_list:[],confirmations_list:[],
      };
      const result=isEditing?await sb.from('agendas').update(payload).eq('id',d.id).select().single():await sb.from('agendas').insert(payload).select().single();
      if(result.error)throw result.error;
      const{data:fresh}=await sb.from('agendas').select('*').order('date',{ascending:false});
      if(fresh)state.agendas=fresh.map(agendaFromDb);
      window._agendaDraft=null;state.detailId=result.data.id;state.view='detail';render();
    }catch(e){alert('Error: '+e.message);saveBtn.disabled=false;saveBtn.textContent=isEditing?'Save Changes':'Save Agenda';}
  });
  card.appendChild(saveBtn);el.appendChild(card);
}

function renderAgendaWizard(el,role,editingAgenda){
  el.innerHTML='';

  if(!canCreateSacramentAgenda(role)){
    el.innerHTML='<div class="empty-state">Only Bishopric members can create sacrament meeting agendas.</div>';return;
  }

  const ward=getAgendaWard(role)||'';
  const isEditing=!!editingAgenda;

  // Non-sacrament meeting categories get a lightweight agenda form
  const draftCategory=(window._agendaDraft?.meetingCategory)||(editingAgenda?.meetingCategory)||'sacrament';
  if(draftCategory!=='sacrament'){
    renderSimpleAgendaForm(el,role,draftCategory);
    return;
  }

  // Init draft from existing agenda or blank
  if(!window._agendaDraft){
    if(isEditing){
      window._agendaDraft=JSON.parse(JSON.stringify(editingAgenda));
    } else {
      window._agendaDraft={meetingCategory:'sacrament'};
    }
  }
  // Auto-populate sustainings and releases for NEW sacrament agendas
  if(!isEditing&&window._agendaDraft&&!window._agendaDraft._autoPopulated){
    window._agendaDraft._autoPopulated=true;
    const autoSustain=[];
      const autoRelease=[];
      (state.callings||[]).forEach(c=>{
        if(c.ward!==ward)return; // only this ward
        const steps=getSteps(c);
        const nextStep=steps[Math.min(c.currentStep,steps.length-1)];

        // Sustain over Pulpit — add to sustainings
        if(nextStep==='Sustain over Pulpit'||nextStep==='Sustain & Release over Pulpit'){
          autoSustain.push({member:c.name,calling:c.calling,_callingId:c.id,_auto:true});
          // C&R: also release the current holder
          if(nextStep==='Sustain & Release over Pulpit'&&c.currentlyFilled&&c.releaseName){
            autoRelease.push({member:c.releaseName,calling:c.calling,_callingId:c.id,_auto:true});
          }
          // Member's own prior calling to release
          if(c.memberNeedsRelease&&c.memberCallings&&c.memberCallings.filter(Boolean).length){
            c.memberCallings.filter(Boolean).forEach(mc=>{
              autoRelease.push({member:c.name,calling:mc,_callingId:c.id,_auto:true});
            });
          } else if(c.memberNeedsRelease&&c.memberCurrentCalling){
            autoRelease.push({member:c.name,calling:c.memberCurrentCalling,_callingId:c.id,_auto:true});
          }
        }

        // Release over Pulpit — add to releases only
        if(nextStep==='Release over Pulpit'){
          autoRelease.push({member:c.releaseName||c.name,calling:c.calling,_callingId:c.id,_auto:true});
        }
      });

      // Merge auto-populated data into the draft (preserving meetingCategory set by the hub)
      Object.assign(window._agendaDraft,{
        date:window._agendaDraft.date||'',
        ward,meetingType:'Regular',
        conducting:window._agendaDraft.conducting||'',conductingTitle:window._agendaDraft.conductingTitle||'Counselor/Other',
        presiding:window._agendaDraft.presiding||'',presidingTitle:window._agendaDraft.presidingTitle||'Bishop',
        highCounselor:'',stakeVisiting:false,
        chorister:'',accompanist:'',
        openingPrayer:'',closingPrayer:'',
        openingHymnNum:'',openingHymnTitle:'',
        sacramentHymnNum:'',sacramentHymnTitle:'',
        intermediateHymn:'',intermediateHymnTitle:'',
        closingHymnNum:'',closingHymnTitle:'',
        announcementList:[],
        newRecordsList:[],
        releases:autoRelease,sustainings:autoSustain,ordinations:[],
        babyBlessingsList:[],confirmationsList:[],
        speaker1:'',speaker1Topic:'',
        speaker2:'',speaker2Topic:'',
        finalSpeaker:'',finalSpeakerTopic:'',
      });
  }
  const d=window._agendaDraft;
  // Always keep ward in sync with role
  if(!isEditing) d.ward=ward||d.ward;

  const hdr=document.createElement('div');hdr.className='detail-header';
  const bb=document.createElement('button');bb.className='back-btn';bb.innerHTML='&larr;';
  bb.addEventListener('click',()=>{window._agendaDraft=null;state.view=isEditing?'detail':'list';render();});
  const hdi=document.createElement('div');
  hdi.innerHTML=`<div class="detail-calling">${isEditing?'Edit Agenda':'New Sacrament Meeting Agenda'}</div>`;
  hdr.appendChild(bb);hdr.appendChild(hdi);el.appendChild(hdr);

    i.addEventListener('input',()=>{d[key]=i.value;});return i;
  }
  function selInp(options,val,key){
    const s=document.createElement('select');
    options.forEach(o=>{const op=document.createElement('option');op.value=o;op.textContent=o;if(o===val)op.selected=true;s.appendChild(op);});

    arrow.textContent='▼';
    hd.appendChild(ht);hd.appendChild(arrow);wrap.appendChild(hd);

    const body=document.createElement('div');body.style.cssText='padding:0 16px 14px;';

// ── Build Script ──────────────────────────────────────────────────────────────
function buildScript(a){
  const blocks=[];
  // Helper: format "Title Name" — Counselor/Other → "Brother Name"
  function titledName(name,title){
    if(!name)return'[Name]';
    const t=title||'';
    if(t==='Counselor/Other')return`Brother ${name}`;
    if(t==='Elder'||t==='President'||t==='Bishop')return`${t} ${name}`;
    return name;
  }
  const conductingFull=titledName(a.conducting,a.conductingTitle);
  const presidingFull=a.presiding?titledName(a.presiding,a.presidingTitle):'';

  const ward=a.ward||'the ward';
  const date=fmtDate(a.date);
  const isFast=a.meetingType==='Fast & Testimony';

  // 1 — Welcome
  blocks.push({step:'Welcome',text:`Good ${date&&new Date(a.date+'T12:00:00').getHours()<12?'morning':'afternoon'} brothers and sisters.\nWe welcome you to the Church of Jesus Christ of Latter-day Saints!\n\nThis is the ${isFast?'Fast and Testimony Meeting':'Sacrament Meeting'} for the ${ward} on ${date}.`});

  // 2 — Introduction
  let intro=`My name is ${conductingFull}. ${presidingFull?`${presidingFull}, who presides at today's meeting, has asked that I conduct.`:''}`;
  if(a.highCounselor) intro+=`\n\nWe welcome ${a.highCounselor} from the stake high council who is visiting with us today${a.stakeVisiting?' to conduct stake business.':'.'}`;
  if(a.chorister||a.accompanist){
    intro+=`\n\nWe'd like to extend a special thank you to our Chorister ${a.chorister||'[Chorister]'} and our Accompanist ${a.accompanist||'[Accompanist]'} who will provide the music for today's meeting.`;
  }
  blocks.push({step:'Introduction',text:intro.trim()});

  // 3 — Opening Hymn & Prayer
  let hymnLine=a.openingHymnNum?`We will open by singing hymn number ${a.openingHymnNum}${a.openingHymnTitle?`, "${a.openingHymnTitle}"`:''}.`:'We will now sing our opening hymn.';
  hymnLine+=a.openingPrayer?`\n\nFollowing the hymn, ${a.openingPrayer} will offer our opening prayer.`:'\n\nFollowing the hymn we will have our opening prayer.';
  blocks.push({step:'Opening Hymn & Prayer',text:hymnLine});

  // 4 — Announcements
  const annList=a.announcementList?a.announcementList.filter(Boolean):a.announcements?a.announcements.split('\n').filter(Boolean):[];
  if(annList.length){
    const annText=annList.length===1
      ?annList[0]
      :annList.map((ann,i)=>`${i+1}. ${ann}`).join('\n');
    blocks.push({step:'Announcements',text:`By way of announcements:\n\n${annText}`});
  }

  // 5 — Ward Business (if any)
  const hasWB=(a.releases&&a.releases.some(r=>r.member))||
              (a.sustainings&&a.sustainings.some(s=>s.member))||
              (a.ordinations&&a.ordinations.some(o=>o.member))||
              (a.babyBlessingsList&&a.babyBlessingsList.some(Boolean))||a.babyBlessings||
              (a.confirmationsList&&a.confirmationsList.some(Boolean))||a.confirmations||
              (a.newRecordsList&&a.newRecordsList.some(Boolean))||a.newRecords;

  if(hasWB){
    blocks.push({step:'Ward Business',text:'Before we Continue with the Sacrament portion of our program, we have some Ward Business to take care of.'});

    const nrList=a.newRecordsList?a.newRecordsList.filter(Boolean):a.newRecords?[a.newRecords]:[];
  if(nrList.length){
      blocks.push({step:'New Records',text:`We'd like to welcome the following member(s) whose records have been received into our ward:\n\n${nrList.join('\n')}`});
    }

    const releases=a.releases?a.releases.filter(r=>r.member):[];
    if(releases.length){
      const plural=releases.length>1;
      let txt=plural
        ?'The following members have been released from their calling:\n\n'
        :'The following member has been released from his/her calling:\n\n';
      txt+=releases.map(r=>`${r.member}${r.calling?` as ${r.calling}`:''}`).join('\n');
      txt+=plural
        ?'\n\nWe propose that they be given a vote of thanks for their service. Those who wish to express their appreciation may manifest by the uplifted hand.'
        :'\n\nWe propose that he/she be given a vote of thanks for his/her service. Those who wish to express their appreciation may manifest by the uplifted hand.';
      blocks.push({step:'Release(s)',text:txt});
    }

    const sustainings=a.sustainings?a.sustainings.filter(s=>s.member):[];
    if(sustainings.length){
      let txt='';
      txt+=sustainings.map(s=>`${s.member}${s.calling?` as ${s.calling}`:''}`).join('\n');
      const plural2=sustainings.length>1;
      const header=plural2
        ?'The following members have been called. If they are here, will they please stand until after the vote is taken. We have called:\n\n'
        :'The following member has been called. If he/she is here, will he/she please stand until after the vote is taken. We have called:\n\n';
      const footer=plural2
        ?'\n\nWe propose that they be sustained. Those in favor may manifest it by the uplifted hand. [Pause briefly for the sustaining vote.] Those opposed, if any, may manifest it. [Pause briefly to allow for a dissenting vote, if any.] Thank you.'
        :'\n\nWe propose that he/she be sustained. Those in favor may manifest it by the uplifted hand. [Pause briefly for the sustaining vote.] Those opposed, if any, may manifest it. [Pause briefly to allow for a dissenting vote, if any.] Thank you.';
      txt=header+txt+footer;
      blocks.push({step:'Sustaining(s)',text:txt.trim()});
    }

    const ords=a.ordinations?a.ordinations.filter(o=>o.member):[];
    if(ords.length){
      let txt=ords.map(o=>`We will now proceed with the ordination of ${o.member} to the office of ${o.office} in the ${['Deacon','Teacher','Priest'].includes(o.office)?'Aaronic':'Melchizedek'} Priesthood.`).join('\n\n');
      blocks.push({step:'Ordination(s)',text:txt});
    }

    const bbList=a.babyBlessingsList?a.babyBlessingsList.filter(Boolean):a.babyBlessings?[a.babyBlessings]:[];
    if(bbList.length){
      blocks.push({step:'Baby Blessing(s)',text:`We will now proceed with the blessing of the following child${bbList.length>1?'ren':''}:\n\n${bbList.join('\n')}`});
    }

    const cfList=a.confirmationsList?a.confirmationsList.filter(Boolean):a.confirmations?[a.confirmations]:[];
    if(cfList.length){
      blocks.push({step:'Confirmation(s)',text:`We will now proceed with the confirmation of the following individual${cfList.length>1?'s':''}:\n\n${cfList.join('\n')}`});
    }
  }

  // 6 — Sacrament Hymn
  let sacLine=a.sacramentHymnNum?`We will prepare to partake of the Sacrament by singing hymn number ${a.sacramentHymnNum}${a.sacramentHymnTitle?`, "${a.sacramentHymnTitle}"`:''}.`:'We will now sing our Sacrament hymn.';
  blocks.push({step:'Sacrament Hymn',text:sacLine});

  // 7 — After Sacrament
  blocks.push({step:'After Sacrament',text:"We'd like to thank the Aaronic Priesthood for the reverent manner in which they administered the Sacrament."});

  // 8 — Program
  if(isFast){
    blocks.push({step:'Fast & Testimony',text:"We will now open the meeting for the bearing of testimonies. We invite all who feel so inclined to come to the podium and share their testimony."});
  } else {
    const speakers=[];
    if(a.speaker1) speakers.push({name:a.speaker1,topic:a.speaker1Topic});
    if(a.speaker2) speakers.push({name:a.speaker2,topic:a.speaker2Topic});

    let progText='The remainder of our program will go as follows:\n\n';
    speakers.forEach((s,i)=>{
      progText+=`- We will ${i===0?'first be privileged':'next be pleased'} to hear from ${s.name}.`;
      if(i<speakers.length-1) progText+='\n\n';
    });
    if(a.intermediateHymn||a.intermediateHymnTitle){
      progText+=`\n\n- Our Intermediate Hymn will be ${a.intermediateHymn?`#${a.intermediateHymn} `:''}${a.intermediateHymnTitle?`"${a.intermediateHymnTitle}"`:''}.`;
    }
    if(a.finalSpeaker){
      progText+=`\n\n- And our concluding speaker will be ${a.finalSpeaker}.`;
    }
    blocks.push({step:'Program Overview',text:progText});
  }

  // 9 — Closing
  let closingLine=a.closingHymnNum?`We will close by singing hymn number ${a.closingHymnNum}${a.closingHymnTitle?`, "${a.closingHymnTitle}"`:''}.`:'We will now sing our closing hymn.';
  closingLine+=a.closingPrayer?`\n\n${a.closingPrayer} will then offer our closing prayer.`:'\n\nWe will then have our closing prayer.';
  blocks.push({step:'Closing Hymn & Prayer',text:closingLine});
  blocks.push({step:'Dismissal',text:'This meeting is now dismissed.'});

  return blocks;
}

// ── Render Agenda Detail (Script View) ────────────────────────────────────────
function renderAgendaDetail(el,role){
  const a=state.agendas.find(x=>x.id===state.detailId);
  if(!a){el.innerHTML='<div class="empty-state">Agenda not found.</div>';return;}

  const hdr=document.createElement('div');hdr.className='detail-header';
  const bb=document.createElement('button');bb.className='back-btn';bb.innerHTML='&larr;';
  bb.addEventListener('click',()=>{state.view='list';state.detailId=null;render();});
  const hdi=document.createElement('div');
  const typeBadge=`<span class="agenda-type-badge${a.meetingType==='Fast & Testimony'?' fast':''}" style="font-size:12px;vertical-align:middle;margin-left:8px;">${a.meetingType}</span>`;
  hdi.innerHTML=`<div class="detail-calling">${fmtDate(a.date)}${typeBadge}</div><div class="detail-member">${a.ward} &middot; Conducting: ${a.conducting||'—'}</div>`;
  hdr.appendChild(bb);hdr.appendChild(hdi);el.appendChild(hdr);

  const actions=document.createElement('div');actions.className='script-actions';
  const printBtn=document.createElement('button');printBtn.className='btn-primary';
  printBtn.innerHTML='⬇ PDF';printBtn.addEventListener('click',()=>generateAgendaPDF(a,role));
  const editBtn2=document.createElement('button');
  editBtn2.style.cssText='background:#fff;border:1px solid rgba(0,0,0,0.15);color:#1c2537;padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;';
  editBtn2.textContent='✏ Edit';
  editBtn2.addEventListener('click',()=>{
    window._agendaDraft=JSON.parse(JSON.stringify(a));
    // Keep detailId set so the wizard can find the editing agenda
    state.view='new';
    render();
  });
  const delBtn2=document.createElement('button');
  delBtn2.style.cssText='background:transparent;border:1px solid #e57373;color:#c62828;padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;';
  delBtn2.textContent='Delete';
  delBtn2.addEventListener('click',()=>{
    if(confirm('Delete this agenda?')){
      const deletedId=a.id;
      state.agendas=state.agendas.filter(x=>x.id!==a.id);
      state.view='list';state.detailId=null;render();
      dbDeleteAgenda(deletedId);
    }
  });
  actions.appendChild(printBtn);actions.appendChild(editBtn2);actions.appendChild(delBtn2);
  el.appendChild(actions);

  const isSacramentMeeting=(a.meetingCategory==='sacrament'||!a.meetingCategory);

  // ── Pulpit-ready banner ────────────────────────────────────────────────────
  if(isSacramentMeeting){
    try{
      const ward=a.ward;
      const missing={sustain:[],release:[]};
      function safeArr(v){if(Array.isArray(v))return v;if(!v)return[];try{const p=JSON.parse(v);return Array.isArray(p)?p:[];}catch(e){return[];}}
      const aReleases=safeArr(a.releases);
      const aSustainings=safeArr(a.sustainings);

    (state.callings||[]).filter(c=>c.ward===ward).forEach(c=>{
      const steps=getSteps(c);
      const nextStep=steps[Math.min(c.currentStep,steps.length-1)];
      if(nextStep==='Sustain over Pulpit'||nextStep==='Sustain & Release over Pulpit'){
        const already=aSustainings.some(s=>s.member===c.name&&s.calling===c.calling);
        if(!already) missing.sustain.push({member:c.name,calling:c.calling,_callingId:c.id});
        if(nextStep==='Sustain & Release over Pulpit'&&c.currentlyFilled&&c.releaseName){
          const alreadyRel=aReleases.some(r=>r.member===c.releaseName&&r.calling===c.calling);
          if(!alreadyRel) missing.release.push({member:c.releaseName,calling:c.calling,_callingId:c.id});
        }
      }
      if(nextStep==='Release over Pulpit'){
        const name=c.releaseName||c.name;
        const already=aReleases.some(r=>r.member===name&&r.calling===c.calling);
        if(!already) missing.release.push({member:name,calling:c.calling,_callingId:c.id});
      }
    });

    const totalMissing=missing.sustain.length+missing.release.length;
    if(totalMissing>0){
      const banner=document.createElement('div');
      banner.style.cssText='background:#fef9ed;border:1px solid #f5c842;border-radius:10px;padding:12px 16px;margin-bottom:16px;max-width:760px;';

      const bannerHdr=document.createElement('div');bannerHdr.style.cssText='display:flex;align-items:center;justify-content:space-between;gap:12px;';
      const bannerTitle=document.createElement('div');
      bannerTitle.style.cssText='font-size:13px;font-weight:600;color:#92400e;';
      const items=[
        ...missing.sustain.map(s=>`${s.member} as ${s.calling}`),
        ...missing.release.map(r=>`Release ${r.member} from ${r.calling}`),
      ];
      bannerTitle.innerHTML=`⚠ <strong>${totalMissing} calling${totalMissing>1?'s':''} ready for the pulpit</strong> not yet on this agenda`;
      bannerHdr.appendChild(bannerTitle);

      const addBtn=document.createElement('button');
      addBtn.style.cssText='background:#1c2537;color:#fff;border:none;padding:7px 16px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;';
      addBtn.textContent='Add to Agenda';
      addBtn.addEventListener('click',async()=>{
        addBtn.disabled=true;addBtn.textContent='Adding…';
        try{
          const newSustainings=[...aSustainings,...missing.sustain.map(s=>({member:s.member,calling:s.calling}))];
          const newReleases=[...aReleases,...missing.release.map(r=>({member:r.member,calling:r.calling}))];
          const{error}=await sb.from('agendas').update({
            sustainings:JSON.stringify(newSustainings),
            releases:JSON.stringify(newReleases),
          }).eq('id',a.id);
          if(error)throw error;
          a.sustainings=newSustainings;a.releases=newReleases;
          // Refresh from DB
          const{data}=await sb.from('agendas').select('*').eq('id',a.id).single();
          if(data){
            const idx=state.agendas.findIndex(x=>x.id===a.id);
            if(idx>=0)state.agendas[idx]=agendaFromDb(data);
          }
          render();
        }catch(e){
          alert('Error: '+e.message);
          addBtn.disabled=false;addBtn.textContent='Add to Agenda';
        }
      });
      bannerHdr.appendChild(addBtn);
      banner.appendChild(bannerHdr);

      // List the missing items
      const bannerList=document.createElement('div');bannerList.style.cssText='margin-top:8px;font-size:12px;color:#92400e;';
      items.forEach(item=>{
        const line=document.createElement('div');line.style.cssText='padding:2px 0;';line.textContent='• '+item;
        bannerList.appendChild(line);
      });
      banner.appendChild(bannerList);
      el.appendChild(banner);
    }
    }catch(e){console.error('Banner error:',e);}
  }
  if(!isSacramentMeeting){
    const doc=document.createElement('div');
    doc.style.cssText='background:#fff;border:1px solid rgba(0,0,0,0.08);border-radius:12px;padding:28px 32px;max-width:760px;';

    // Meeting title + date
    const titleRow=document.createElement('div');titleRow.style.cssText='margin-bottom:20px;padding-bottom:16px;border-bottom:2px solid #1c2537;';
    const types=getMeetingTypes(role);
    const mt=types.find(t=>t.key===a.meetingCategory)||{label:a.meetingCategory};
    titleRow.innerHTML=`<div style="font-size:18px;font-weight:700;color:#1c2537;">${mt.label}</div><div style="font-size:13px;color:#888;margin-top:3px;">${a.ward} · ${fmtDate(a.date)}</div>`;
    doc.appendChild(titleRow);

    // Summary rows helper
    function row(lbl,val){
      if(!val)return;
      const r=document.createElement('div');r.style.cssText='display:flex;gap:20px;margin-bottom:10px;font-size:13px;align-items:baseline;';
      const l=document.createElement('span');l.style.cssText='font-weight:700;min-width:160px;color:#1c2537;flex-shrink:0;';l.textContent=lbl+':';
      const v=document.createElement('span');v.style.color='#333';v.textContent=val;
      r.appendChild(l);r.appendChild(v);doc.appendChild(r);
    }

    row('Conducting',a.conducting);
    row('Opening Prayer',a.openingPrayer);
    if(a.openingHymnNum||a.openingHymnTitle)
      row('Opening Hymn',`#${a.openingHymnNum||'—'}${a.openingHymnTitle?' — '+a.openingHymnTitle:''}`);
    if(a.spiritualThought)
      row(a.meetingType&&a.meetingType!=='Regular'&&a.meetingType!=='Spiritual Thought'?a.meetingType:'Spiritual Thought',a.spiritualThought);

    // Minutes from last meeting (stored in final_speaker_topic)
    if(a.finalSpeakerTopic){
      const sec=document.createElement('div');sec.style.cssText='margin-top:20px;padding-top:16px;border-top:1px solid rgba(0,0,0,0.08);';
      const secLbl=document.createElement('div');secLbl.style.cssText='font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#999;margin-bottom:10px;';secLbl.textContent='Minutes from Last Meeting';
      sec.appendChild(secLbl);
      const minText=document.createElement('div');minText.style.cssText='font-size:13px;color:#333;line-height:1.7;';minText.innerHTML=a.finalSpeakerTopic;
      sec.appendChild(minText);
      doc.appendChild(sec);
    }

    // Agenda items from announcement_list
    if(a.announcementList&&a.announcementList.length){
      const sec=document.createElement('div');sec.style.cssText='margin-top:16px;margin-bottom:6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#999;';sec.textContent='Agenda Items';doc.appendChild(sec);
      a.announcementList.filter(Boolean).forEach((item,i)=>{
        const p=document.createElement('div');p.style.cssText='font-size:13px;color:#333;padding:6px 0;border-bottom:1px solid rgba(0,0,0,0.05);';
        p.textContent=`${i+1}. ${item}`;doc.appendChild(p);
      });
    }

    if(a.closingHymnNum||a.closingHymnTitle)
      row('Closing Hymn',`#${a.closingHymnNum||'—'}${a.closingHymnTitle?' — '+a.closingHymnTitle:''}`);
    row('Closing Prayer',a.closingPrayer);

    el.appendChild(doc);

    // Live notes panel (uses speaker1Topic as storage for non-sacrament)
    const notesPanel=document.createElement('div');notesPanel.className='live-notes-panel';

    // Header + status
    const notesHdr=document.createElement('div');notesHdr.className='live-notes-header';
    const notesTitle=document.createElement('div');notesTitle.className='live-notes-title';notesTitle.textContent='Meeting Notes';
    const notesStatusWrap=document.createElement('div');notesStatusWrap.className='live-notes-status';
    const notesDot=document.createElement('div');notesDot.className='live-notes-dot';
    const notesStatusTxt=document.createElement('span');notesStatusTxt.textContent='Connecting…';
    notesStatusWrap.appendChild(notesDot);notesStatusWrap.appendChild(notesStatusTxt);
    notesHdr.appendChild(notesTitle);notesHdr.appendChild(notesStatusWrap);
    notesPanel.appendChild(notesHdr);

    // ── Rich text toolbar ────────────────────────────────────────────────────
    const toolbar=document.createElement('div');toolbar.className='rte-toolbar';

    function rteBtn(label,title,cmd,val){
      const btn=document.createElement('button');btn.className='rte-btn';
      btn.innerHTML=label;btn.title=title;btn.type='button';
      btn.addEventListener('mousedown',e=>{
        e.preventDefault(); // prevent editor blur
        document.execCommand(cmd,false,val||null);
        editor.focus();
        updateToolbarState();
      });
      return btn;
    }
    function sep(){const s=document.createElement('div');s.className='rte-sep';return s;}

    const btnBold=rteBtn('<b>B</b>','Bold (Ctrl+B)','bold');
    const btnItalic=rteBtn('<i>I</i>','Italic (Ctrl+I)','italic');
    const btnUnderline=rteBtn('<u>U</u>','Underline (Ctrl+U)','underline');
    toolbar.appendChild(btnBold);toolbar.appendChild(btnItalic);toolbar.appendChild(btnUnderline);
    toolbar.appendChild(sep());
    const btnUL=rteBtn('• List','Bullet list','insertUnorderedList');
    const btnOL=rteBtn('1. List','Numbered list','insertOrderedList');
    toolbar.appendChild(btnUL);toolbar.appendChild(btnOL);
    toolbar.appendChild(sep());
    const btnClear=rteBtn('✕ Clear','Remove formatting','removeFormat');
    toolbar.appendChild(btnClear);
    notesPanel.appendChild(toolbar);

    // ── Contenteditable editor ───────────────────────────────────────────────
    const editor=document.createElement('div');editor.className='rte-editor';
    editor.contentEditable='true';
    editor.setAttribute('data-placeholder','Type meeting notes here — bold, bullets, and live sync supported…');
    editor.innerHTML=a.speaker1Topic||'';
    notesPanel.appendChild(editor);

    // Highlight active toolbar buttons based on cursor position
    function updateToolbarState(){
      btnBold.classList.toggle('active',document.queryCommandState('bold'));
      btnItalic.classList.toggle('active',document.queryCommandState('italic'));
      btnUnderline.classList.toggle('active',document.queryCommandState('underline'));
      btnUL.classList.toggle('active',document.queryCommandState('insertUnorderedList'));
      btnOL.classList.toggle('active',document.queryCommandState('insertOrderedList'));
    }
    editor.addEventListener('keyup',updateToolbarState);
    editor.addEventListener('mouseup',updateToolbarState);
    editor.addEventListener('selectionchange',updateToolbarState);

    const notesFooter=document.createElement('div');notesFooter.className='live-notes-footer';
    notesFooter.textContent='Notes are shared live. Last edit wins if two people type simultaneously.';
    notesPanel.appendChild(notesFooter);
    el.appendChild(notesPanel);

    // ── Realtime sync ────────────────────────────────────────────────────────
    if(window._agendaNotesChannel){try{sb.removeChannel(window._agendaNotesChannel);}catch(e){}window._agendaNotesChannel=null;}
    let saveTimer=null;
    let lastTyped=0; // timestamp of last local keypress
    const TYPING_COOLDOWN=2000; // don't apply remote updates while actively typing

    function setStatus(label,dotClass){notesStatusTxt.textContent=label;notesDot.className='live-notes-dot'+(dotClass?' '+dotClass:'');}

    try{
      const channel=sb.channel(`agenda-notes-${a.id}`,{config:{broadcast:{self:false}}});

      channel.on('broadcast',{event:'notes-update'},payload=>{
        if(!payload.payload?.notes) return;
        const timeSinceTyping=Date.now()-lastTyped;
        if(timeSinceTyping<TYPING_COOLDOWN) return; // user is actively typing, skip
        const html=payload.payload.notes;
        if(editor.innerHTML!==html) editor.innerHTML=html;
        a.speaker1Topic=html;
        setStatus('Live','live');
      });

      channel.subscribe(s=>{
        if(s==='SUBSCRIBED')setStatus('Live','live');
        else if(s==='CHANNEL_ERROR'||s==='TIMED_OUT')setStatus('Offline','');
      });

      window._agendaNotesChannel=channel;

      editor.addEventListener('input',()=>{
        lastTyped=Date.now();
        setStatus('Saving…','saving');
        clearTimeout(saveTimer);
        saveTimer=setTimeout(async()=>{
          const html=editor.innerHTML;
          channel.send({type:'broadcast',event:'notes-update',payload:{notes:html}});
          try{
            await sb.from('agendas').update({speaker1_topic:html}).eq('id',a.id);
            a.speaker1Topic=html;
            setStatus('Saved ✓','');
            setTimeout(()=>setStatus('Live','live'),1500);
          }catch(e){setStatus('Save failed','');}
        },700);
      });

    }catch(e){
      setStatus('Auto-save only','');
      editor.addEventListener('input',()=>{
        lastTyped=Date.now();
        clearTimeout(saveTimer);
        saveTimer=setTimeout(async()=>{
          const html=editor.innerHTML;
          await sb.from('agendas').update({speaker1_topic:html}).eq('id',a.id);
          a.speaker1Topic=html;
          setStatus('Saved ✓','');
        },800);
      });
    }
    return;
  }

  // ── Sacrament meeting: full document with logo and script ──────────────────
  const doc=document.createElement('div');

  // Header row: logo | text | spacer
  const docHdr=document.createElement('div');
  docHdr.style.cssText='display:flex;align-items:flex-start;gap:20px;margin-bottom:8px;';
  const logoWrap=document.createElement('div');logoWrap.style.cssText='width:60px;flex-shrink:0;margin-top:-14px;';
  logoWrap.innerHTML=LOGO_SVG;
  const hdrText=document.createElement('div');hdrText.style.cssText='flex:1;text-align:center;';
  hdrText.innerHTML=`
    <div style="font-size:12px;font-weight:700;letter-spacing:0.05em;color:#1c2537;margin-bottom:3px;">THE CHURCH OF JESUS CHRIST OF LATTER-DAY SAINTS</div>
    <div style="font-size:17px;font-weight:700;color:#1c2537;">${a.ward}</div>
    <div style="font-size:14px;font-weight:600;margin-top:2px;color:#333;">Sacrament Meeting — ${a.meetingType==='Fast & Testimony'?'Fast &amp; Testimony':'Regular'}</div>
    <div style="font-size:13px;margin-top:3px;color:#555;">${fmtDate(a.date)}</div>`;
  const logoSpacer=document.createElement('div');logoSpacer.style.width='60px';
  docHdr.appendChild(logoWrap);docHdr.appendChild(hdrText);docHdr.appendChild(logoSpacer);
  doc.appendChild(docHdr);

  const hr1=document.createElement('hr');hr1.style.cssText='border:none;border-top:2px solid #1c2537;margin:12px 0 16px;';doc.appendChild(hr1);

  // Meta lines
  function metaLine(lbl,val){
    if(!val)return;
    const row=document.createElement('div');row.style.cssText='display:flex;gap:20px;margin-bottom:5px;font-size:13px;';
    const l=document.createElement('span');l.style.cssText='font-weight:700;min-width:110px;color:#1c2537;';l.innerHTML=lbl+':';
    const v=document.createElement('span');v.style.color='#333';v.textContent=val;
    row.appendChild(l);row.appendChild(v);doc.appendChild(row);
  }
  metaLine('Presiding',a.presiding);
  metaLine('Conducting',a.conducting);
  if(a.highCounselor)metaLine('Visiting HC',a.highCounselor+(a.stakeVisiting?' (Stake Business)':''));
  metaLine('Chorister',a.chorister);
  metaLine('Accompanist',a.accompanist);

  const hr2=document.createElement('hr');hr2.style.cssText='border:none;border-top:1px solid #ccc;margin:14px 0 16px;';doc.appendChild(hr2);

  // Helpers
  function agendaItem(lbl,val){
    const row=document.createElement('div');row.style.cssText='display:flex;gap:16px;margin-bottom:8px;font-size:13px;align-items:baseline;';
    const l=document.createElement('span');l.style.cssText='font-weight:700;min-width:130px;color:#1c2537;flex-shrink:0;';l.textContent=lbl+':';
    const v=document.createElement('span');v.style.color='#333';v.innerHTML=val;
    row.appendChild(l);row.appendChild(v);doc.appendChild(row);
  }
  function scriptPara(txt){
    if(!txt||!txt.trim())return;
    const p=document.createElement('p');
    p.style.cssText='font-size:13px;line-height:1.75;color:#555;font-style:italic;margin:8px 0 14px 0;padding-left:14px;border-left:3px solid #ddd;white-space:pre-wrap;';
    p.textContent=txt;doc.appendChild(p);
  }
  function sectionDiv(lbl){
    const d2=document.createElement('div');
    d2.style.cssText='font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#999;margin:18px 0 10px;';
    d2.textContent=lbl;doc.appendChild(d2);
  }

  const isFast=a.meetingType==='Fast & Testimony';

  // Welcome
  scriptPara(`Good afternoon brothers and sisters. We welcome you to the ${isFast?'Fast and Testimony Meeting':'Sacrament Meeting'} for the ${a.ward} of the Church of Jesus Christ of Latter-day Saints.`);

  // Introduction
  function titledName2(name,title){if(!name)return'[Name]';const t=title||'';if(t==='Counselor/Other')return`Brother ${name}`;if(t==='Elder'||t==='President'||t==='Bishop')return`${t} ${name}`;return name;}
  const conductingFull2=titledName2(a.conducting,a.conductingTitle);
  const presidingFull2=a.presiding?titledName2(a.presiding,a.presidingTitle):'';
  let intro=`My name is ${conductingFull2}. ${presidingFull2?`${presidingFull2}, who presides at today's meeting, has asked that I conduct.`:''}`;
  if(a.highCounselor)intro+=`\n\nWe welcome ${a.highCounselor} from the Stake High Council on the stand with us today.`;
  if(a.chorister||a.accompanist)intro+=`\n\nWe'd like to extend a special thank you to our Chorister ${a.chorister||'[Chorister]'} and our Accompanist ${a.accompanist||'[Accompanist]'} who will provide the music for today's meeting.`;
  scriptPara(intro.trim());

  // Announcements
  const annList=a.announcementList?a.announcementList.filter(Boolean):[];
  if(annList.length){
    sectionDiv('Announcements');
    scriptPara('By way of announcements:\n\n'+annList.map((x,i)=>annList.length>1?`${i+1}. ${x}`:x).join('\n'));
  }

  // Opening Hymn & Prayer
  scriptPara(`Our opening hymn will be hymn number ${a.openingHymnNum||'[hymn number]'}${a.openingHymnTitle?`, "${a.openingHymnTitle}"`:''}.  After the conclusion of the hymn ${a.openingPrayer||'[opening prayer]'} will offer our opening prayer.`);
  if(a.openingHymnNum||a.openingHymnTitle)
    agendaItem('Opening Hymn',`#${a.openingHymnNum||'—'}${a.openingHymnTitle?`, "${a.openingHymnTitle}"`:''}`);
  if(a.openingPrayer)agendaItem('Invocation',a.openingPrayer);

  // Stake Business
  if(a.highCounselor&&a.stakeVisiting){
    sectionDiv('Stake Business');
    scriptPara(`We'll now turn the time over to ${a.highCounselor} for some stake business.`);
    agendaItem('Stake Business',a.highCounselor);
  }

  // Ward Business
  const releases=a.releases?a.releases.filter(r=>r.member):[];
  const sustainings=a.sustainings?a.sustainings.filter(s=>s.member):[];
  const ords=a.ordinations?a.ordinations.filter(o=>o.member):[];
  const blessings=a.babyBlessingsList?a.babyBlessingsList.filter(Boolean):[];
  const confs=a.confirmationsList?a.confirmationsList.filter(Boolean):[];
  const newRecs=a.newRecordsList?a.newRecordsList.filter(Boolean):[];
  const hasWB=releases.length||sustainings.length||ords.length||blessings.length||confs.length||newRecs.length;

  if(hasWB){
    sectionDiv('Ward Business');
    scriptPara('Before we Continue with the Sacrament portion of our program, we have some Ward Business to take care of.');
    if(newRecs.length){
      scriptPara(`We'd like to welcome the following member${newRecs.length>1?'s':''} whose records have been received into our ward:\n\n${newRecs.join('\n')}`);
      agendaItem('New Record(s)',newRecs.join('<br>'));
    }
    if(releases.length){
      const pl=releases.length>1;
      scriptPara(`The following member${pl?'s have':' has'} been released from ${pl?'their':'his/her'} calling:\n\n${releases.map(r=>`${r.member}${r.calling?` as ${r.calling}`:''}`).join('\n')}\n\nWe propose that ${pl?'they':'he/she'} be given a vote of thanks for ${pl?'their':'his/her'} service. Those who wish to express their appreciation may manifest by the uplifted hand.`);

      // Release agenda items with optional "mark complete" checkbox for linked callings
      const relDiv=document.createElement('div');relDiv.style.cssText='margin-bottom:8px;';
      const relLblEl=document.createElement('span');relLblEl.style.cssText='font-weight:700;min-width:130px;font-size:13px;color:#1c2537;display:inline-block;';relLblEl.textContent='Release(s):';
      relDiv.appendChild(relLblEl);
      releases.forEach(r=>{
        const rrow=document.createElement('div');rrow.style.cssText='display:flex;align-items:center;gap:8px;margin-top:4px;padding-left:130px;font-size:13px;';
        const rname=document.createElement('span');rname.style.flex='1';rname.textContent=`${r.member}${r.calling?` — ${r.calling}`:''}`;
        rrow.appendChild(rname);
        if(r._callingId||r.member){
          const linkedC=r._callingId
            ? state.callings.find(c=>c.id===r._callingId)
            : state.callings.find(c=>c.ward===a.ward&&(c.releaseName===r.member||c.name===r.member)&&c.calling===r.calling);
          if(linkedC){
            const steps=getSteps(linkedC);
            const relIdx=Math.max(steps.indexOf('Extend Release'),steps.indexOf('Release Current'),steps.indexOf('Release over Pulpit'));
            const alreadyDone=relIdx>=0&&linkedC.currentStep>relIdx;
            const cb=document.createElement('input');cb.type='checkbox';cb.checked=alreadyDone;
            cb.title='Mark Release as complete in Callings';
            cb.style.cssText='width:16px;height:16px;cursor:pointer;accent-color:#1c7a45;';
            const cblbl=document.createElement('span');cblbl.style.cssText='font-size:11px;color:#888;white-space:nowrap;';cblbl.textContent='Mark released';
            cb.addEventListener('change',()=>{
              if(cb.checked){
                if(relIdx>=0){linkedC.stepDates[relIdx]=today();linkedC.currentStep=Math.max(linkedC.currentStep,relIdx+1);}
              } else {
                if(relIdx>=0){linkedC.stepDates[relIdx]=undefined;if(linkedC.currentStep===relIdx+1)linkedC.currentStep=relIdx;}
              }
              saveState();
            });
            rrow.appendChild(cb);rrow.appendChild(cblbl);
          }
        }
        relDiv.appendChild(rrow);
      });
      doc.appendChild(relDiv);
    }
    if(sustainings.length){
      const pl=sustainings.length>1;
      scriptPara(`The following member${pl?'s have':' has'} been called. If ${pl?'they are':'he/she is'} here, will ${pl?'they':'he/she'} please stand until after the vote is taken. We have called:\n\n${sustainings.map(s=>`${s.member}${s.calling?` as ${s.calling}`:''}`).join('\n')}\n\nWe propose that ${pl?'they':'he/she'} be sustained. Those in favor may manifest it by the uplifted hand. [Pause briefly for the sustaining vote.] Those opposed, if any, may manifest it. [Pause briefly to allow for a dissenting vote, if any.] Thank you.`);

      // Sustaining agenda items with optional "mark complete" checkbox for linked callings
      const susDiv=document.createElement('div');susDiv.style.cssText='margin-bottom:8px;';
      const susLblEl=document.createElement('span');susLblEl.style.cssText='font-weight:700;min-width:130px;font-size:13px;color:#1c2537;display:inline-block;';susLblEl.textContent='Sustaining(s):';
      susDiv.appendChild(susLblEl);

        const srow=document.createElement('div');srow.style.cssText='display:flex;align-items:center;gap:8px;margin-top:4px;padding-left:130px;font-size:13px;';
        const sname=document.createElement('span');sname.style.flex='1';sname.textContent=`${s.member}${s.calling?` — ${s.calling}`:''}`;
        srow.appendChild(sname);
        if(s._callingId||s.member){
          const linkedC=s._callingId
            ? state.callings.find(c=>c.id===s._callingId)
            : state.callings.find(c=>c.ward===a.ward&&c.name===s.member&&c.calling===s.calling);
          if(linkedC){
            const steps=getSteps(linkedC);
            const sustainIdx=Math.max(steps.indexOf('Sustain over Pulpit'),steps.indexOf('Sustain & Release over Pulpit'));
            const alreadyDone=sustainIdx>=0&&linkedC.currentStep>sustainIdx;
            const cb=document.createElement('input');cb.type='checkbox';cb.checked=alreadyDone;
            cb.title='Mark Sustain over Pulpit as complete in Callings';
            cb.style.cssText='width:16px;height:16px;cursor:pointer;accent-color:#1c7a45;';
            const cblbl=document.createElement('span');cblbl.style.cssText='font-size:11px;color:#888;white-space:nowrap;';cblbl.textContent='Mark sustained';
            cb.addEventListener('change',()=>{
              if(cb.checked){
                if(sustainIdx>=0){linkedC.stepDates[sustainIdx]=today();linkedC.currentStep=Math.max(linkedC.currentStep,sustainIdx+1);}
              } else {
                if(sustainIdx>=0){linkedC.stepDates[sustainIdx]=undefined;if(linkedC.currentStep===sustainIdx+1)linkedC.currentStep=sustainIdx;}
              }
              saveState();
            });
            srow.appendChild(cb);srow.appendChild(cblbl);
          }
        }
        susDiv.appendChild(srow);
      });
      doc.appendChild(susDiv);
    }
    if(ords.length){
      ords.forEach(o=>scriptPara(`We will now proceed with the ordination of ${o.member} to the office of ${o.office} in the ${['Deacon','Teacher','Priest'].includes(o.office)?'Aaronic':'Melchizedek'} Priesthood.`));
      agendaItem('Ordination(s)',ords.map(o=>`${o.member} — ${o.office}`).join('<br>'));
    }
    if(blessings.length){
      scriptPara(`We will now proceed with the blessing of the following child${blessings.length>1?'ren':''}:\n\n${blessings.join('\n')}`);
      agendaItem('Baby Blessing(s)',blessings.join('<br>'));
    }
    if(confs.length){
      scriptPara(`We will now proceed with the confirmation of the following individual${confs.length>1?'s':''}:\n\n${confs.join('\n')}`);
      agendaItem('Confirmation(s)',confs.join('<br>'));
    }
  }

  // Sacrament
  sectionDiv('Sacrament');
  scriptPara(`We will now prepare for the partaking of the Sacrament by singing hymn #${a.sacramentHymnNum||'[hymn number]'}${a.sacramentHymnTitle?`, "${a.sacramentHymnTitle}"`:''}.  Following the hymn, the Sacrament will be administered by the Aaronic Priesthood.`);
  if(a.sacramentHymnNum||a.sacramentHymnTitle)
    agendaItem('Sacrament Hymn',`#${a.sacramentHymnNum||'—'}${a.sacramentHymnTitle?`, "${a.sacramentHymnTitle}"`:''}`);
  agendaItem('Administration','Sacrament administered by the Aaronic Priesthood');

  // Program
  sectionDiv(isFast?'Fast & Testimony':'Program');
  if(isFast){
    scriptPara('We will now open the meeting for the bearing of testimonies. We invite all who feel so inclined to come to the podium and share their testimony.');
  } else {
    const spk=[];
    if(a.speaker1)spk.push({name:a.speaker1,topic:a.speaker1Topic});
    if(a.speaker2)spk.push({name:a.speaker2,topic:a.speaker2Topic});
    if(spk.length||a.finalSpeaker){
      let prog="We'd like to thank the Aaronic Priesthood for the reverent manner in which they administered the Sacrament.\n\nThe remainder of our program will go as follows:\n\n";
      if(spk.length>0) prog+=`- We will first be privileged to hear from ${spk[0].name}.`;
      if(spk.length>1) prog+=`\n\n- Following ${spk[0].name}'s remarks we will be pleased to hear from ${spk[1].name}.`;
      if(a.intermediateHymn||a.intermediateHymnTitle) prog+=`\n\n- Our Intermediate Hymn will be ${a.intermediateHymn?`#${a.intermediateHymn}`:''}${a.intermediateHymn&&a.intermediateHymnTitle?', ':''}${a.intermediateHymnTitle||''}.`;
      if(a.finalSpeaker) prog+=`\n\n- And our concluding speaker will be ${a.finalSpeaker}.`;
      scriptPara(prog.trim());
    }
    spk.forEach(s=>{
      agendaItem('Speaker',s.name);
    });
    if(a.intermediateHymn||a.intermediateHymnTitle){
      agendaItem('Intermediate',`${a.intermediateHymn?`#${a.intermediateHymn} `:''}${a.intermediateHymnTitle?`"${a.intermediateHymnTitle}"`:''}` );
    }
    if(a.finalSpeaker){
      agendaItem('Final Speaker',a.finalSpeaker);
    }
  }

  // Closing
  sectionDiv('Closing');
  scriptPara(`I'd like to thank our speakers for the spirit that was felt here today.\n\nOur closing hymn will be hymn #${a.closingHymnNum||'[hymn number]'}${a.closingHymnTitle?`, "${a.closingHymnTitle}"`:''}.\n\nAfter the hymn the closing prayer will be offered by ${a.closingPrayer||'[closing prayer]'}.`);
  if(a.closingHymnNum||a.closingHymnTitle)
    agendaItem('Closing Hymn',`#${a.closingHymnNum||'—'}${a.closingHymnTitle?`, "${a.closingHymnTitle}"`:''}`);
  if(a.closingPrayer)agendaItem('Benediction',a.closingPrayer);

  el.appendChild(doc);

}

// ── Branch steps — parallel tasks that run off the main flow ────────────────
// Branches attach to trigger steps and must all be done for Complete to unlock.
// Stored in c.stepMeta.branches = { lcrSustain: bool, setApart: bool, lcrSetApart: bool }
function getBranches(c){
  const action=c.action||'';
  const isCalling=action==='Calling Only'||action==='Calling & Release';
  const isRelease=action==='Release Only'||action==='Calling & Release';
  const steps=getSteps(c);
  const sustainStep=['Sustain over Pulpit','Sustain & Release over Pulpit','Release over Pulpit'].find(s=>steps.includes(s));
  if(!sustainStep) return [];

  const branches=[];
  // Branch 1: Record Sustaining in LCR — appears after sustain step
  const sustainDate=c.stepDates[steps.indexOf(sustainStep)]||'';
  if(isCalling){
    branches.push({
      key:'lcrSustain',
      trigger:sustainStep,
      label:`Record Sustaining — ${c.name} as ${c.calling}${sustainDate?' ('+fmt(sustainDate)+')':''}`,
      sub:'Enter the new calling with sustained date in LCR',
      tag:'Clerk',
    });
  }
  if(isRelease){
    const relName=c.releaseName||c.name;
    branches.push({
      key:'lcrRelease',
      trigger:sustainStep,
      label:`Record Release — ${relName} from ${c.calling}`,
      sub:'Remove the calling from LCR',
      tag:'Clerk',
    });
  }
  // Branch 2: Set Apart — appears after sustain step (Bishopric task)
  if(isCalling){
    branches.push({
      key:'setApart',
      trigger:sustainStep,
      label:`Set Apart — ${c.name}`,
      sub:'Perform the setting apart blessing',
      tag:'Bishopric',
    });
    // Branch 3: Record Set Apart in LCR — appears after setApart is done
    branches.push({
      key:'lcrSetApart',
      trigger:'setApart', // special: triggers when setApart branch is done
      label:'Record Set Apart in LCR',
      sub:'Check the Set Apart checkbox in LCR',
      tag:'Clerk',
    });
  }
  return branches;
}

function branchesAllDone(c){
  const branches=getBranches(c);
  if(!branches.length) return true;
  const meta=c.stepMeta?.branches||{};
  return branches.every(b=>!!meta[b.key]);
}

function pendingBranchLabel(c){
  const branches=getBranches(c);
  const meta=c.stepMeta?.branches||{};
  const pending=branches.filter(b=>!meta[b.key]);
  if(!pending.length) return '—';
  // Return the first pending branch label, shortened
  const first=pending[0];
  if(first.key==='lcrSustain') return 'Record in LCR';
  if(first.key==='lcrRelease') return 'Record Release in LCR';
  if(first.key==='setApart') return 'Set Apart';
  if(first.key==='lcrSetApart') return 'Record Set Apart in LCR';
  return first.label.split('—')[0].trim();
}

function getHCRosterNames(){
  const names=[];
  (state.hcRoster||[]).forEach(row=>{
    if(!row||!row.profile_id) return;
    const p=(state.profiles||[]).find(x=>x.id===row.profile_id);
    if(p&&p.full_name) names.push(p.full_name);
  });
  return names;
}

    :'<span style="color:#aaa;font-size:12px;">—</span>';

  // Member extra info
  const mi=document.createElement('div');mi.className='info-grid';mi.style.marginTop='4px';
