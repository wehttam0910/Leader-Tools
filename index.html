    document.getElementById('banner-role-name').textContent=role.label+wardLabel;
  }
  else banner.classList.add('hidden');
  applySidebarState();
  forceNavWhite();
}

// ── Modals ───────────────────────────────────────────────────────────────────
function openCallingModal(role){
  const root=document.getElementById('modal-root');root.innerHTML='';
  const overlay=document.createElement('div');overlay.className='modal-overlay';
  overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal();});
  const modal=document.createElement('div');modal.className='modal';
  applyMobileModal(overlay,modal);
  overlay.appendChild(modal);

  const isAdmin=role.scope==='admin';
  const isStake=role.scope==='stake';
  const isWard=role.scope==='ward';
  const isWardOrg=role.scope==='ward_org';

  // ── Wizard data ──────────────────────────────────────────────────────────
  const data={
    intent:null,           // 'fill' (Calling) | 'release' (Release)
    releaseThenCall:null,  // 'yes'|'no' — for release path, are they also being called?
    currentlyFilledAnswer:null, // 'yes' | 'no'
    callingLevel:null,     // 'Stake' | 'Stake Issued' (stake/admin only)
    org:null,
    ward:null,
    callingName:null,
    callingOrg:null,
    callingLevelFinal:null,
    isCustom:false,
    // Release current holder (intent=both)
    releaseName:'',
    linkedHolderReleaseId:null,  // if linked via picker, the existing release id
    // New member info
    memberName:'',
    memberCurrentCalling:'',
    memberCallings:[''],  // legacy
    memberReleaseEntries:[],  // structured {org,calling}[] for prior-calling releases
    memberNeedsRelease:null,  // 'yes'|'no' — release member from their prior calling
    spouseName:'',
    spouseCalling:'',
    notes:'',
    // Sub-pickers for AP quorum, YW class, Primary/SS classes
    selectedQuorum:null,      // 'Priests' | 'Teachers' | 'Deacons'
    selectedYWClass:null,     // 'Gatherers of Light' | 'Messengers of Hope' | 'Builders of Faith'
    selectedClasses:[],       // array of Primary or SS class strings
  };

  // Helper: does the current calling selection need a quorum picker?
  function needsQuorumPicker(){
    const dir=CALLING_DIR.find(c=>c.name===data.callingName&&c.org==='Aaronic Priesthood');
    return !!(dir&&dir.quorumPicker);
  }
  // Helper: does the current calling selection need a YW class picker?
  function needsYWClassPicker(){
    const dir=CALLING_DIR.find(c=>c.name===data.callingName&&c.org==='Young Women');
    return !!(dir&&dir.classPicker);
  }
  // Helper: does the current calling selection need a Primary class picker?
  function needsPrimaryClassPicker(){
    const dir=CALLING_DIR.find(c=>c.name===data.callingName&&c.classPickerType==='primary');
    return !!(dir&&dir.classPicker);
  }
  // Helper: does the current calling selection need a SS class picker?
  function needsSSClassPicker(){
    const dir=CALLING_DIR.find(c=>c.name===data.callingName&&c.classPickerType==='ss');
    return !!(dir&&dir.classPicker);
  }

  // ── Build step list based on role + intent ───────────────────────────────
  function buildSteps(){
    const steps=['intent'];

    // Release path: ask if they're also being called
    if(data.intent==='release'){
      steps.push('release-then-call');
      // If NOT also being called → simple release flow
      if(data.releaseThenCall!=='yes'){
        if(isAdmin||isStake){steps.push('calling-level');steps.push('org-or-ward');}
        else if(isWard){steps.push('org');}
        steps.push('calling');
        if(needsQuorumPicker()) steps.push('quorum-picker');
        else if(needsYWClassPicker()) steps.push('yw-class-picker');
        else if(needsPrimaryClassPicker()) steps.push('class-picker-primary');
        else if(needsSSClassPicker()) steps.push('class-picker-ss');
        steps.push('member');
        steps.push('notes');
        return steps;
      }
      // else fall through to calling flow below (releaseThenCall === 'yes')
    }

    // Calling path (intent==='fill' OR release-then-call==='yes')
    if(isAdmin||isStake){
      steps.push('calling-level');
      steps.push('org-or-ward');
    } else if(isWard){
      steps.push('org');
    }
    steps.push('calling');
    if(needsQuorumPicker()) steps.push('quorum-picker');
    else if(needsYWClassPicker()) steps.push('yw-class-picker');
    else if(needsPrimaryClassPicker()) steps.push('class-picker-primary');
    else if(needsSSClassPicker()) steps.push('class-picker-ss');
    // Is there a current holder of the new position to release?
    steps.push('filled');
    // Member info
    steps.push('member');
    // Does the called person need releasing from a prior calling?
    steps.push('member-release');
    steps.push('notes');
    return steps;
  }

  let steps=buildSteps();
  let idx=0;

  // ── Helpers ──────────────────────────────────────────────────────────────
  function getUniqueOrgs(dir){
    const seen=new Set();
    return dir.map(c=>c.org).filter(o=>{if(seen.has(o))return false;seen.add(o);return true;});
  }

  function getCallingDir(){
    let d=CALLING_DIR;
    if(data.callingLevel==='Stake Issued'){
      d=d.filter(c=>c.level==='Stake Issued');
    } else if(data.callingLevel==='Stake'){
      d=d.filter(c=>c.level==='Stake');
      if(data.org) d=d.filter(c=>c.org===data.org);
    } else if(isWard){
      d=d.filter(c=>(c.level==='Stake Issued'||c.level==='Ward')&&!c.stakeOnly);
      if(data.org) d=d.filter(c=>c.org===data.org);
    } else if(isWardOrg){
      d=d.filter(c=>c.level==='Ward'&&c.org===role.org);
    } else {
      d=getCallingDirForRole(role);
      if(data.org) d=d.filter(c=>c.org===data.org);
    }
    return d;
  }

  function derived(){
    // Two-action model:
    // - intent 'release' + not also-called → 'Release' (standalone release record)
    // - intent 'fill' OR release-then-call 'yes' → 'Calling' (may have linked releases)
    let action;
    const isReleaseOnly=data.intent==='release'&&data.releaseThenCall!=='yes';
    action=isReleaseOnly?'Release':'Calling';
    const level=data.callingLevelFinal||(data.callingLevel==='Stake Issued'?'Stake Issued':data.callingLevel==='Stake'?'Stake':'Ward');
    const ward=data.ward||(isWard||isWardOrg?role.ward:'Stake');
    const org=data.callingOrg||data.org||role.org||'';
    return{action,level,ward,org};
  }

  // ── Render ───────────────────────────────────────────────────────────────
  root.innerHTML='';
  applyMobileModal(overlay,modal);
  root.appendChild(overlay);

  function renderWizard(){
    modal.innerHTML='<div class="modal-handle"></div>';

    // Progress dots
    const dots=document.createElement('div');dots.className='wizard-step-indicator';
    steps.forEach((_,i)=>{
      const d=document.createElement('div');
      d.className='wizard-dot'+(i<idx?' done':i===idx?' active':'');
      dots.appendChild(d);
    });
    modal.appendChild(dots);

    const stepId=steps[idx];

    function title(txt){const t=document.createElement('div');t.className='modal-title';t.textContent=txt;modal.appendChild(t);}
    function subtitle(txt){const s=document.createElement('div');s.style.cssText='font-size:13px;color:#5a5a5a;margin-bottom:16px;margin-top:-8px;';s.textContent=txt;modal.appendChild(s);}
    function fg(lbl,el,hint){
      const g=document.createElement('div');g.className='form-group';
      const l=document.createElement('label');l.className='form-label';l.innerHTML=lbl;g.appendChild(l);
      if(hint){const h=document.createElement('div');h.style.cssText='font-size:11px;color:#636363;margin-bottom:6px;';h.textContent=hint;g.appendChild(h);}
      g.appendChild(el);modal.appendChild(g);return el;
    }
    function textInp(lbl,placeholder,key,hint){
      const inp=document.createElement('input');inp.type='text';inp.placeholder=placeholder;inp.value=data[key]||'';
      inp.addEventListener('input',()=>{data[key]=inp.value;});
      return fg(lbl,inp,hint);
    }
    function radioGroup(options,key){
      const wrap=document.createElement('div');wrap.className='radio-group';
      options.forEach(opt=>{
        const row=document.createElement('div');row.className='radio-opt'+(data[key]===opt.value?' selected':'');
        const inp=document.createElement('input');inp.type='radio';inp.name=key;inp.value=opt.value;inp.checked=data[key]===opt.value;
        const lbl=document.createElement('div');
        lbl.innerHTML=`<div class="radio-opt-label">${opt.label}</div>${opt.sub?`<div class="radio-opt-sub">${opt.sub}</div>`:''}`;
        row.appendChild(inp);row.appendChild(lbl);
        row.addEventListener('click',()=>{
          data[key]=opt.value;
          wrap.querySelectorAll('.radio-opt').forEach(r=>r.classList.remove('selected'));
          row.classList.add('selected');inp.checked=true;
          if(opt.onChange) opt.onChange();
        });
        wrap.appendChild(row);
      });
      modal.appendChild(wrap);
      return wrap;
    }

    // ── INTENT ─────────────────────────────────────────────────────────────
    if(stepId==='intent'){
      title('What are you doing?');
      radioGroup([
        {value:'fill',   label:'Calling',  sub:'Call someone to a new position'},
        {value:'release',label:'Release',  sub:'Release someone from a calling'},
      ],'intent');
    }

    // ── RELEASE → also being called? (release path only) ────────────────────
    else if(stepId==='release-then-call'){
      title('Being Called to a New Position?');
      subtitle('Is this person also being called to a new calling right now?');
      radioGroup([
        {value:'no', label:'No — release only'},
        {value:'yes',label:'Yes — they are being called to a new position',
         sub:'This will switch to the Calling workflow'},
      ],'releaseThenCall');
    }

    // ── CALLING LEVEL (stake/admin) ─────────────────────────────────────────
    else if(stepId==='calling-level'){
      title('Calling Level');
      radioGroup([
        {value:'Stake',       label:'Stake Calling',        sub:'Called & set apart by Stake Presidency'},
        {value:'Stake Issued',label:'Stake-Issued Calling', sub:'Issued by Stake, extended in the ward (e.g. Bishop, EQ President)'},
      ],'callingLevel');
    }

    // ── ORG OR WARD (stake/admin) ───────────────────────────────────────────
    else if(stepId==='org-or-ward'){
      if(data.callingLevel==='Stake Issued'){
        title('Select Ward');
        const sel=document.createElement('select');
        WARDS_ONLY.forEach(w=>{const o=document.createElement('option');o.value=w;o.textContent=w;if(data.ward===w)o.selected=true;sel.appendChild(o);});
        if(!data.ward)data.ward=WARDS_ONLY[0];
        sel.addEventListener('change',()=>{data.ward=sel.value;});
        fg('Ward / Unit',sel);
      } else {
        title('Select Organization');
        const orgs=getUniqueOrgs(CALLING_DIR.filter(c=>c.level==='Stake'));
        radioGroup(orgs.map(o=>({value:o,label:o})),'org');
      }
    }

    // ── ORG (ward/bishopric) ────────────────────────────────────────────────
    else if(stepId==='org'){
      title('Select Organization');
      let d=CALLING_DIR;
      if(isWard) d=d.filter(c=>(c.level==='Stake Issued'||c.level==='Ward')&&!c.stakeOnly);
      const orgs=getUniqueOrgs(d);
      radioGroup(orgs.map(o=>({value:o,label:o.replace(/^Ward /,'')})),'org');
    }

    // ── CALLING ─────────────────────────────────────────────────────────────
    else if(stepId==='calling'){
      title(data.intent==='release'?'Which calling are they being released from?':'Select Calling');
      const dir=getCallingDir();
      const sel=document.createElement('select');
      sel.innerHTML='<option value="">— Select calling —</option>';
      const groups={};
      dir.forEach(c=>{if(!groups[c.org])groups[c.org]={level:c.level,items:[]};groups[c.org].items.push(c);});
      Object.entries(groups).forEach(([orgName,group])=>{
        const og=document.createElement('optgroup');og.label=orgName;
        group.items.forEach(c=>{
          const o=document.createElement('option');o.value=`${c.name}||${c.org}||${c.level}`;o.textContent=c.name+(c.custom?'  (Custom)':'');
          if(data.callingName===c.name&&!data.isCustom)o.selected=true;
          og.appendChild(o);
        });
        const co=document.createElement('option');co.value=`__custom__||${orgName}||${group.level}`;co.textContent=`✦ Custom (${orgName})...`;og.appendChild(co);
        sel.appendChild(og);
      });
      sel.addEventListener('change',()=>{
        const raw=sel.value;if(!raw)return;
        const parts=raw.split('||');
        const isFreeText=parts[0]==='__custom__';
        data.callingOrg=parts[1];data.callingLevelFinal=parts[2];
        if(isFreeText){
          data.isCustom=true;
          data.callingName='';
          customWrap.classList.remove('hidden');
        } else {
          data.callingName=parts[0];
          // A dir entry flagged custom marks the record custom, but no free-text box
          const dirEntry=CALLING_DIR.find(d=>d.name===parts[0]&&d.org===parts[1]);
          data.isCustom=!!(dirEntry&&dirEntry.custom);
          customWrap.classList.add('hidden');
        }
      });
      fg('Calling<span class="req">*</span>',sel);
      const customWrap=document.createElement('div');customWrap.className='custom-box'+(data.isCustom?'':' hidden');
      const cl=document.createElement('label');cl.className='form-label';cl.textContent='Custom calling name';
      const ci=document.createElement('input');ci.type='text';ci.placeholder='Enter calling title...';ci.value=(data.isCustom&&data.callingName)||'';
      ci.addEventListener('input',()=>{data.callingName=ci.value.trim();});
      customWrap.appendChild(cl);customWrap.appendChild(ci);modal.appendChild(customWrap);
    }

    // ── QUORUM PICKER (Aaronic Priesthood) ─────────────────────────────────
    else if(stepId==='quorum-picker'){
      title('Which Quorum?');
      radioGroup(AP_QUORUMS.map(q=>({
        value:q,
        label:q+' Quorum',
        sub:q==='Priests'?'Ages 16–17':q==='Teachers'?'Ages 14–15':'Ages 12–13',
      })),'selectedQuorum');
    }

    // ── YW CLASS PICKER ───────────────────────────────────────────────────
    else if(stepId==='yw-class-picker'){
      title('Which Class?');
      radioGroup(YW_CLASSES.map(c=>({value:c,label:c})),'selectedYWClass');
    }

    // ── PRIMARY CLASS PICKER (multi-select) ───────────────────────────────
    else if(stepId==='class-picker-primary'){
      title('Which Class(es)?');
      const sub2=document.createElement('div');sub2.style.cssText='font-size:13px;color:#5a5a5a;margin-bottom:16px;margin-top:-8px;';
      sub2.textContent='Select one or more classes this teacher will be assigned to.';
      modal.appendChild(sub2);
      if(!Array.isArray(data.selectedClasses))data.selectedClasses=[];
      const wrap=document.createElement('div');wrap.style.cssText='display:flex;flex-direction:column;gap:8px;';
      PRIMARY_CLASSES.forEach(cls=>{
        const row=document.createElement('label');row.style.cssText='display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid rgba(0,0,0,0.12);border-radius:8px;cursor:pointer;transition:border-color 0.15s,background 0.15s;';
        const cb=document.createElement('input');cb.type='checkbox';cb.value=cls;cb.style.cssText='width:16px;height:16px;accent-color:#1c2537;flex-shrink:0;';
        cb.checked=data.selectedClasses.includes(cls);
        cb.addEventListener('change',()=>{
          if(cb.checked)data.selectedClasses.push(cls);
          else data.selectedClasses=data.selectedClasses.filter(c=>c!==cls);
          row.style.borderColor=cb.checked?'#1c2537':'rgba(0,0,0,0.12)';
          row.style.background=cb.checked?'#f0f4ff':'';
        });
        if(cb.checked){row.style.borderColor='#1c2537';row.style.background='#f0f4ff';}
        const lbl=document.createElement('span');lbl.style.cssText='font-size:13px;font-weight:500;color:#1c2537;';lbl.textContent=cls;
        row.appendChild(cb);row.appendChild(lbl);wrap.appendChild(row);
      });
      modal.appendChild(wrap);
    }

    // ── SUNDAY SCHOOL CLASS PICKER (multi-select) ─────────────────────────
    else if(stepId==='class-picker-ss'){
      title('Which Class(es)?');
      const sub2=document.createElement('div');sub2.style.cssText='font-size:13px;color:#5a5a5a;margin-bottom:16px;margin-top:-8px;';
      sub2.textContent='Select one or more courses this teacher will be assigned to.';
      modal.appendChild(sub2);
      if(!Array.isArray(data.selectedClasses))data.selectedClasses=[];
      const wrap=document.createElement('div');wrap.style.cssText='display:flex;flex-direction:column;gap:8px;';
      SS_CLASSES.forEach(cls=>{
        const row=document.createElement('label');row.style.cssText='display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid rgba(0,0,0,0.12);border-radius:8px;cursor:pointer;transition:border-color 0.15s,background 0.15s;';
        const cb=document.createElement('input');cb.type='checkbox';cb.value=cls;cb.style.cssText='width:16px;height:16px;accent-color:#1c2537;flex-shrink:0;';
        cb.checked=data.selectedClasses.includes(cls);
        cb.addEventListener('change',()=>{
          if(cb.checked)data.selectedClasses.push(cls);
          else data.selectedClasses=data.selectedClasses.filter(c=>c!==cls);
          row.style.borderColor=cb.checked?'#1c2537':'rgba(0,0,0,0.12)';
          row.style.background=cb.checked?'#f0f4ff':'';
        });
        if(cb.checked){row.style.borderColor='#1c2537';row.style.background='#f0f4ff';}
        const lbl=document.createElement('span');lbl.style.cssText='font-size:13px;font-weight:500;color:#1c2537;';lbl.textContent=cls;
        row.appendChild(cb);row.appendChild(lbl);wrap.appendChild(row);
      });
      modal.appendChild(wrap);
    }

    // ── FILLED (is this calling currently occupied?) ────────────────────────
    else if(stepId==='filled'){
      title('Is this calling currently filled?');
      const sub2=document.createElement('div');sub2.style.cssText='font-size:13px;color:#5a5a5a;margin-bottom:16px;margin-top:-8px;';
      sub2.textContent='';
      modal.appendChild(sub2);

      radioGroup([
        {value:'no',  label:'No — this calling is vacant'},
        {value:'yes', label:'Yes — someone needs to be released from it'},
      ],'currentlyFilledAnswer');

      // Release name box — shows when 'yes' selected
      const rb=document.createElement('div');
      rb.className='currently-filled-box'+(data.currentlyFilledAnswer==='yes'?'':' hidden');
      rb.style.marginTop='12px';
      const rlbl=document.createElement('label');rlbl.className='form-label';rlbl.style.color='#7a5400';rlbl.innerHTML='Name of current holder to be released<span class="req">*</span>';
      const rinp=document.createElement('input');rinp.type='text';rinp.placeholder='Full name';rinp.value=data.releaseName||'';
      rinp.style.cssText='width:100%;padding:9px 12px;border:1px solid rgba(0,0,0,0.15);border-radius:8px;font-size:14px;background:#fff;color:#1a1a1a;margin-top:6px;';
      rb.appendChild(rlbl);rb.appendChild(rinp);

      // Live match indicator — shows exact or fuzzy match as you type
      const matchNote=document.createElement('div');matchNote.style.cssText='font-size:12px;margin-top:8px;display:none;';
      rb.appendChild(matchNote);

      function currentFinalCalling(){
        if(!data.callingName) return '';
        if(data.selectedQuorum) return data.selectedQuorum+' '+data.callingName;
        if(data.selectedYWClass) return data.selectedYWClass+' '+data.callingName;
        if(data.selectedClasses&&data.selectedClasses.length){
          const allC=[...PRIMARY_CLASSES,...SS_CLASSES];
          return data.callingName+' — '+data.selectedClasses.slice().sort((a,b)=>allC.indexOf(a)-allC.indexOf(b)).join(', ');
        }
        return data.callingName;
      }

      function updateMatchNote(){
        const nm=(rinp.value||'').trim();
        const cal=currentFinalCalling();
        const wardForMatch=data.ward||(isWard||isWardOrg?role.ward:'');
        if(!nm||!cal){matchNote.style.display='none';data.linkedHolderReleaseId=null;return;}
        const exact=findMatchingRelease(nm, cal, wardForMatch);
        if(exact){
          data.linkedHolderReleaseId=exact.id;
          matchNote.style.display='block';matchNote.style.color='#1a7a4c';
          matchNote.innerHTML=`✓ Will link to existing release: <strong>${exact.name} from ${exact.calling}</strong>`;
          return;
        }
        const canSeePicker=role.scope==='admin'||isStakePresidency(role)||(role.scope==='ward'&&role.org==='Bishopric');
        if(canSeePicker){
          const fuzzy=fuzzyMatchReleases(nm, cal, wardForMatch);
          if(fuzzy.length){
            const f=fuzzy[0];
            matchNote.style.display='block';matchNote.style.color='#a05c00';
            matchNote.innerHTML=`⚠ Similar release exists: <strong>${f.name} from ${f.calling}</strong>. `;
            const linkA=document.createElement('a');linkA.href='#';linkA.style.cssText='color:#185fa5;font-weight:600;text-decoration:underline;';linkA.textContent='Link to it';
            linkA.addEventListener('click',e=>{e.preventDefault();data.linkedHolderReleaseId=f.id;data.releaseName=f.name;rinp.value=f.name;updateMatchNote();});
            matchNote.appendChild(linkA);
            data.linkedHolderReleaseId=null;
            return;
          }
        }
        data.linkedHolderReleaseId=null;
        matchNote.style.display='block';matchNote.style.color='#5a5a5a';
        matchNote.innerHTML='A new release record will be created for this person.';
      }

      rinp.addEventListener('input',()=>{data.releaseName=rinp.value;data.linkedHolderReleaseId=null;updateMatchNote();});
      if(data.releaseName) updateMatchNote();

      // "Link existing release" button — Bishopric / Stake Presidency / admin only
      const canSeePicker=role.scope==='admin'||isStakePresidency(role)||(role.scope==='ward'&&role.org==='Bishopric');
      if(canSeePicker){
        const finalName=data.callingName?(
          data.selectedQuorum?data.selectedQuorum+' '+data.callingName:
          data.selectedYWClass?data.selectedYWClass+' '+data.callingName:
          (data.selectedClasses&&data.selectedClasses.length)?data.callingName+' — '+data.selectedClasses.slice().sort((a,b)=>[...PRIMARY_CLASSES,...SS_CLASSES].indexOf(a)-[...PRIMARY_CLASSES,...SS_CLASSES].indexOf(b)).join(', '):
          data.callingName
        ):'';
        const linkBtn=document.createElement('button');linkBtn.type='button';
        linkBtn.style.cssText='margin-top:10px;background:none;border:1px dashed #185fa5;color:#185fa5;font-size:12px;font-weight:600;padding:7px 14px;border-radius:7px;cursor:pointer;width:100%;';
        linkBtn.textContent='⛓ Link an existing in-progress release';
        const linkedNote=document.createElement('div');linkedNote.style.cssText='font-size:11px;color:#1a7a4c;margin-top:6px;font-weight:600;';
        if(data.linkedHolderReleaseId){
          const lr=(state.callings||[]).find(x=>x.id===data.linkedHolderReleaseId);
          if(lr) linkedNote.textContent=`✓ Linked: ${lr.name} from ${lr.calling}`;
        }
        linkBtn.addEventListener('click',()=>{
          const wardForPicker=data.ward||(isWard||isWardOrg?role.ward:'');
          openReleasePickerModal(wardForPicker,(chosen)=>{
            data.linkedHolderReleaseId=chosen.id;
            data.releaseName=chosen.name;
            rinp.value=chosen.name;
            linkedNote.textContent=`✓ Linked: ${chosen.name} from ${chosen.calling}`;
          });
        });
        rb.appendChild(linkBtn);rb.appendChild(linkedNote);
      }

      modal.appendChild(rb);

      // Show/hide release box when radio changes
      modal.querySelectorAll('.radio-opt').forEach(row=>{
        row.addEventListener('click',()=>{
          rb.classList.toggle('hidden',data.currentlyFilledAnswer!=='yes');
          if(data.currentlyFilledAnswer!=='yes') data.releaseName='';
        });
      });
    }

    // ── MEMBER INFO ─────────────────────────────────────────────────────────
    else if(stepId==='member'){
      const isReleaseOnly=data.intent==='release'&&data.releaseThenCall!=='yes';
      if(isReleaseOnly){
        title('Person Being Released');
        subtitle('Enter the details of the person being released from this calling.');
        textInp('Full Name<span class="req">*</span>','First and last name','memberName');
      } else {
        title('Member Being Called');
        subtitle('Enter the details of the person receiving this calling.');
        textInp('Full Name<span class="req">*</span>','First and last name','memberName');
      }
      textInp('Spouse Name (optional)','','spouseName');
      textInp("Spouse's Current Calling (optional)",'','spouseCalling');
    }

    // ── MEMBER RELEASE (does new member need releasing from prior calling(s)?) ──
    else if(stepId==='member-release'){
      title('Release from Prior Calling?');
      subtitle(`Does ${data.memberName||'this member'} need to be released from any current calling(s)?`);
      if(!data.memberReleaseEntries) data.memberReleaseEntries=[];
      radioGroup([
        {value:'yes',label:'Yes — Release from current calling(s)',
         sub:'Select the org and calling(s) below'},
        {value:'no', label:'No — Keep current calling(s)'},
      ],'memberNeedsRelease');

      // Structured picker — shown when 'yes'
      const pickerBox=document.createElement('div');
      pickerBox.style.cssText='margin-top:14px;'+(data.memberNeedsRelease==='yes'?'':'display:none;');
      if(!data.memberReleaseEntries.length) data.memberReleaseEntries.push({org:'',calling:''});
      const level=data.callingLevelFinal||(data.callingLevel==='Stake Issued'?'Stake Issued':data.callingLevel==='Stake'?'Stake':'Ward');
      buildReleasePicker(pickerBox, data.memberReleaseEntries, level, null);
      modal.appendChild(pickerBox);

      modal.querySelectorAll('.radio-opt').forEach(row=>{
        row.addEventListener('click',()=>{
          pickerBox.style.display=data.memberNeedsRelease==='yes'?'':'none';
        });
      });
    }

    // ── NOTES ───────────────────────────────────────────────────────────────
    else if(stepId==='notes'){
      title('Additional Notes');
      const notesInp=document.createElement('textarea');notesInp.placeholder='Any additional notes (optional)...';notesInp.value=data.notes;
      notesInp.style.minHeight='80px';
      notesInp.addEventListener('input',()=>{data.notes=notesInp.value;});
      fg('Notes',notesInp);
    }

    // ── Nav buttons ─────────────────────────────────────────────────────────
    const nav=document.createElement('div');nav.className='wizard-nav';
    if(idx>0){
      const back=document.createElement('button');back.className='wizard-back';back.textContent='← Back';
      back.addEventListener('click',()=>{idx--;steps=buildSteps();renderWizard();});
      nav.appendChild(back);
    } else {
      // Spacer so Next stays right-aligned on first step
      const spacer=document.createElement('div');nav.appendChild(spacer);
    }
    const isLast=idx===steps.length-1;
    const nextBtn=document.createElement('button');nextBtn.className='wizard-next';
    nextBtn.textContent=isLast?'Submit →':'Next →';
    nextBtn.addEventListener('click',()=>{
      // Validate
      if(stepId==='intent'&&!data.intent){alert('Please select what you are doing.');return;}
      if(stepId==='release-then-call'&&!data.releaseThenCall){alert('Please answer the question.');return;}
      if(stepId==='calling-level'&&!data.callingLevel){alert('Please select a calling level.');return;}
      if(stepId==='org-or-ward'&&data.callingLevel==='Stake'&&!data.org){alert('Please select an organization.');return;}
      if(stepId==='org'&&!data.org){alert('Please select an organization.');return;}
      if(stepId==='calling'&&!data.callingName){alert('Please select a calling.');return;}
      if(stepId==='quorum-picker'&&!data.selectedQuorum){alert('Please select a quorum.');return;}
      if(stepId==='yw-class-picker'&&!data.selectedYWClass){alert('Please select a class.');return;}
      if(stepId==='class-picker-primary'&&(!data.selectedClasses||!data.selectedClasses.length)){alert('Please select at least one class.');return;}
      if(stepId==='class-picker-ss'&&(!data.selectedClasses||!data.selectedClasses.length)){alert('Please select at least one course.');return;}
      if(stepId==='filled'&&!data.currentlyFilledAnswer){alert('Please indicate if this calling is currently filled.');return;}
      if(stepId==='filled'&&data.currentlyFilledAnswer==='yes'&&!data.releaseName.trim()){alert('Please enter the name of the current holder to be released.');return;}
      if(stepId==='member'&&!data.memberName.trim()){alert('Please enter the member\'s name.');return;}
      if(stepId==='member-release'&&!data.memberNeedsRelease){alert('Please indicate whether this member needs to be released from a current calling.');return;}
      if(stepId==='member-release'&&data.memberNeedsRelease==='yes'&&(!data.memberReleaseEntries||!data.memberReleaseEntries.filter(e=>e.calling).length)){alert('Please select at least one calling to release from, or choose No.');return;}

      if(stepId==='intent'){
        // Rebuild steps now that intent is known
        steps=buildSteps();
      }
      if(stepId==='release-then-call'){
        // Rebuild steps now that we know if release is also a calling
        steps=buildSteps();
      }

      if(isLast){submitCalling();}
      else{idx++;steps=buildSteps();renderWizard();}
    });
    nav.appendChild(nextBtn);
    modal.appendChild(nav);
    // Ensure modal is inside overlay (re-append in case of re-render)
    if(!overlay.contains(modal)) overlay.appendChild(modal);
  }

  async function submitCalling(){
    const {action,level,ward,org}=derived();
    const isReleaseOnly=action==='Release';
    // hasCurrentHolder = the new position is currently occupied by someone needing release
    const hasCurrentHolder=!isReleaseOnly&&data.currentlyFilledAnswer==='yes'&&!!data.releaseName.trim();
    // memberPriorRelease = the called person is released from their own prior calling
    const priorReleaseEntries=(!isReleaseOnly&&data.memberNeedsRelease==='yes'&&Array.isArray(data.memberReleaseEntries))
      ?data.memberReleaseEntries.filter(e=>e.calling):[];
    const memberPriorRelease=priorReleaseEntries.length>0;

    // Build the final calling name incorporating sub-picker selections
    let finalCallingName=data.callingName;
    if(data.selectedQuorum){
      finalCallingName=data.selectedQuorum+' '+data.callingName;
    } else if(data.selectedYWClass){
      finalCallingName=data.selectedYWClass+' '+data.callingName;
    } else if(data.selectedClasses&&data.selectedClasses.length){
      const allClasses=[...PRIMARY_CLASSES,...SS_CLASSES];
      const sorted=data.selectedClasses.slice().sort((a,b)=>allClasses.indexOf(a)-allClasses.indexOf(b));
      finalCallingName=data.callingName+' — '+sorted.join(', ');
    }

    closeModal();

    if(isReleaseOnly){
      // Standalone Release — but check for an existing matching release first
      const existing=findMatchingRelease(data.memberName, finalCallingName, ward);
      if(existing){
        alert(`A release for ${data.memberName} from ${finalCallingName} already exists and is in progress. No duplicate was created.`);
        return;
      }
      const rel=buildReleaseRow({
        name:data.memberName,
        calling:finalCallingName,
        org,ward,level,
        custom:data.isCustom,
      });
      rel.notes=data.notes;
      rel.spouseName=data.spouseName;
      rel.spouseCalling=data.spouseCalling;
      const tempId=Date.now();rel.id=tempId;
      state.callings.push(rel);render();
      const realId=await dbSaveCalling(rel);
      if(realId){const c=state.callings.find(x=>x.id===tempId);if(c)c.id=realId;}
      render();
      return;
    }

    // ── Calling path ──────────────────────────────────────────────────────────
    const newCalling={
      id:null,
      name:data.memberName,
      calling:finalCallingName,
      org,ward,level,action:'Calling',
      submittedDate:today(),
      currentStep:0,stepDates:[],stepMeta:{},
      notes:data.notes,custom:data.isCustom,
      memberCurrentCalling:priorReleaseEntries.map(e=>e.calling).join(', '),
      memberCallings:priorReleaseEntries.map(e=>e.calling),
      memberNeedsRelease:memberPriorRelease,
      spouseName:data.spouseName,
      spouseCalling:data.spouseCalling,
      releaseName:hasCurrentHolder?data.releaseName:'',
      currentlyFilled:hasCurrentHolder,
      linkedReleaseIds:[],
      releaseFor:null,
    };
    const tempId=Date.now();newCalling.id=tempId;
    state.callings.push(newCalling);render();
    const realId=await dbSaveCalling(newCalling);
    if(realId){newCalling.id=realId;const c=state.callings.find(x=>x.id===tempId);if(c)c.id=realId;}

    // Create or link shared releases for: (a) vacancy holder, (b) member's prior calling
    const linkedIds=[];

    // (a) Vacancy release — current holder of the NEW position
    if(hasCurrentHolder){
      const id=await createOrLinkRelease(data.releaseName, finalCallingName, org, ward, level, data.isCustom, newCalling.id, data.linkedHolderReleaseId);
      if(id) linkedIds.push(id);
    }
    // (b) Prior-calling release(s) — the called person from their existing calling(s)
    for(const entry of priorReleaseEntries){
      const id=await createOrLinkRelease(data.memberName, entry.calling, entry.org||'', ward, level, false, newCalling.id);
      if(id) linkedIds.push(id);
    }

    if(linkedIds.length){
      newCalling.linkedReleaseIds=linkedIds;
      await sb.from('callings').update({linked_release_ids:linkedIds}).eq('id',newCalling.id);
    }
    render();
  }

  // Create a new release row or link to an existing matching one. Returns release id.
  // Exact match → auto-link. Fuzzy match → ask (Bishopric/SP/admin only). Else create new.
  async function createOrLinkRelease(name, calling, org, ward, level, custom, releaseFor, preLinkedId){
    if(!name||!calling) return null;
    // If a release was already chosen via the browse picker, use it directly
    if(preLinkedId){
      const chosen=(state.callings||[]).find(x=>x.id===preLinkedId);
      if(chosen) return chosen.id;
    }
    // Exact match → silent auto-link
    const exact=findMatchingRelease(name, calling, ward);
    if(exact) return exact.id;
    // Fuzzy match → ask, but only for roles allowed to see the picker
    const canSeePicker=role.scope==='admin'||isStakePresidency(role)||(role.scope==='ward'&&role.org==='Bishopric');
    if(canSeePicker){
      const fuzzy=fuzzyMatchReleases(name, calling, ward);
      if(fuzzy.length){
        const f=fuzzy[0];
        const ok=confirm(`A similar release already exists:\n\n  ${f.name} from ${f.calling}\n\nYou entered "${name}". Link to the existing release instead of creating a new one?`);
        if(ok) return f.id;
      }
    }
    // No match (or declined) → create new
    const rel=buildReleaseRow({name,calling,org,ward,level,custom,releaseFor});
    const tempId=Date.now()+Math.floor(Math.random()*1000);rel.id=tempId;
    state.callings.push(rel);
    const realId=await dbSaveCalling(rel);
    if(realId){const c=state.callings.find(x=>x.id===tempId);if(c)c.id=realId;return realId;}
    return tempId;
  }

  renderWizard();
}

function openCallingEditModal(c,role){
  const root=document.getElementById('modal-root');root.innerHTML='';
  const overlay=document.createElement('div');overlay.className='modal-overlay';
  overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal();});
  const modal=document.createElement('div');modal.className='modal';
  applyMobileModal(overlay,modal);
  overlay.appendChild(modal);
  root.appendChild(overlay);

  modal.innerHTML='<div class="modal-handle"></div>';
  const title=document.createElement('div');title.className='modal-title';title.textContent='Edit Calling';modal.appendChild(title);

  function fg(lbl,el){
    const g=document.createElement('div');g.className='form-group';
    const l=document.createElement('label');l.className='form-label';l.innerHTML=lbl;
    g.appendChild(l);g.appendChild(el);modal.appendChild(g);return el;
  }
  function inp(lbl,val,key){
    const el=document.createElement('input');el.type='text';el.value=val||'';
    el.addEventListener('input',()=>{c[key]=el.value;});
    return fg(lbl,el);
  }
  function sel(lbl,options,val,key){
    const el=document.createElement('select');
    options.forEach(o=>{const opt=document.createElement('option');opt.value=o;opt.textContent=o;if(o===val)opt.selected=true;el.appendChild(opt);});
    el.addEventListener('change',()=>{c[key]=el.value;});
    return fg(lbl,el);
  }

  // Member Name
  inp('Member Name<span class="req">*</span>',c.name,'name');

  // Ward (needed to filter callings)
  const wardGroup=document.createElement('div');wardGroup.className='form-group';
  const wardLbl=document.createElement('label');wardLbl.className='form-label';wardLbl.innerHTML='Ward / Unit<span class="req">*</span>';
  const wardSel=document.createElement('select');
  ALL_WARDS.forEach(w=>{const o=document.createElement('option');o.value=w;o.textContent=w;if(w===c.ward)o.selected=true;wardSel.appendChild(o);});
  wardGroup.appendChild(wardLbl);wardGroup.appendChild(wardSel);modal.appendChild(wardGroup);

  // Level
  const levelGroup=document.createElement('div');levelGroup.className='form-group';
  const levelLbl=document.createElement('label');levelLbl.className='form-label';levelLbl.textContent='Level';
  const levelSel=document.createElement('select');
  ['Stake','Stake Issued','Ward'].forEach(lv=>{const o=document.createElement('option');o.value=lv;o.textContent=lv;if(lv===c.level)o.selected=true;levelSel.appendChild(o);});
  levelGroup.appendChild(levelLbl);levelGroup.appendChild(levelSel);modal.appendChild(levelGroup);

  // Organization — dropdown of all orgs for the current level
  const orgGroup=document.createElement('div');orgGroup.className='form-group';
  const orgLbl=document.createElement('label');orgLbl.className='form-label';orgLbl.textContent='Organization';
  const orgSel=document.createElement('select');
  orgGroup.appendChild(orgLbl);orgGroup.appendChild(orgSel);modal.appendChild(orgGroup);
  function orgsForLevel(level){
    let d=CALLING_DIR;
    if(level==='Stake') d=d.filter(x=>x.level==='Stake');
    else if(level==='Stake Issued') d=d.filter(x=>x.level==='Stake Issued');
    else d=d.filter(x=>x.level==='Ward');
    const seen=[];d.forEach(x=>{if(!seen.includes(x.org))seen.push(x.org);});
    return seen;
  }
  function rebuildOrgDropdown(){
    orgSel.innerHTML='';
    orgsForLevel(c.level).forEach(o=>{
      const opt=document.createElement('option');opt.value=o;opt.textContent=o.replace(/^Ward /,'');
      if(o===c.org)opt.selected=true;orgSel.appendChild(opt);
    });
    // If current org isn't in the list (e.g. custom), add it
    if(c.org&&!orgsForLevel(c.level).includes(c.org)){
      const opt=document.createElement('option');opt.value=c.org;opt.textContent=c.org.replace(/^Ward /,'');opt.selected=true;orgSel.appendChild(opt);
    }
  }
  orgSel.addEventListener('change',()=>{
    c.org=orgSel.value;
    baseCallingName=''; // reset since org changed
    rebuildCallingDropdown();
  });

  // Calling dropdown — filtered by level
  const callingGroup=document.createElement('div');callingGroup.className='form-group';
  const callingLbl=document.createElement('label');callingLbl.className='form-label';callingLbl.textContent='Calling';
  const callingSel=document.createElement('select');
  callingGroup.appendChild(callingLbl);callingGroup.appendChild(callingSel);modal.appendChild(callingGroup);

  // Custom calling input
  const customBox=document.createElement('div');customBox.className='custom-box hidden';
  const customLbl=document.createElement('label');customLbl.className='form-label';customLbl.textContent='Custom calling name';
  const customInp=document.createElement('input');customInp.type='text';customInp.placeholder='Enter calling title...';customInp.value=c.isCustom?c.calling:'';
  customInp.addEventListener('input',()=>{c.calling=customInp.value;});
  customBox.appendChild(customLbl);customBox.appendChild(customInp);modal.appendChild(customBox);

  // ── Sub-picker panels (shown when calling has quorumPicker / classPicker) ──
  // Parse existing calling name to extract base name + sub-selection
  function parseCallingName(fullName){
    // AP quorum: "Priests Quorum Adviser" → base="Quorum Adviser", quorum="Priests"
    for(const q of AP_QUORUMS){
      if(fullName.startsWith(q+' ')){
        const base=fullName.slice(q.length+1);
        if(CALLING_DIR.find(d=>d.name===base&&d.quorumPicker)) return{base,quorum:q,ywClass:null,classes:[]};
      }
    }
    // YW class: "Gatherers of Light Class President" → base="Class President", ywClass="Gatherers of Light"
    for(const cls of YW_CLASSES){
      if(fullName.startsWith(cls+' ')){
        const base=fullName.slice(cls.length+1);
        if(CALLING_DIR.find(d=>d.name===base&&d.classPicker)) return{base,quorum:null,ywClass:cls,classes:[]};
      }
    }
    // Primary/SS class: "Primary Teacher — CTR 7, Valiant 8" → base="Primary Teacher", classes=[...]
    const dashIdx=fullName.indexOf(' — ');
    if(dashIdx>=0){
      const base=fullName.slice(0,dashIdx);
      const classStr=fullName.slice(dashIdx+3);
      const classes=classStr.split(', ').map(s=>s.trim()).filter(Boolean);
      if(CALLING_DIR.find(d=>d.name===base&&d.classPicker)) return{base,quorum:null,ywClass:null,classes};
    }
    return{base:fullName,quorum:null,ywClass:null,classes:[]};
  }

  const parsed=parseCallingName(c.calling||'');
  // Mutable sub-picker state for edit modal
  const sub={
    quorum: parsed.quorum,
    ywClass: parsed.ywClass,
    classes: [...parsed.classes],
  };
  // The base calling name (without sub-selection) shown in dropdown
  let baseCallingName=parsed.base;

  // Sub-picker container — rendered dynamically below the calling dropdown
  const subPickerContainer=document.createElement('div');
  modal.appendChild(subPickerContainer);

  function buildFinalCallingName(){
    if(sub.quorum) return sub.quorum+' '+baseCallingName;
    if(sub.ywClass) return sub.ywClass+' '+baseCallingName;
    if(sub.classes&&sub.classes.length){
      const allClasses=[...PRIMARY_CLASSES,...SS_CLASSES];
      const sorted=sub.classes.slice().sort((a,b)=>allClasses.indexOf(a)-allClasses.indexOf(b));
      return baseCallingName+' — '+sorted.join(', ');
    }
    return baseCallingName;
  }

  function renderSubPicker(dirEntry){
    subPickerContainer.innerHTML='';
    if(!dirEntry) return;

    if(dirEntry.quorumPicker){
      const lbl=document.createElement('div');lbl.className='form-label';lbl.style.marginBottom='6px';lbl.textContent='Quorum';
      subPickerContainer.appendChild(lbl);
      const wrap=document.createElement('div');wrap.style.cssText='display:flex;flex-direction:column;gap:6px;margin-bottom:13px;';
      AP_QUORUMS.forEach(q=>{
        const row=document.createElement('label');row.style.cssText='display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid rgba(0,0,0,0.12);border-radius:8px;cursor:pointer;';
        const rb=document.createElement('input');rb.type='radio';rb.name='edit-quorum';rb.value=q;rb.style.cssText='accent-color:#1c2537;flex-shrink:0;';
        rb.checked=sub.quorum===q;
        const lbl2=document.createElement('span');lbl2.style.cssText='font-size:13px;font-weight:500;color:#1c2537;';lbl2.textContent=q+' Quorum';
        if(rb.checked){row.style.borderColor='#1c2537';row.style.background='#f0f4ff';}
        rb.addEventListener('change',()=>{
          sub.quorum=q;
          wrap.querySelectorAll('label').forEach(r=>{ r.style.borderColor='rgba(0,0,0,0.12)'; r.style.background=''; });
          row.style.borderColor='#1c2537';row.style.background='#f0f4ff';
          c.calling=buildFinalCallingName();
        });
        row.appendChild(rb);row.appendChild(lbl2);wrap.appendChild(row);
      });
      subPickerContainer.appendChild(wrap);
    }

    else if(dirEntry.classPicker&&dirEntry.classPickerType===undefined&&dirEntry.org==='Young Women'){
      const lbl=document.createElement('div');lbl.className='form-label';lbl.style.marginBottom='6px';lbl.textContent='Class';
      subPickerContainer.appendChild(lbl);
      const wrap=document.createElement('div');wrap.style.cssText='display:flex;flex-direction:column;gap:6px;margin-bottom:13px;';
      YW_CLASSES.forEach(cls=>{
        const row=document.createElement('label');row.style.cssText='display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid rgba(0,0,0,0.12);border-radius:8px;cursor:pointer;';
        const rb=document.createElement('input');rb.type='radio';rb.name='edit-ywclass';rb.value=cls;rb.style.cssText='accent-color:#1c2537;flex-shrink:0;';
        rb.checked=sub.ywClass===cls;
        const lbl2=document.createElement('span');lbl2.style.cssText='font-size:13px;font-weight:500;color:#1c2537;';lbl2.textContent=cls;
        if(rb.checked){row.style.borderColor='#1c2537';row.style.background='#f0f4ff';}
        rb.addEventListener('change',()=>{
          sub.ywClass=cls;
          wrap.querySelectorAll('label').forEach(r=>{ r.style.borderColor='rgba(0,0,0,0.12)'; r.style.background=''; });
          row.style.borderColor='#1c2537';row.style.background='#f0f4ff';
          c.calling=buildFinalCallingName();
        });
        row.appendChild(rb);row.appendChild(lbl2);wrap.appendChild(row);
      });
      subPickerContainer.appendChild(wrap);
    }

    else if(dirEntry.classPicker&&(dirEntry.classPickerType==='primary'||dirEntry.classPickerType==='ss')){
      const classList=dirEntry.classPickerType==='primary'?PRIMARY_CLASSES:SS_CLASSES;
      const lbl=document.createElement('div');lbl.className='form-label';lbl.style.marginBottom='6px';
      lbl.textContent=dirEntry.classPickerType==='primary'?'Class(es)':'Course(s)';
      subPickerContainer.appendChild(lbl);
      const wrap=document.createElement('div');wrap.style.cssText='display:flex;flex-direction:column;gap:6px;margin-bottom:13px;';
      classList.forEach(cls=>{
        const row=document.createElement('label');row.style.cssText='display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid rgba(0,0,0,0.12);border-radius:8px;cursor:pointer;';
        const cb=document.createElement('input');cb.type='checkbox';cb.value=cls;cb.style.cssText='width:15px;height:15px;accent-color:#1c2537;flex-shrink:0;';
        cb.checked=sub.classes.includes(cls);
        const lbl2=document.createElement('span');lbl2.style.cssText='font-size:13px;font-weight:500;color:#1c2537;';lbl2.textContent=cls;
        if(cb.checked){row.style.borderColor='#1c2537';row.style.background='#f0f4ff';}
        cb.addEventListener('change',()=>{
          if(cb.checked){if(!sub.classes.includes(cls))sub.classes.push(cls);}
          else sub.classes=sub.classes.filter(x=>x!==cls);
          row.style.borderColor=cb.checked?'#1c2537':'rgba(0,0,0,0.12)';
          row.style.background=cb.checked?'#f0f4ff':'';
          c.calling=buildFinalCallingName();
        });
        row.appendChild(cb);row.appendChild(lbl2);wrap.appendChild(row);
      });
      subPickerContainer.appendChild(wrap);
    }
  }

  function rebuildCallingDropdown(){
    const level=levelSel.value;
    let dir=CALLING_DIR;
    if(level==='Stake') dir=dir.filter(d=>d.level==='Stake');
    else if(level==='Stake Issued') dir=dir.filter(d=>d.level==='Stake Issued');
    else dir=dir.filter(d=>d.level==='Ward');
    // Filter to the selected organization
    if(c.org) dir=dir.filter(d=>d.org===c.org);

    callingSel.innerHTML='';
    const groups={};
    dir.forEach(d=>{if(!groups[d.org])groups[d.org]={items:[]};groups[d.org].items.push(d);});
    Object.entries(groups).forEach(([orgName,group])=>{
      const og=document.createElement('optgroup');og.label=orgName;
      group.items.forEach(d=>{
        const o=document.createElement('option');
        o.value=`${d.name}||${d.org}`;
        o.textContent=d.name+(d.custom?'  (Custom)':'');
        if(d.name===baseCallingName&&!c.isCustom) o.selected=true;
        og.appendChild(o);
      });
      const co=document.createElement('option');co.value=`__custom__||${orgName}`;co.textContent=`✦ Custom (${orgName})...`;
      if(c.isCustom) co.selected=true;
      og.appendChild(co);
      callingSel.appendChild(og);
    });

    // Sync sub-picker for the currently-selected calling (do NOT overwrite org)
    const raw=callingSel.value;
    if(raw){
      const parts=raw.split('||');
      const isCustom=parts[0]==='__custom__';
      if(!isCustom){
        const dirEntry=CALLING_DIR.find(d=>d.name===parts[0]&&d.org===parts[1]);
        renderSubPicker(dirEntry||null);
      }
      customBox.classList.toggle('hidden',!isCustom);
    }
  }

  callingSel.addEventListener('change',()=>{
    const raw=callingSel.value;
    if(!raw)return;
    const parts=raw.split('||');
    const isCustom=parts[0]==='__custom__';
    c.isCustom=isCustom;
    if(!isCustom){
      baseCallingName=parts[0];
      sub.quorum=null;sub.ywClass=null;sub.classes=[];
      const dirEntry=CALLING_DIR.find(d=>d.name===parts[0]&&d.org===parts[1]);
      c.org=parts[1]; // keep org in sync (same as selected org)
      c.calling=buildFinalCallingName();
      renderSubPicker(dirEntry||null);
    }
    customBox.classList.toggle('hidden',!isCustom);
  });

  levelSel.addEventListener('change',()=>{c.level=levelSel.value;rebuildOrgDropdown();baseCallingName='';rebuildCallingDropdown();});
  wardSel.addEventListener('change',()=>{c.ward=wardSel.value;});

  rebuildOrgDropdown();
  rebuildCallingDropdown();

  // Action — two options matching the wizard
  const actionGroup=document.createElement('div');actionGroup.className='form-group';
  const actionLbl=document.createElement('label');actionLbl.className='form-label';actionLbl.textContent='Action';
  const actionSel=document.createElement('select');
  // Normalize legacy actions to the two-option model for display
  const normalizedAction=(c.action==='Release Only'||c.action==='Release')?'Release':'Calling';
  [['Calling','Calling'],['Release','Release']].forEach(([val,lbl])=>{
    const opt=document.createElement('option');opt.value=val;opt.textContent=lbl;
    if(val===normalizedAction)opt.selected=true;
    actionSel.appendChild(opt);
  });
  actionSel.addEventListener('change',()=>{
    c.action=actionSel.value;
    const isRelease=actionSel.value==='Release';
    div2.style.display=isRelease?'none':'';
    secLbl2.style.display=isRelease?'none':'';
    filledRow.style.display=isRelease?'none':'';
    holderNameField.style.display=isRelease?'none':(c.currentlyFilled?'block':'none');
    relSecDiv.style.display=isRelease?'none':'';
    relSecLbl.style.display=isRelease?'none':'';
    relPickerWrap.style.display=isRelease?'none':'';
  });
  actionGroup.appendChild(actionLbl);actionGroup.appendChild(actionSel);modal.appendChild(actionGroup);

  // Submitted date
  const dateInp=document.createElement('input');dateInp.type='date';dateInp.value=c.submittedDate||'';
  dateInp.addEventListener('change',()=>{c.submittedDate=dateInp.value;});
  fg('Submitted Date',dateInp);

  const div1=document.createElement('div');div1.className='section-divider';modal.appendChild(div1);
  const secLbl=document.createElement('div');secLbl.style.cssText='font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#707070;margin-bottom:12px;';secLbl.textContent='Member Info';modal.appendChild(secLbl);

  inp('Spouse Name',c.spouseName,'spouseName');
  inp("Spouse's Calling",c.spouseCalling,'spouseCalling');

  // Current holder section — hidden for Release Only (member IS the current holder)
  const isReleaseOnly=c.action==='Release Only'||c.action==='Release';
  const div2=document.createElement('div');div2.className='section-divider';div2.style.display=isReleaseOnly?'none':'';modal.appendChild(div2);
  const secLbl2=document.createElement('div');secLbl2.style.cssText='font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#707070;margin-bottom:12px;';secLbl2.textContent='Current Holder (optional)';secLbl2.style.display=isReleaseOnly?'none':'';modal.appendChild(secLbl2);

  // Toggle
  const filledRow=document.createElement('div');filledRow.style.cssText='display:flex;align-items:center;gap:10px;margin-bottom:10px;';filledRow.style.display=isReleaseOnly?'none':'';
  const filledLbl=document.createElement('label');filledLbl.style.cssText='font-size:13px;color:#555;display:flex;align-items:center;gap:6px;cursor:pointer;';
  const filledChk=document.createElement('input');filledChk.type='checkbox';filledChk.checked=!!c.currentlyFilled;
  filledChk.style.cssText='width:16px;height:16px;accent-color:#1c2537;cursor:pointer;';
  filledLbl.appendChild(filledChk);filledLbl.appendChild(document.createTextNode('This calling is currently filled'));
  filledRow.appendChild(filledLbl);modal.appendChild(filledRow);
  filledChk.addEventListener('change',()=>{c.currentlyFilled=filledChk.checked;if(!filledChk.checked)c.releaseName='';holderNameField.style.display=filledChk.checked?'block':'none';});

  const holderNameField=document.createElement('div');holderNameField.style.display=(isReleaseOnly||!c.currentlyFilled)?'none':'block';
  const holderInp=document.createElement('input');holderInp.type='text';holderInp.value=c.releaseName||'';holderInp.placeholder='Full name of current holder';
  holderInp.addEventListener('input',()=>{c.releaseName=holderInp.value;});
  holderNameField.appendChild(holderInp);modal.appendChild(holderNameField);

  // Member's own callings to be released from — structured org→calling picker
  const isReleaseAction=normalizedAction==='Release';
  const relSecDiv=document.createElement('div');relSecDiv.className='section-divider';relSecDiv.style.display=isReleaseAction?'none':'';modal.appendChild(relSecDiv);
  const relSecLbl=document.createElement('div');relSecLbl.style.cssText='font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#707070;margin-bottom:12px;';relSecLbl.textContent='Callings to Release Member From';relSecLbl.style.display=isReleaseAction?'none':'';modal.appendChild(relSecLbl);

  // Convert legacy memberCallings (string[]) or memberCurrentCalling into {org,calling}[]
  if(!Array.isArray(c._releaseEntries)){
    const entries=[];
    const legacyList=(Array.isArray(c.memberCallings)&&c.memberCallings.filter(Boolean).length)
      ?c.memberCallings.filter(Boolean)
      :(c.memberCurrentCalling?[c.memberCurrentCalling]:[]);
    legacyList.forEach(nm=>{
      // Try to find the org from CALLING_DIR
      const found=CALLING_DIR.find(d=>normRel(d.name)===normRel(nm));
      entries.push({org:found?found.org:'',calling:nm});
    });
    if(!entries.length) entries.push({org:'',calling:''});
    c._releaseEntries=entries;
  }
  const relPickerWrap=document.createElement('div');relPickerWrap.style.display=isReleaseAction?'none':'';
  buildReleasePicker(relPickerWrap, c._releaseEntries, c.level, ()=>{
    // Keep legacy fields in sync for display/back-compat
    const filled=c._releaseEntries.filter(e=>e.calling);
    c.memberCallings=filled.map(e=>e.calling);
    c.memberCurrentCalling=filled.map(e=>e.calling).join(', ');
    c.memberNeedsRelease=filled.length>0;
  });
  modal.appendChild(relPickerWrap);

  // Notes
  const div3=document.createElement('div');div3.className='section-divider';modal.appendChild(div3);
  const notesEl=document.createElement('textarea');notesEl.value=c.notes||'';notesEl.placeholder='Optional notes';
  notesEl.addEventListener('input',()=>{c.notes=notesEl.value;});
  fg('Notes',notesEl);

  // Save button
  const saveBtn=document.createElement('button');
  saveBtn.className='btn-primary';
  saveBtn.style.cssText='width:100%;padding:12px;font-size:14px;border-radius:10px;margin-top:4px;';
  saveBtn.textContent='Save Changes';
  saveBtn.addEventListener('click',async()=>{
    saveBtn.disabled=true;saveBtn.textContent='Saving…';

    // ── Reconcile removed releases ──────────────────────────────────────────
    // Build the set of (name|calling) pairs that SHOULD be linked after this edit.
    const shouldLink=new Set();
    if(normalizedAction==='Calling'){
      if(c.currentlyFilled&&c.releaseName&&c.releaseName.trim()){
        shouldLink.add(normRel(c.releaseName)+'|'+normRel(c.calling));
      }
      (c._releaseEntries||[]).filter(e=>e.calling).forEach(e=>{
        shouldLink.add(normRel(c.name)+'|'+normRel(e.calling));
      });
    }
    // For any currently-linked release whose pair is NOT in shouldLink, unlink it.
    for(const relId of [...(c.linkedReleaseIds||[])]){
      const rel=(state.callings||[]).find(x=>x.id===relId);
      if(!rel) continue;
      const pair=normRel(rel.name)+'|'+normRel(rel.calling);
      if(!shouldLink.has(pair)){
        await unlinkReleaseFromCalling(c, relId);
      }
    }

    // If a current holder is set but no linked release exists yet, create-or-link one
    if(c.currentlyFilled&&c.releaseName&&c.releaseName.trim()&&c.action!=='Release'){
      const already=(c.linkedReleaseIds||[]).some(id=>{
        const r=(state.callings||[]).find(x=>x.id===id);
        return r&&normRel(r.name)===normRel(c.releaseName)&&normRel(r.calling)===normRel(c.calling);
      });
      if(!already){
        const exact=findMatchingRelease(c.releaseName, c.calling, c.ward);
        let relId=exact?exact.id:null;
        if(!relId){
          // Fuzzy ask for privileged roles
          const canSeePicker=role.scope==='admin'||isStakePresidency(role)||(role.scope==='ward'&&role.org==='Bishopric');
          if(canSeePicker){
            const fuzzy=fuzzyMatchReleases(c.releaseName, c.calling, c.ward);
            if(fuzzy.length){
              const f=fuzzy[0];
              if(confirm(`A similar release already exists:\n\n  ${f.name} from ${f.calling}\n\nLink to it instead of creating a new one?`)) relId=f.id;
            }
          }
        }
        if(!relId){
          const rel=buildReleaseRow({name:c.releaseName,calling:c.calling,org:c.org,ward:c.ward,level:c.level,custom:c.custom,releaseFor:c.id});
          const tempId=Date.now();rel.id=tempId;state.callings.push(rel);
          const realId=await dbSaveCalling(rel);
          if(realId){const x=state.callings.find(y=>y.id===tempId);if(x)x.id=realId;relId=realId;}else relId=tempId;
        }
        c.linkedReleaseIds=[...(c.linkedReleaseIds||[]), relId];
      }
    }

    // Prior-calling releases from the structured picker (Calling action only)
    if(normalizedAction==='Calling'&&Array.isArray(c._releaseEntries)){
      for(const entry of c._releaseEntries){
        if(!entry.calling) continue;
        // Skip if already linked for this person+calling
        const already=(c.linkedReleaseIds||[]).some(id=>{
          const r=(state.callings||[]).find(x=>x.id===id);
          return r&&normRel(r.name)===normRel(c.name)&&normRel(r.calling)===normRel(entry.calling);
        });
        if(already) continue;
        const exact=findMatchingRelease(c.name, entry.calling, c.ward);
        let relId=exact?exact.id:null;
        if(!relId){
          const canSeePicker=role.scope==='admin'||isStakePresidency(role)||(role.scope==='ward'&&role.org==='Bishopric');
          if(canSeePicker){
            const fuzzy=fuzzyMatchReleases(c.name, entry.calling, c.ward);
            if(fuzzy.length){
              const f=fuzzy[0];
              if(confirm(`A similar release already exists:\n\n  ${f.name} from ${f.calling}\n\nLink to it instead of creating a new one?`)) relId=f.id;
            }
          }
        }
        if(!relId){
          const rel=buildReleaseRow({name:c.name,calling:entry.calling,org:entry.org,ward:c.ward,level:c.level,custom:false,releaseFor:c.id});
          const tempId=Date.now()+Math.floor(Math.random()*1000);rel.id=tempId;state.callings.push(rel);
          const realId=await dbSaveCalling(rel);
          if(realId){const x=state.callings.find(y=>y.id===tempId);if(x)x.id=realId;relId=realId;}else relId=tempId;
        }
        c.linkedReleaseIds=[...(c.linkedReleaseIds||[]), relId];
      }
    }

    closeModal();render();await dbSaveCalling(c);render();
  });
  modal.appendChild(saveBtn);
}

function openRoleSwitcher(){
  if(!isSuperAdmin()) return;
  const root=document.getElementById('modal-root');root.innerHTML='';
  const overlay=document.createElement('div');overlay.className='modal-overlay';
  overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal();});
  const modal=document.createElement('div');modal.className='modal';modal.innerHTML='<div class="modal-handle"></div>';
  const title=document.createElement('div');title.className='modal-title';title.textContent='Dev Mode — Switch Role';modal.appendChild(title);
  const sub=document.createElement('div');sub.style.cssText='font-size:13px;color:#636363;margin-bottom:12px;';sub.textContent='Preview as a different role (superadmin only)';modal.appendChild(sub);

  // Search input
  const searchInp=document.createElement('input');searchInp.type='text';searchInp.placeholder='Search roles…';
  searchInp.style.cssText='width:100%;padding:9px 12px;border:1px solid rgba(0,0,0,0.15);border-radius:8px;font-size:14px;box-sizing:border-box;margin-bottom:14px;';
  modal.appendChild(searchInp);

  const currentId=getEffectiveRoleId();
  const listWrap=document.createElement('div');
  modal.appendChild(listWrap);

  // Group roles by scope
  const groups=[
    {label:'System',roles:ROLES.filter(r=>r.scope==='admin')},
    {label:'Stake',roles:ROLES.filter(r=>r.scope==='stake')},
    {label:'Bishopric / Ward',roles:ROLES.filter(r=>r.scope==='ward')},
    {label:'Ward Organizations',roles:ROLES.filter(r=>r.scope==='ward_org')},
  ];

  function renderList(filter){
    listWrap.innerHTML='';
    const q=(filter||'').toLowerCase();
    groups.forEach(group=>{
      const filtered=q?group.roles.filter(r=>r.label.toLowerCase().includes(q)):group.roles;
      if(!filtered.length) return;
      const grpLabel=document.createElement('div');
      grpLabel.style.cssText='font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#707070;margin:12px 0 6px;';
      grpLabel.textContent=group.label;listWrap.appendChild(grpLabel);
      filtered.forEach(r=>{
        const card=document.createElement('div');card.className='role-card'+(currentId===r.id?' selected':'');
        card.innerHTML=`<span class="role-dot" style="background:${r.color}"></span><div style="flex:1"><div style="font-size:13px;font-weight:600;color:#1c2537">${r.label}</div></div>${currentId===r.id?'<span style="color:#1c2537;font-size:16px">&#10003;</span>':''}`;
        card.addEventListener('click',()=>{
          devModeRole=r.id==='admin'?null:r.id;localStorage.setItem('leadertools_devRole',devModeRole||'');
          if(r.id==='admin'){devModeWard=null;localStorage.setItem('leadertools_devWard','');}
          state.tab='callings';state.view='list';state.filterLevel='All';
          closeModal();
          if(devModeRole&&(r.scope==='ward'||r.scope==='ward_org')){
            openDevWardPicker();
          } else {
            render();
          }
        });
        listWrap.appendChild(card);
      });
    });
  }

  renderList('');
  searchInp.addEventListener('input',()=>renderList(searchInp.value));
  applyMobileModal(overlay,modal);overlay.appendChild(modal);root.appendChild(overlay);
  setTimeout(()=>searchInp.focus(),100);
}

function getAgendaWard(role){
  // Sacrament meetings are ward-level only
  if(role.scope==='ward'||role.scope==='ward_org') return role.ward||'';
  if(role.scope==='admin') return 'Pecan Ranch Ward'; // admin defaults to first ward for testing
  return null; // stake scope = no sacrament meeting access
}

function canCreateSacramentAgenda(role){
  // Only bishopric members (ward scope with Bishopric org) or admin
  if(role.scope==='admin') return true;
  if(role.scope==='ward'&&role.org==='Bishopric') return true;
  return false;
}

function makeDateInput(value,onChange,extraStyle){
  // Wrapper makes the entire field clickable for the date picker
  const wrap=document.createElement('div');wrap.className='date-wrap';
  const inp=document.createElement('input');inp.type='date';
  inp.value=value||'';
  if(extraStyle)inp.style.cssText=extraStyle;
  inp.addEventListener('change',()=>onChange(inp.value));
  // Clicking anywhere on the input opens the picker
  inp.addEventListener('click',()=>{try{inp.showPicker();}catch(e){}});
  wrap.appendChild(inp);
  return{wrap,inp};
}

function fmtDate(d){
  if(!d)return'';
  const [y,m,day]=d.split('-');
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  return `${months[parseInt(m)-1]} ${parseInt(day)}, ${y}`;
}

// Compact numeric date for narrow table columns, e.g. "07/05/26"
function fmtDateShort(d){
  if(!d)return'';
  const [y,m,day]=d.split('-');
  return `${m.padStart(2,'0')}/${day.padStart(2,'0')}/${y.slice(-2)}`;
}

function salutation(name){
  if(!name||!name.trim())return name;
  const parts=name.trim().split(' ');
  const last=parts[parts.length-1];
  return `Brother/Sister ${last}`;
}

function getCustomMeetingTypes(ward){
  try{
    const raw=localStorage.getItem('leadertools_custom_mtypes_'+(ward||''));
    return raw?JSON.parse(raw):[];
  }catch(e){return[];}
}
function saveCustomMeetingTypes(ward,types){
  try{localStorage.setItem('leadertools_custom_mtypes_'+(ward||''),JSON.stringify(types));}catch(e){}
}
function addCustomMeetingType(ward,label){
  const types=getCustomMeetingTypes(ward);
  const key='custom-'+label.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  if(types.find(t=>t.key===key)) return key; // already exists
  types.push({key,label,custom:true});
  saveCustomMeetingTypes(ward,types);
  return key;
}

// Get all Sundays in a given year
function getSundaysOfYear(year){
  const sundays=[];
  const d=new Date(year,0,1);
  while(d.getDay()!==0) d.setDate(d.getDate()+1);
  while(d.getFullYear()===year){
    sundays.push(d.toISOString().slice(0,10));
    d.setDate(d.getDate()+7);
  }
  return sundays;
}

// Extract last name from full_name
function lastName(fullName){
  if(!fullName) return '';
  const parts=fullName.trim().split(/\s+/);
  return parts[parts.length-1];
}

// Get bishopric member display name for a role_id
function bishopricName(roleId, profiles, titlePrefix){
  const p=(profiles||[]).find(x=>x.role_id===roleId);
  if(!p) return titlePrefix;
  return titlePrefix+' '+lastName(p.full_name);
}

// Get the assigned conductor for a given date based on settings
function getAssignedConductor(dateStr, settings, profiles){
  if(!settings||!settings.rotation||!settings.rotation.length) return null;
  const d=new Date(dateStr+'T12:00:00');
  const month=d.getMonth()+1; // 1-12
  const year=d.getFullYear();

  // Calculate how many months since start
  const startMonth=settings.startMonth||1;
  const startYear=settings.startYear||year;
  const monthsElapsed=(year-startYear)*12+(month-startMonth);
  if(monthsElapsed<0) return null;

  const rotation=settings.rotation.filter(r=>r.conducts);
  if(!rotation.length) return null;
  const rotIdx=((monthsElapsed%rotation.length)+rotation.length)%rotation.length;
  const assigned=rotation[rotIdx];

  // Map role to display name
  const roleMap={bishop:{id:'bishop',title:'Bishop'},c1:{id:'ward_1c',title:'1st Counselor'},c2:{id:'ward_2c',title:'2nd Counselor'}};
  const rm=roleMap[assigned.role];
  if(!rm) return null;

  // Determine who finds speakers this month.
  // If the conductor finds their own speakers, it's them. Otherwise rotate the
  // responsibility among the members flagged "Finds Speakers".
  let speakerFinder=null;
  if(assigned.findsSpeakers){
    speakerFinder={role:assigned.role, roleId:rm.id, title:rm.title};
  } else {
    const finders=(settings.rotation||[]).filter(r=>r.findsSpeakers);
    if(settings.speakerFinderStart){
      const si=finders.findIndex(f=>f.role===settings.speakerFinderStart);
      if(si>0) finders.push(...finders.splice(0,si));
    }
    if(finders.length){
      const needsPerCycle=rotation.filter(r=>!r.findsSpeakers).length||1;
      const fullCycles=Math.floor(monthsElapsed/rotation.length);
      let withinBefore=0;
      for(let i=0;i<rotIdx;i++){ if(!rotation[i].findsSpeakers) withinBefore++; }
      const k=fullCycles*needsPerCycle+withinBefore;
      const finder=finders[((k%finders.length)+finders.length)%finders.length];
      const fm=roleMap[finder.role];
      if(fm) speakerFinder={role:finder.role, roleId:fm.id, title:fm.title};
    }
  }

  return {
    role: assigned.role,
    roleId: rm.id,
    name: bishopricName(rm.id, profiles, rm.title.replace('1st Counselor','Bro.').replace('2nd Counselor','Bro.').replace('Bishop','Bishop')),
    title: rm.title,
    findsSpeakers: assigned.findsSpeakers,
    speakerFinder,
  };
}

// Check if a date is a 5th Sunday
function isFifthSunday(dateStr){
  const d=new Date(dateStr+'T12:00:00');
  return Math.ceil(d.getDate()/7)===5;
}
