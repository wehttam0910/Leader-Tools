<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,sans-serif;background:#f0f2f5;color:#1a1a1a;font-size:15px;min-height:100vh;}
.shell{display:flex;min-height:100vh;}

/* ── Sidebar ── */
.sidebar{
  width:220px;flex-shrink:0;background:#1c2537;
  display:flex;flex-direction:column;
  height:100vh;position:sticky;top:0;z-index:150;
  transition:width 0.22s cubic-bezier(.4,0,.2,1);
  overflow:hidden;
}
.sidebar.collapsed{width:56px;}
/* Hide text labels when collapsed */
.sidebar.collapsed .sidebar-church,
.sidebar.collapsed .sidebar-label,
.sidebar.collapsed .nav-label,
.sidebar.collapsed .role-name,
.sidebar.collapsed .role-hint,
.sidebar.collapsed .sidebar-stake-text{display:none;}
.sidebar.collapsed .sidebar-header{padding:14px 0;justify-content:center;}
.sidebar.collapsed .nav-item{justify-content:center;padding:12px 0;gap:0;}
.sidebar.collapsed .sidebar-section{padding:8px 4px 4px;}
.sidebar.collapsed .role-btn{justify-content:center;padding:10px 0;gap:0;}
.sidebar.collapsed .sidebar-footer{padding:8px 4px;}

.sidebar-header{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,0.12);display:flex;align-items:center;gap:10px;}
.sidebar-stake-text{font-size:13px;font-weight:700;color:#fff;line-height:1.3;flex:1;min-width:0;}
.sidebar-church{font-size:10px;color:rgba(255,255,255,0.6);margin-top:2px;line-height:1.4;}
.sidebar-toggle{width:24px;height:24px;border:none;background:rgba(255,255,255,0.1);border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-size:12px;font-weight:700;transition:background 0.15s;}
.sidebar-toggle:hover{background:rgba(255,255,255,0.2);}

.sidebar-section{padding:14px 8px 4px;}
.sidebar-label{font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.45);padding:0 8px;margin-bottom:6px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;cursor:pointer;color:#fff;font-size:13px;font-weight:500;background:transparent;border:none;width:100%;text-align:left;opacity:0.78;transition:background 0.15s,opacity 0.15s;}
.nav-item:hover{background:rgba(255,255,255,0.1);opacity:1;}
.nav-item.active{background:rgba(255,255,255,0.15);opacity:1;}
.nav-item svg{width:16px;height:16px;flex-shrink:0;stroke:#fff;}
.nav-label{white-space:nowrap;}

.sidebar-footer{margin-top:auto;padding:12px 8px;border-top:1px solid rgba(255,255,255,0.12);}
.role-btn{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;cursor:pointer;background:transparent;border:none;width:100%;text-align:left;transition:background 0.15s;}
.role-btn:hover{background:rgba(255,255,255,0.1);}
.role-avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;}
.role-name{font-size:12px;font-weight:600;color:#fff;line-height:1.3;white-space:nowrap;}
.role-hint{font-size:10px;color:rgba(255,255,255,0.5);margin-top:1px;white-space:nowrap;}

.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:140;}
.sidebar-overlay.open{display:block;}

/* ── Main ── */
.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{background:#fff;border-bottom:1px solid rgba(0,0,0,0.08);padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.hamburger{display:none;width:36px;height:36px;border:none;background:transparent;cursor:pointer;border-radius:8px;align-items:center;justify-content:center;flex-direction:column;gap:5px;padding:0;}
.hamburger:hover{background:#f1efe8;}
.hamburger span{display:block;width:18px;height:2px;background:#1a1a1a;border-radius:2px;}
.topbar-center{font-size:14px;font-weight:600;color:#1c2537;}
.topbar-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;cursor:pointer;flex-shrink:0;}
.banner{padding:9px 16px;font-size:12px;display:flex;align-items:center;gap:8px;background:#faeeda;color:#854f0b;border-bottom:1px solid #fac775;}
.banner.hidden{display:none;}
.date-full-click{display:flex;align-items:center;gap:4px;}
.date-full-click input[type="date"]{cursor:pointer;flex:1;}
.req{color:#c62828;margin-left:2px;font-size:13px;}
/* ── Custom date input — full field clickable ── */
.date-wrap{position:relative;display:inline-block;width:100%;}
.date-wrap input[type="date"]{width:100%;cursor:pointer;}
.date-wrap input[type="date"]::-webkit-calendar-picker-indicator{
  position:absolute;left:0;top:0;width:100%;height:100%;
  opacity:0;cursor:pointer;
}
/* ── Agenda styles ── */
.agenda-table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:1px solid rgba(0,0,0,0.08);}
.agenda-table thead tr{background:#f8f9fb;border-bottom:2px solid rgba(0,0,0,0.08);}
.agenda-table th{padding:10px 14px;text-align:left;font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.06em;white-space:nowrap;cursor:pointer;user-select:none;}
.agenda-table th:hover{color:#1c2537;}
.agenda-table th.sort-asc::after{content:" ↑";color:#1c2537;}
.agenda-table th.sort-desc::after{content:" ↓";color:#1c2537;}
.agenda-table tbody tr{border-bottom:1px solid rgba(0,0,0,0.06);cursor:pointer;transition:background 0.12s;}
.agenda-table tbody tr:last-child{border-bottom:none;}
.agenda-table tbody tr:hover{background:#f5f7ff;}
.agenda-table td{padding:12px 14px;font-size:13px;color:#1c2537;vertical-align:middle;}
.agenda-table .td-date{font-weight:700;font-size:14px;}
.agenda-type-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;background:#e6f1fb;color:#185fa5;}
.agenda-type-badge.fast{background:#f0eeff;color:#5b47d6;}
/* Agenda wizard */
.agenda-section{background:#f8f9fb;border:1px solid rgba(0,0,0,0.08);border-radius:10px;padding:16px;margin-bottom:14px;}
.agenda-section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#888;margin-bottom:12px;}
.agenda-field{margin-bottom:12px;}
.agenda-field label{display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:4px;}
.agenda-field input,.agenda-field select,.agenda-field textarea{width:100%;padding:8px 12px;border:1px solid rgba(0,0,0,0.15);border-radius:8px;font-size:14px;background:#fff;color:#1a1a1a;}
.agenda-field textarea{resize:vertical;min-height:60px;}
.agenda-field .hint{font-size:11px;color:#aaa;margin-top:3px;}
.release-row,.sustain-row,.speaker-row,.ordination-row,.blessing-row{display:grid;gap:8px;margin-bottom:8px;align-items:center;}
.release-row{grid-template-columns:1fr 1fr auto;}
.sustain-row{grid-template-columns:1fr 1fr auto;}
.speaker-row{grid-template-columns:1fr 1fr;}
.ordination-row{grid-template-columns:1fr 1fr auto;}
.blessing-row{grid-template-columns:1fr auto;}
.add-row-btn{display:flex;align-items:center;gap:5px;background:transparent;border:none;color:#185fa5;font-size:12px;font-weight:600;cursor:pointer;padding:2px 0;margin-top:2px;}
.add-row-btn:hover{color:#1c2537;}
.remove-row-btn{background:transparent;border:none;color:#ccc;font-size:18px;cursor:pointer;padding:0;line-height:1;align-self:center;}
.remove-row-btn:hover{color:#c62828;}
/* Script view */
.script-view{max-width:700px;}
.script-block{background:#fff;border:1px solid rgba(0,0,0,0.08);border-radius:10px;padding:18px 20px;margin-bottom:12px;}
.script-step{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#aaa;margin-bottom:6px;}
.script-text{font-size:15px;line-height:1.7;color:#1c2537;white-space:pre-wrap;}
.script-actions{display:flex;gap:10px;margin-bottom:20px;}
@media print{
  .sidebar,.topbar,.topbar-title,.banner,.script-actions,.back-btn,.detail-header{display:none!important;}
  body{margin:0;padding:0;}
  .main{margin:0!important;padding:0!important;}
  .content{padding:0!important;max-width:100%!important;}
  .agenda-doc{border:none!important;border-radius:0!important;padding:24px 40px!important;max-width:100%!important;box-shadow:none!important;}
}
.bulk-toolbar{
  display:flex;align-items:center;gap:10px;
  margin-bottom:8px;font-size:13px;
}
.bulk-toolbar-count{font-size:12px;color:#888;font-weight:500;}
.bulk-action-select{
  padding:6px 10px;border-radius:7px;font-size:12px;font-weight:600;
  border:1px solid rgba(0,0,0,0.15);background:#fff;color:#1c2537;
  cursor:pointer;width:auto;
}
.bulk-action-select:focus{outline:none;border-color:#1c2537;}
.callings-table .cb-col{width:36px;padding:0 0 0 12px;}
.callings-table tbody tr.selected-row{background:#f0f4ff;}
.callings-table thead .select-all-cb{cursor:pointer;width:15px;height:15px;accent-color:#1c2537;}
.callings-table tbody .row-cb{cursor:pointer;width:15px;height:15px;accent-color:#1c2537;}
/* ── Mobile card view ── */
.mobile-cards{display:none;}
@media(max-width:767px){
  .mobile-cards{display:block;}
  .desktop-table{display:none;}
  .m-card{background:#fff;border:1px solid rgba(0,0,0,0.08);border-radius:12px;padding:14px 15px;margin-bottom:9px;position:relative;transition:border-color 0.15s,box-shadow 0.15s;}
  .m-card.m-selected{border-color:#1c2537;background:#f0f4ff;box-shadow:0 0 0 2px rgba(28,37,55,0.15);}
  .m-card-calling{font-weight:700;font-size:15px;color:#1c2537;margin-bottom:2px;}
  .m-card-member{font-size:12px;color:#555;font-weight:500;margin-bottom:2px;}
  .m-card-meta{font-size:11px;color:#999;margin-bottom:8px;}
  .m-card-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .m-card-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
  .m-card-progress{margin-top:8px;}
  .m-card-next{font-size:11px;color:#aaa;margin-top:4px;}
  .m-cb{width:18px;height:18px;accent-color:#1c2537;cursor:pointer;flex-shrink:0;}

  'Stake-Bishop':[
    'Stake Presidency Approval',

};
const DUAL_STEP='Set Appts to Extend & Release Current';

function getSteps(c){
  // Bishop calling has its own special workflow
  if(c.calling==='Bishop'||(c.calling||'').toLowerCase()==='bishop'){
    return WORKFLOWS['Stake-Bishop']||WORKFLOWS['Stake-Calling Only'];
  }
  const t=(c.level==='Stake'||c.level==='Stake Issued')?'Stake':'Ward';
  let action=c.action||'Calling Only';
  // Upgrade to Calling & Release workflow ONLY if the calling has a current holder
  // (Release Current step is for releasing the current holder, not the member's own prior calling)
  if(c.currentlyFilled&&action==='Calling Only') action='Calling & Release';
  // If action is Calling & Release but no current holder, use Calling Only workflow
  // (member's own release is noted on Extend Calling step, no separate Release Current needed)
  if(action==='Calling & Release'&&!c.currentlyFilled) action='Calling Only';
  const workflowKey=t+'-'+action;
  return WORKFLOWS[workflowKey]||WORKFLOWS['Ward-Calling Only'];
}
function filterCallings(cs,role){
  const isBishop=c=>(c.calling||'').toLowerCase()==='bishop';
  // Bishop callings only visible to admin and stake presidency (not high council)
  const canSeeBishop=role.scope==='admin'||(role.scope==='stake'&&role.id!=='high_council');
  if(role.scope==='admin')return cs;
  if(role.scope==='stake'){
    const base=cs.filter(c=>c.level==='Stake'||c.level==='Stake Issued');
    return canSeeBishop?base:base.filter(c=>!isBishop(c));
  }
  if(role.scope==='ward')return cs.filter(c=>c.level!=='Stake'&&c.ward===role.ward&&!isBishop(c));
  if(role.scope==='ward_org')return cs.filter(c=>c.level==='Ward'&&c.ward===role.ward&&c.org===role.org);
  return[];
}
function isReadOnly(r){return false;} // step-level permissions handle restrictions
function canAdvanceWorkflow(r){return r.scope==='admin'||r.scope==='stake'||r.scope==='ward'||r.id==='high_council';}
function getCallingDirForRole(role){
  let d=CALLING_DIR;
  if(role.scope==='stake')d=d.filter(c=>c.level==='Stake'||c.level==='Stake Issued');
  else if(role.scope==='ward')d=d.filter(c=>(c.level==='Stake Issued'||c.level==='Ward')&&!c.stakeOnly);
  else if(role.scope==='ward_org')d=d.filter(c=>c.level==='Ward'&&c.org===role.org);
  return d;
}
function buildCallingOptgroups(dir){
  const groups={};
  dir.forEach(c=>{if(!groups[c.org])groups[c.org]={level:c.level,items:[]};groups[c.org].items.push(c);});
  let html='<option value="">— Select calling —</option>';
  Object.entries(groups).forEach(([orgName,group])=>{
    html+=`<optgroup label="${orgName}">`;
    group.items.forEach(c=>{html+=`<option value="${c.name}||${c.org}||${c.level}">${c.name}</option>`;});
    html+=`<option value="__custom__||${orgName}||${group.level}">&#10022; Custom (${orgName})...</option>`;
    html+='</optgroup>';
  });
  return html;
}
function getLevelFilters(r){
  if(r.scope==='admin')return['All','Stake','Stake Issued','Ward'];
  if(r.scope==='stake')return['All','Stake','Stake Issued'];

}

  if(r.scope==='ward')return`Viewing: Stake Issued + Ward callings for ${r.ward}`;
  if(r.scope==='ward_org')return`Viewing: ${r.org} callings for ${r.ward}`;

}

function getStatusBadge(c){
  const s=getSteps(c);

  const realSteps=s.length-1;
  if(c.currentStep>=realSteps)return{label:'Completed',cls:'badge-green'};

  return{label:'Near Completion',cls:'badge-amber'};
}

// ── Supabase CRUD helpers ─────────────────────────────────────────────────
async function dbLoadAll() {
  const [{ data: callings, error: ce }, { data: agendas, error: ae }] = await Promise.all([
    sb.from('callings').select('*').order('id', { ascending: true }),
    sb.from('agendas').select('*').order('date', { ascending: false }),
  ]);
  if (ce) console.error('Error loading callings:', ce);
  if (ae) console.error('Error loading agendas:', ae);
  return {
    callings: (callings || []).map(callingFromDb),
    agendas: (agendas || []).map(agendaFromDb),
  };
}

async function dbSaveCalling(c) {
  const row = callingToDb(c);
  if (row.id && typeof row.id === 'number' && row.id > 0) {
    // Check if this is a real DB id (positive int) vs a temp local id
    const { error } = await sb.from('callings').upsert(row, { onConflict: 'id' });
    if (error) console.error('Error saving calling:', error);
    return row.id;
  } else {
    // New record — let DB assign id
    const insertRow = { ...row };
    delete insertRow.id;
    const { data, error } = await sb.from('callings').insert(insertRow).select('id').single();
    if (error) console.error('Error inserting calling:', error);
    return data?.id;
  }
}

async function dbDeleteCalling(id) {
  const { error } = await sb.from('callings').delete().eq('id', id);
  if (error) console.error('Error deleting calling:', error);
}

async function dbSaveAgenda(a) {
  const row = agendaToDb(a);
  if (row.id && typeof row.id === 'number' && row.id > 0) {
    const { error } = await sb.from('agendas').upsert(row, { onConflict: 'id' });
    if (error) console.error('Error saving agenda:', error);
    return row.id;
  } else {
    const insertRow = { ...row };
    delete insertRow.id;
    const { data, error } = await sb.from('agendas').insert(insertRow).select('id').single();
    if (error) console.error('Error inserting agenda:', error);
    return data?.id;
  }
}

async function dbDeleteAgenda(id) {
  const { error } = await sb.from('agendas').delete().eq('id', id);
  if (error) console.error('Error deleting agenda:', error);
}

function handleMq(mq){if(!mq.matches){state.sidebarCollapsed=false;applySidebarState();}}
mqDesktop.addEventListener('change',handleMq);

document.getElementById('topbar-avatar').addEventListener('click',openRoleSwitcher);
document.getElementById('sidebar-role-btn').addEventListener('click',()=>{closeSidebar();openRoleSwitcher();});
document.getElementById('bta').addEventListener('click',()=>{devModeRole=null;state.tab='callings';state.view='list';render();});
['callings','agendas','users'].forEach(tab=>{
  const el=document.getElementById('nav-'+tab);
  if(el) el.addEventListener('click',()=>{state.tab=tab;state.view='list';state.detailId=null;closeSidebar();render();});
});

function forceNavWhite(){
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.style.color='#ffffff';
    el.style.background=el.classList.contains('active')?'rgba(255,255,255,0.15)':'transparent';
    el.style.opacity=el.classList.contains('active')?'1':'0.78';
  });
  document.querySelectorAll('.nav-item svg').forEach(el=>{el.style.stroke='#ffffff';});
  const rn=document.getElementById('sidebar-role-name');if(rn)rn.style.color='#ffffff';
  const hn=document.querySelector('.role-hint');if(hn)hn.style.color='rgba(255,255,255,0.5)';
  const sl=document.querySelector('.sidebar-label');if(sl)sl.style.color='rgba(255,255,255,0.45)';
  const ss=document.querySelector('.sidebar-stake-text');if(ss)ss.style.color='#ffffff';
  const sc=document.querySelector('.sidebar-church');if(sc)sc.style.color='rgba(255,255,255,0.6)';
}

function updateChrome(){
  const role=getRole();
  ['callings','agendas','users'].forEach(t=>{const el=document.getElementById('nav-'+t);if(el)el.classList.toggle('active',state.tab===t);});
  // Show Users nav only for admin/stake/bishop roles
  const canManageUsers=role.scope==='admin'||role.scope==='stake'||role.scope==='ward';
  const usersNav=document.getElementById('nav-users');
  if(usersNav) usersNav.style.display=canManageUsers?'':'none';

  // Avatar: use user initials if logged in
  const displayName=currentProfile?.full_name||currentProfile?.email||role.label;
  const init=displayName.charAt(0).toUpperCase();
  ['sidebar-avatar','topbar-avatar'].forEach(id=>{const el=document.getElementById(id);if(el){el.textContent=init;el.style.background=role.color;}});
  document.getElementById('sidebar-role-name').textContent=isSuperAdmin()&&devModeRole?role.label:(currentProfile?.full_name||role.label);
  const titles={callings:'Callings',agendas:'Agendas',users:'User Management'};
  document.getElementById('topbar-title').textContent=titles[state.tab]||'';
  // Dev mode banner for superadmin previewing a role
  const banner=document.getElementById('preview-banner');
  if(isSuperAdmin()&&devModeRole){banner.classList.remove('hidden');document.getElementById('banner-role-name').textContent=role.label;}
  else banner.classList.add('hidden');
  applySidebarState();
  forceNavWhite();
}

// ── Modals ───────────────────────────────────────────────────────────────────
function openCallingModal(role){
  const root=document.getElementById('modal-root');root.innerHTML='';
  const overlay=document.createElement('div');overlay.className='modal-overlay';
  overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal();});
  const modal=document.createElement('div');modal.className='modal';
  overlay.appendChild(modal);

  const isAdmin=role.scope==='admin';
  const isStake=role.scope==='stake';
  const isWard=role.scope==='ward';
  const isWardOrg=role.scope==='ward_org';

  // ── Wizard data ──────────────────────────────────────────────────────────
  const data={
    intent:null,           // 'fill' | 'release' | 'both'
    currentlyFilledAnswer:null, // 'yes' | 'no'
    callingLevel:null,     // 'Stake' | 'Stake Issued' (stake/admin only)
    org:null,
    ward:null,
    callingName:null,
    callingOrg:null,
    callingLevelFinal:null,
    isCustom:false,
    // Release current holder (intent=both)
    releaseName:'',
    // New member info
    memberName:'',
    memberCurrentCalling:'',
    memberCallings:[''],  // array for Calling & Release multi-calling
    memberNeedsRelease:null,  // 'yes'|'no' — release member from their prior calling
    spouseName:'',
    spouseCalling:'',
    notes:'',
  };

  // ── Build step list based on role + intent ───────────────────────────────
  function buildSteps(){
    const steps=['intent'];
    if(isAdmin||isStake){
      steps.push('calling-level');
      steps.push('org-or-ward');
    } else if(isWard){
      steps.push('org');
    }
    // ward_org: no org/ward step — org is known
    steps.push('calling');
    // For any calling (fill or both), ask if the calling is currently filled
    if(data.intent==='fill'||data.intent==='both') steps.push('filled');
    // Member info step
    steps.push('member');
    // If member has a current calling and intent isn't release-only, ask about their release
    if(data.intent==='fill'||data.intent==='both') steps.push('member-release');
    steps.push('notes');
    return steps;
  }

  let steps=buildSteps();
  let idx=0;

  // ── Helpers ──────────────────────────────────────────────────────────────
  function getUniqueOrgs(dir){
    const seen=new Set();
    return dir.map(c=>c.org).filter(o=>{if(seen.has(o))return false;seen.add(o);return true;});
  }

  function getCallingDir(){
    let d=CALLING_DIR;
    if(data.callingLevel==='Stake Issued'){
      d=d.filter(c=>c.level==='Stake Issued');
    } else if(data.callingLevel==='Stake'){
      d=d.filter(c=>c.level==='Stake');
      if(data.org) d=d.filter(c=>c.org===data.org);
    } else if(isWard){
      d=d.filter(c=>(c.level==='Stake Issued'||c.level==='Ward')&&!c.stakeOnly);
      if(data.org) d=d.filter(c=>c.org===data.org);
    } else if(isWardOrg){
      d=d.filter(c=>c.level==='Ward'&&c.org===role.org);
    } else {
      d=getCallingDirForRole(role);
      if(data.org) d=d.filter(c=>c.org===data.org);
    }
    return d;
  }

  function derived(){
    // Action describes what happens to the NEW member being called:
    // - 'fill' or 'both' intent: Calling Only UNLESS the new member also needs releasing from a prior calling
    // - 'release' intent: Release Only
    // Action type maps directly from the user's intent selection
    let action;
    if(data.intent==='release')action='Release Only';
    else if(data.intent==='both')action='Calling & Release';
    else action='Calling Only';
    const level=data.callingLevelFinal||(data.callingLevel==='Stake Issued'?'Stake Issued':data.callingLevel==='Stake'?'Stake':'Ward');
    const ward=data.ward||(isWard||isWardOrg?role.ward:'Stake');
    const org=data.callingOrg||data.org||role.org||'';
    return{action,level,ward,org};
  }

  // ── Render ───────────────────────────────────────────────────────────────
  // Attach overlay to DOM immediately so it's always present
  root.innerHTML='';
  root.appendChild(overlay);

  function renderWizard(){
    modal.innerHTML='<div class="modal-handle"></div>';

    // Progress dots
    const dots=document.createElement('div');dots.className='wizard-step-indicator';
    steps.forEach((_,i)=>{
      const d=document.createElement('div');
      d.className='wizard-dot'+(i<idx?' done':i===idx?' active':'');
      dots.appendChild(d);
    });
    modal.appendChild(dots);

    const stepId=steps[idx];

    function title(txt){const t=document.createElement('div');t.className='modal-title';t.textContent=txt;modal.appendChild(t);}
    function subtitle(txt){const s=document.createElement('div');s.style.cssText='font-size:13px;color:#888;margin-bottom:16px;margin-top:-8px;';s.textContent=txt;modal.appendChild(s);}
    function fg(lbl,el,hint){
      const g=document.createElement('div');g.className='form-group';
      const l=document.createElement('label');l.className='form-label';l.innerHTML=lbl;g.appendChild(l);
      if(hint){const h=document.createElement('div');h.style.cssText='font-size:11px;color:#999;margin-bottom:6px;';h.textContent=hint;g.appendChild(h);}
      g.appendChild(el);modal.appendChild(g);return el;
    }
    function textInp(lbl,placeholder,key,hint){
      const inp=document.createElement('input');inp.type='text';inp.placeholder=placeholder;inp.value=data[key]||'';
      inp.addEventListener('input',()=>{data[key]=inp.value;});
      return fg(lbl,inp,hint);
    }
    function radioGroup(options,key){
      const wrap=document.createElement('div');wrap.className='radio-group';
      options.forEach(opt=>{
        const row=document.createElement('div');row.className='radio-opt'+(data[key]===opt.value?' selected':'');
        const inp=document.createElement('input');inp.type='radio';inp.name=key;inp.value=opt.value;inp.checked=data[key]===opt.value;
        const lbl=document.createElement('div');
        lbl.innerHTML=`<div class="radio-opt-label">${opt.label}</div>${opt.sub?`<div class="radio-opt-sub">${opt.sub}</div>`:''}`;
        row.appendChild(inp);row.appendChild(lbl);
        row.addEventListener('click',()=>{
          data[key]=opt.value;
          wrap.querySelectorAll('.radio-opt').forEach(r=>r.classList.remove('selected'));
          row.classList.add('selected');inp.checked=true;
          if(opt.onChange) opt.onChange();
        });
        wrap.appendChild(row);
      });
      modal.appendChild(wrap);
      return wrap;
    }

    // ── INTENT ─────────────────────────────────────────────────────────────
    if(stepId==='intent'){
      title('What are you doing?');
      radioGroup([
        {value:'fill',   label:'Calling Only',     sub:'The member is only receiving a new calling'},
        {value:'release',label:'Release Only',      sub:'The member is only being released from a calling'},
        {value:'both',   label:'Calling & Release', sub:'New calling + release from current'},
      ],'intent');
    }

    // ── CALLING LEVEL (stake/admin) ─────────────────────────────────────────
    else if(stepId==='calling-level'){
      title('Calling Level');
      radioGroup([
        {value:'Stake',       label:'Stake Calling',        sub:'Called & set apart by Stake Presidency'},
        {value:'Stake Issued',label:'Stake-Issued Calling', sub:'Issued by Stake, extended in the ward (e.g. Bishop, EQ President)'},
      ],'callingLevel');
    }

    // ── ORG OR WARD (stake/admin) ───────────────────────────────────────────
    else if(stepId==='org-or-ward'){
      if(data.callingLevel==='Stake Issued'){
        title('Select Ward');
        const sel=document.createElement('select');
        WARDS_ONLY.forEach(w=>{const o=document.createElement('option');o.value=w;o.textContent=w;if(data.ward===w)o.selected=true;sel.appendChild(o);});
        if(!data.ward)data.ward=WARDS_ONLY[0];
        sel.addEventListener('change',()=>{data.ward=sel.value;});
        fg('Ward / Unit',sel);
      } else {
        title('Select Organization');
        const orgs=getUniqueOrgs(CALLING_DIR.filter(c=>c.level==='Stake'));
        radioGroup(orgs.map(o=>({value:o,label:o})),'org');
      }
    }

    // ── ORG (ward/bishopric) ────────────────────────────────────────────────
    else if(stepId==='org'){
      title('Select Organization');
      let d=CALLING_DIR;
      if(isWard) d=d.filter(c=>(c.level==='Stake Issued'||c.level==='Ward')&&!c.stakeOnly);
      const orgs=getUniqueOrgs(d);
      radioGroup(orgs.map(o=>({value:o,label:o})),'org');
    }

    // ── CALLING ─────────────────────────────────────────────────────────────
    else if(stepId==='calling'){
      title(data.intent==='release'?'Which calling are they being released from?':'Select Calling');
      const dir=getCallingDir();
      const sel=document.createElement('select');
      sel.innerHTML='<option value="">— Select calling —</option>';
      const groups={};
      dir.forEach(c=>{if(!groups[c.org])groups[c.org]={level:c.level,items:[]};groups[c.org].items.push(c);});
      Object.entries(groups).forEach(([orgName,group])=>{
        const og=document.createElement('optgroup');og.label=orgName;
        group.items.forEach(c=>{
          const o=document.createElement('option');o.value=`${c.name}||${c.org}||${c.level}`;o.textContent=c.name;
          if(data.callingName===c.name&&!data.isCustom)o.selected=true;
          og.appendChild(o);
        });
        const co=document.createElement('option');co.value=`__custom__||${orgName}||${group.level}`;co.textContent=`✦ Custom (${orgName})...`;og.appendChild(co);
        sel.appendChild(og);
      });
      sel.addEventListener('change',()=>{
        const raw=sel.value;if(!raw)return;
        const parts=raw.split('||');
        data.isCustom=parts[0]==='__custom__';
        data.callingOrg=parts[1];data.callingLevelFinal=parts[2];
        data.callingName=data.isCustom?'':parts[0];
        customWrap.classList.toggle('hidden',!data.isCustom);
      });
      fg('Calling<span class="req">*</span>',sel);
      const customWrap=document.createElement('div');customWrap.className='custom-box'+(data.isCustom?'':' hidden');
      const cl=document.createElement('label');cl.className='form-label';cl.textContent='Custom calling name';
      const ci=document.createElement('input');ci.type='text';ci.placeholder='Enter calling title...';ci.value=(data.isCustom&&data.callingName)||'';
      ci.addEventListener('input',()=>{data.callingName=ci.value.trim();});
      customWrap.appendChild(cl);customWrap.appendChild(ci);modal.appendChild(customWrap);
    }

    // ── FILLED (is this calling currently occupied?) ────────────────────────
    else if(stepId==='filled'){
      title('Is this calling currently filled?');
      const sub2=document.createElement('div');sub2.style.cssText='font-size:13px;color:#888;margin-bottom:16px;margin-top:-8px;';
      sub2.textContent=`Does someone currently hold the calling of "${data.callingName||'this calling'}"?`;
      modal.appendChild(sub2);

      radioGroup([
        {value:'no',  label:'No — this calling is vacant'},
        {value:'yes', label:'Yes — someone needs to be released from it'},
      ],'currentlyFilledAnswer');

      // Release name box — shows when 'yes' selected
      const rb=document.createElement('div');
      rb.className='currently-filled-box'+(data.currentlyFilledAnswer==='yes'?'':' hidden');
      rb.style.marginTop='12px';
      const rlbl=document.createElement('label');rlbl.className='form-label';rlbl.style.color='#7a5400';rlbl.textContent='Name of current holder to be released<span class="req">*</span>';
      const rinp=document.createElement('input');rinp.type='text';rinp.placeholder='Full name';rinp.value=data.releaseName||'';
      rinp.style.cssText='width:100%;padding:9px 12px;border:1px solid rgba(0,0,0,0.15);border-radius:8px;font-size:14px;background:#fff;color:#1a1a1a;margin-top:6px;';
      rinp.addEventListener('input',()=>{data.releaseName=rinp.value;});
      rb.appendChild(rlbl);rb.appendChild(rinp);
      modal.appendChild(rb);

      // Show/hide release box when radio changes
      modal.querySelectorAll('.radio-opt').forEach(row=>{
        row.addEventListener('click',()=>{
          rb.classList.toggle('hidden',data.currentlyFilledAnswer!=='yes');
          if(data.currentlyFilledAnswer!=='yes') data.releaseName='';
        });
      });
    }

    // ── MEMBER INFO ─────────────────────────────────────────────────────────
    else if(stepId==='member'){
      if(data.intent==='release'){
        title('Person Being Released');
        subtitle('Enter the details of the person being released.');
      } else {
        title('Member Being Called');
        subtitle('Enter the details of the person receiving this calling.');
      }
      textInp('Full Name<span class="req">*</span>','First and last name','memberName');
      // Pre-populate memberCallings array if not set
      if(!data.memberCallings) data.memberCallings=[''];
      if(data.intent==='both'){
        // Calling & Release — amber multi-calling release section
        if(!data.memberCallings||!data.memberCallings.length) data.memberCallings=[''];
        const releaseSection=document.createElement('div');
        releaseSection.className='currently-filled-box';
        releaseSection.style.marginBottom='12px';

        const rsTitle=document.createElement('div');
        rsTitle.style.cssText='font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:#7a5400;margin-bottom:8px;';
        rsTitle.textContent='Calling(s) to be released from';
        releaseSection.appendChild(rsTitle);

        const callingsWrap=document.createElement('div');callingsWrap.id='callings-wrap';
        releaseSection.appendChild(callingsWrap);

        function renderCallingFields(){
          callingsWrap.innerHTML='';
          data.memberCallings.forEach((val,idx)=>{
            const row=document.createElement('div');row.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:8px;';
            const inp=document.createElement('input');inp.type='text';
            inp.placeholder='Calling title';inp.value=val;
            inp.style.cssText='flex:1;padding:9px 12px;border:1px solid rgba(0,0,0,0.15);border-radius:8px;font-size:14px;background:#fff;color:#1a1a1a;';
            inp.addEventListener('input',()=>{data.memberCallings[idx]=inp.value;});
            row.appendChild(inp);
            if(data.memberCallings.length>1){
              const rm=document.createElement('button');
              rm.type='button';
              rm.style.cssText='background:transparent;border:none;color:#c62828;font-size:18px;cursor:pointer;padding:0 4px;line-height:1;flex-shrink:0;';
              rm.textContent='×';
              rm.addEventListener('click',()=>{data.memberCallings.splice(idx,1);renderCallingFields();});
              row.appendChild(rm);
            }
            callingsWrap.appendChild(row);
          });
        }
        renderCallingFields();

        const addBtn=document.createElement('button');
        addBtn.type='button';
        addBtn.style.cssText='display:flex;align-items:center;gap:6px;background:transparent;border:none;color:#a05c00;font-size:12px;font-weight:600;cursor:pointer;padding:2px 0;margin-top:2px;';
        addBtn.innerHTML='<span style="font-size:16px;line-height:1">+</span> Add calling';
        addBtn.addEventListener('click',()=>{data.memberCallings.push('');renderCallingFields();});
        releaseSection.appendChild(addBtn);

        const fg2=document.createElement('div');fg2.className='form-group';fg2.appendChild(releaseSection);
        modal.appendChild(fg2);

      } else if(data.intent==='fill'){
        textInp('Current Calling (if any)','Leave blank if none','memberCurrentCalling');
      }
      textInp('Spouse Name (optional)','','spouseName');
      textInp("Spouse's Current Calling (optional)",'','spouseCalling');
    }

    // ── MEMBER RELEASE (does new member need to be released from prior calling?) ──
    else if(stepId==='member-release'){
      // Skip for 'both' — release callings already captured on member step
      if(data.intent==='both'){
        idx++;steps=buildSteps();
        if(idx>=steps.length){submitCalling();return;}
        renderWizard();return;
      }
      if(!data.memberCurrentCalling){
        // Skip this step automatically — no prior calling
        idx++;steps=buildSteps();
        if(idx>=steps.length){submitCalling();return;}
        renderWizard();return;
      }
      title('Release from Prior Calling?');
      subtitle(`${data.memberName||'This member'} currently holds: ${data.memberCurrentCalling}`);
      radioGroup([
        {value:'yes',label:'Yes — Release from current calling',
         sub:'A release step will be added to the Extend Calling stage'},
        {value:'no', label:'No — Keep current calling'},
      ],'memberNeedsRelease');
    }

    // ── NOTES ───────────────────────────────────────────────────────────────
    else if(stepId==='notes'){
      title('Additional Notes');
      const notesInp=document.createElement('textarea');notesInp.placeholder='Any additional notes (optional)...';notesInp.value=data.notes;
      notesInp.style.minHeight='80px';
      notesInp.addEventListener('input',()=>{data.notes=notesInp.value;});
      fg('Notes',notesInp);
    }

    // ── Nav buttons ─────────────────────────────────────────────────────────
    const nav=document.createElement('div');nav.className='wizard-nav';
    if(idx>0){
      const back=document.createElement('button');back.className='wizard-back';back.textContent='← Back';
      back.addEventListener('click',()=>{idx--;steps=buildSteps();renderWizard();});
      nav.appendChild(back);
    } else {
      // Spacer so Next stays right-aligned on first step
      const spacer=document.createElement('div');nav.appendChild(spacer);
    }
    const isLast=idx===steps.length-1;
    const nextBtn=document.createElement('button');nextBtn.className='wizard-next';
    nextBtn.textContent=isLast?'Submit →':'Next →';
    nextBtn.addEventListener('click',()=>{
      // Validate
      if(stepId==='intent'&&!data.intent){alert('Please select what you are doing.');return;}
      if(stepId==='calling-level'&&!data.callingLevel){alert('Please select a calling level.');return;}
      if(stepId==='org-or-ward'&&data.callingLevel==='Stake'&&!data.org){alert('Please select an organization.');return;}
      if(stepId==='org'&&!data.org){alert('Please select an organization.');return;}
      if(stepId==='calling'&&!data.callingName){alert('Please select a calling.');return;}
      if(stepId==='filled'&&!data.currentlyFilledAnswer){alert('Please indicate if this calling is currently filled.');return;}
      if(stepId==='filled'&&data.currentlyFilledAnswer==='yes'&&!data.releaseName.trim()){alert('Please enter the name of the current holder to be released.');return;}
      if(stepId==='member'&&!data.memberName.trim()){alert('Please enter the member\'s name.');return;}
      if(stepId==='member-release'&&data.memberCurrentCalling&&!data.memberNeedsRelease){alert('Please indicate whether this member needs to be released from their current calling.');return;}

      if(stepId==='intent'){
        // Rebuild steps now that intent is known
        steps=buildSteps();
      }

      if(isLast){submitCalling();}
      else{idx++;steps=buildSteps();renderWizard();}
    });
    nav.appendChild(nextBtn);
    modal.appendChild(nav);
    // Ensure modal is inside overlay (re-append in case of re-render)
    if(!overlay.contains(modal)) overlay.appendChild(modal);
  }

  function submitCalling(){
    const {action,level,ward,org}=derived();
    // hasCurrentHolder = the calling is currently occupied by someone who needs replacing
    const hasCurrentHolder=(data.intent==='fill'||data.intent==='both')&&data.currentlyFilledAnswer==='yes';
    const newCalling={
      id:null, // will be assigned by DB
      name:data.memberName,
      calling:data.callingName,
      org,ward,level,action,
      submittedDate:today(),
      currentStep:0,stepDates:[],stepMeta:{},
      notes:data.notes,custom:data.isCustom,
      memberCurrentCalling:data.intent==='both'?(data.memberCallings||[]).filter(Boolean).join(', '):data.memberCurrentCalling,
      memberCallings:data.intent==='both'?(data.memberCallings||[]).filter(Boolean):[],
      memberNeedsRelease:data.intent==='both'||data.memberNeedsRelease==='yes',
      spouseName:data.spouseName,
      spouseCalling:data.spouseCalling,
      releaseName:hasCurrentHolder?data.releaseName:'',
      currentlyFilled:hasCurrentHolder,
    };
    closeModal();
    // Optimistically add to state with temp id, then update with real DB id
    const tempId = Date.now();
    newCalling.id = tempId;
    state.callings.push(newCalling);
    render();
    dbSaveCalling(newCalling).then(realId=>{
      if(realId){
        const c=state.callings.find(x=>x.id===tempId);
        if(c) c.id=realId;
      }
    });
  }

  renderWizard();
}

function openCallingEditModal(c,role){
  const root=document.getElementById('modal-root');root.innerHTML='';
  const overlay=document.createElement('div');overlay.className='modal-overlay';
  overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal();});
  const modal=document.createElement('div');modal.className='modal';
  overlay.appendChild(modal);
  root.appendChild(overlay);

  modal.innerHTML='<div class="modal-handle"></div>';
  const title=document.createElement('div');title.className='modal-title';title.textContent='Edit Calling';modal.appendChild(title);

  function fg(lbl,el){
    const g=document.createElement('div');g.className='form-group';
    const l=document.createElement('label');l.className='form-label';l.innerHTML=lbl;
    g.appendChild(l);g.appendChild(el);modal.appendChild(g);return el;
  }
  function inp(lbl,val,key){
    const el=document.createElement('input');el.type='text';el.value=val||'';
    el.addEventListener('input',()=>{c[key]=el.value;});
    return fg(lbl,el);
  }
  function sel(lbl,options,val,key){
    const el=document.createElement('select');
    options.forEach(o=>{const opt=document.createElement('option');opt.value=o;opt.textContent=o;if(o===val)opt.selected=true;el.appendChild(opt);});
    el.addEventListener('change',()=>{c[key]=el.value;});
    return fg(lbl,el);
  }

  // Member Name
  inp('Member Name<span class="req">*</span>',c.name,'name');

  // Ward (needed to filter callings)
  const wardGroup=document.createElement('div');wardGroup.className='form-group';
  const wardLbl=document.createElement('label');wardLbl.className='form-label';wardLbl.innerHTML='Ward / Unit<span class="req">*</span>';
  const wardSel=document.createElement('select');
  ALL_WARDS.forEach(w=>{const o=document.createElement('option');o.value=w;o.textContent=w;if(w===c.ward)o.selected=true;wardSel.appendChild(o);});
  wardGroup.appendChild(wardLbl);wardGroup.appendChild(wardSel);modal.appendChild(wardGroup);

  // Level
  const levelGroup=document.createElement('div');levelGroup.className='form-group';
  const levelLbl=document.createElement('label');levelLbl.className='form-label';levelLbl.textContent='Level';
  const levelSel=document.createElement('select');
  ['Stake','Stake Issued','Ward'].forEach(lv=>{const o=document.createElement('option');o.value=lv;o.textContent=lv;if(lv===c.level)o.selected=true;levelSel.appendChild(o);});
  levelGroup.appendChild(levelLbl);levelGroup.appendChild(levelSel);modal.appendChild(levelGroup);

  // Organization (auto-filled, read-only display but also editable as fallback)
  const orgGroup=document.createElement('div');orgGroup.className='form-group';
  const orgLbl=document.createElement('label');orgLbl.className='form-label';orgLbl.textContent='Organization';
  const orgInp=document.createElement('input');orgInp.type='text';orgInp.value=c.org||'';
  orgInp.style.background='#f8f9fb';orgInp.readOnly=true;
  orgGroup.appendChild(orgLbl);orgGroup.appendChild(orgInp);modal.appendChild(orgGroup);

  // Calling dropdown — filtered by level
  const callingGroup=document.createElement('div');callingGroup.className='form-group';
  const callingLbl=document.createElement('label');callingLbl.className='form-label';callingLbl.textContent='Calling';
  const callingSel=document.createElement('select');
  callingGroup.appendChild(callingLbl);callingGroup.appendChild(callingSel);modal.appendChild(callingGroup);

  // Custom calling input
  const customBox=document.createElement('div');customBox.className='custom-box hidden';
  const customLbl=document.createElement('label');customLbl.className='form-label';customLbl.textContent='Custom calling name';
  const customInp=document.createElement('input');customInp.type='text';customInp.placeholder='Enter calling title...';customInp.value=c.isCustom?c.calling:'';
  customInp.addEventListener('input',()=>{c.calling=customInp.value;});
  customBox.appendChild(customLbl);customBox.appendChild(customInp);modal.appendChild(customBox);

  function rebuildCallingDropdown(){
    const level=levelSel.value;
    let dir=CALLING_DIR;
    if(level==='Stake') dir=dir.filter(d=>d.level==='Stake');
    else if(level==='Stake Issued') dir=dir.filter(d=>d.level==='Stake Issued');
    else dir=dir.filter(d=>d.level==='Ward');

    callingSel.innerHTML='';
    const groups={};
    dir.forEach(d=>{if(!groups[d.org])groups[d.org]={items:[]};groups[d.org].items.push(d);});
    Object.entries(groups).forEach(([orgName,group])=>{
      const og=document.createElement('optgroup');og.label=orgName;
      group.items.forEach(d=>{
        const o=document.createElement('option');
        o.value=`${d.name}||${d.org}`;
        o.textContent=d.name;
        if(d.name===c.calling&&!c.isCustom) o.selected=true;
        og.appendChild(o);
      });
      const co=document.createElement('option');co.value=`__custom__||${orgName}`;co.textContent=`✦ Custom (${orgName})...`;
      if(c.isCustom) co.selected=true;
      og.appendChild(co);
      callingSel.appendChild(og);
    });

    // Set org from current selection
    const raw=callingSel.value;
    if(raw){
      const parts=raw.split('||');
      const isCustom=parts[0]==='__custom__';
      if(!isCustom){c.calling=parts[0];c.org=parts[1];orgInp.value=parts[1];}
      customBox.classList.toggle('hidden',!isCustom);
    }
  }

  callingSel.addEventListener('change',()=>{
    const raw=callingSel.value;
    if(!raw)return;
    const parts=raw.split('||');
    const isCustom=parts[0]==='__custom__';
    c.isCustom=isCustom;
    if(!isCustom){c.calling=parts[0];c.org=parts[1];orgInp.value=parts[1];}
    customBox.classList.toggle('hidden',!isCustom);
  });

  levelSel.addEventListener('change',()=>{c.level=levelSel.value;rebuildCallingDropdown();});
  wardSel.addEventListener('change',()=>{c.ward=wardSel.value;});

  rebuildCallingDropdown();

  // Action
  sel('Action',['Calling Only','Release Only','Calling & Release'],c.action,'action');

  // Submitted date
  const dateInp=document.createElement('input');dateInp.type='date';dateInp.value=c.submittedDate||'';
  dateInp.addEventListener('change',()=>{c.submittedDate=dateInp.value;});
  fg('Submitted Date',dateInp);

  const div1=document.createElement('div');div1.className='section-divider';modal.appendChild(div1);
  const secLbl=document.createElement('div');secLbl.style.cssText='font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#aaa;margin-bottom:12px;';secLbl.textContent='Member Info';modal.appendChild(secLbl);

  inp('Current Calling',c.memberCurrentCalling,'memberCurrentCalling');
  inp('Spouse Name',c.spouseName,'spouseName');
  inp("Spouse's Calling",c.spouseCalling,'spouseCalling');

  // Current holder section — always shown so user can add after the fact
  const div2=document.createElement('div');div2.className='section-divider';modal.appendChild(div2);
  const secLbl2=document.createElement('div');secLbl2.style.cssText='font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#aaa;margin-bottom:12px;';secLbl2.textContent='Current Holder (optional)';modal.appendChild(secLbl2);

  // Toggle
  const filledRow=document.createElement('div');filledRow.style.cssText='display:flex;align-items:center;gap:10px;margin-bottom:10px;';
  const filledLbl=document.createElement('label');filledLbl.style.cssText='font-size:13px;color:#555;display:flex;align-items:center;gap:6px;cursor:pointer;';
  const filledChk=document.createElement('input');filledChk.type='checkbox';filledChk.checked=!!c.currentlyFilled;
  filledChk.style.cssText='width:16px;height:16px;accent-color:#1c2537;cursor:pointer;';
  filledLbl.appendChild(filledChk);filledLbl.appendChild(document.createTextNode('This calling is currently filled'));
  filledRow.appendChild(filledLbl);modal.appendChild(filledRow);
  filledChk.addEventListener('change',()=>{c.currentlyFilled=filledChk.checked;if(!filledChk.checked)c.releaseName='';holderNameField.style.display=filledChk.checked?'block':'none';});

  const holderNameField=document.createElement('div');holderNameField.style.display=c.currentlyFilled?'block':'none';
  const holderInp=document.createElement('input');holderInp.type='text';holderInp.value=c.releaseName||'';holderInp.placeholder='Full name of current holder';
  holderInp.addEventListener('input',()=>{c.releaseName=holderInp.value;});
  holderNameField.appendChild(holderInp);modal.appendChild(holderNameField);

  // Member's own callings to be released from (Calling & Release)
  if(c.action==='Calling & Release'||c.memberNeedsRelease){
    const div3=document.createElement('div');div3.className='section-divider';modal.appendChild(div3);
    const secLbl3=document.createElement('div');secLbl3.style.cssText='font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#aaa;margin-bottom:12px;';secLbl3.textContent="Members Callings to Release";modal.appendChild(secLbl3);

    if(!Array.isArray(c.memberCallings))c.memberCallings=c.memberCurrentCalling?[c.memberCurrentCalling]:[''];
    const mcWrap=document.createElement('div');

    function renderMCRows(){
      mcWrap.innerHTML='';
      c.memberCallings.forEach((val,i)=>{
        const row=document.createElement('div');row.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:8px;';
        const minp=document.createElement('input');minp.type='text';minp.placeholder='Calling title';minp.value=val||'';
        minp.style.flex='1';
        minp.addEventListener('input',()=>{c.memberCallings[i]=minp.value;c.memberCurrentCalling=c.memberCallings.filter(Boolean).join(', ');});
        const rm=document.createElement('button');rm.type='button';rm.style.cssText='background:transparent;border:none;color:#c62828;font-size:18px;cursor:pointer;padding:0 4px;';rm.textContent='×';
        rm.addEventListener('click',()=>{c.memberCallings.splice(i,1);renderMCRows();});
        row.appendChild(minp);if(c.memberCallings.length>1)row.appendChild(rm);
        mcWrap.appendChild(row);
      });
      const addBtn=document.createElement('button');addBtn.type='button';addBtn.className='add-row-btn';addBtn.innerHTML='+ Add calling';
      addBtn.addEventListener('click',()=>{c.memberCallings.push('');renderMCRows();});
      mcWrap.appendChild(addBtn);
    }
    renderMCRows();
    modal.appendChild(mcWrap);
  }

  // Notes
  const div3=document.createElement('div');div3.className='section-divider';modal.appendChild(div3);
  const notesEl=document.createElement('textarea');notesEl.value=c.notes||'';notesEl.placeholder='Optional notes';
  notesEl.addEventListener('input',()=>{c.notes=notesEl.value;});
  fg('Notes',notesEl);

  // Save button
  const saveBtn=document.createElement('button');
  saveBtn.className='btn-primary';
  saveBtn.style.cssText='width:100%;padding:12px;font-size:14px;border-radius:10px;margin-top:4px;';
  saveBtn.textContent='Save Changes';
  saveBtn.addEventListener('click',()=>{closeModal();render();dbSaveCalling(c);});
  modal.appendChild(saveBtn);
}

  overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal();});
  const modal=document.createElement('div');modal.className='modal';modal.innerHTML='<div class="modal-handle"></div>';

// ── Render ───────────────────────────────────────────────────────────────────
// ── Agenda helpers ────────────────────────────────────────────────────────────
function getAgendaWard(role){
  // Sacrament meetings are ward-level only
  if(role.scope==='ward'||role.scope==='ward_org') return role.ward||'';
  if(role.scope==='admin') return 'Pecan Ranch Ward'; // admin defaults to first ward for testing
  return null; // stake scope = no sacrament meeting access
}

function canCreateSacramentAgenda(role){
  // Only bishopric members (ward scope with Bishopric org) or admin
  if(role.scope==='admin') return true;
  if(role.scope==='ward'&&role.org==='Bishopric') return true;
  return false;
}

function makeDateInput(value,onChange,extraStyle){
  // Wrapper makes the entire field clickable for the date picker
  const wrap=document.createElement('div');wrap.className='date-wrap';
  const inp=document.createElement('input');inp.type='date';
  inp.value=value||'';
  if(extraStyle)inp.style.cssText=extraStyle;
  inp.addEventListener('change',()=>onChange(inp.value));
  // Clicking anywhere on the input opens the picker
  inp.addEventListener('click',()=>{try{inp.showPicker();}catch(e){}});
  wrap.appendChild(inp);
  return{wrap,inp};
}

function fmtDate(d){
  if(!d)return'';
  const [y,m,day]=d.split('-');
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  return `${months[parseInt(m)-1]} ${parseInt(day)}, ${y}`;
}

function salutation(name){
  if(!name||!name.trim())return name;
  const parts=name.trim().split(' ');
  const last=parts[parts.length-1];
  return `Brother/Sister ${last}`;
}

// ── Render Agendas List ───────────────────────────────────────────────────────
function renderAgendas(el,role){
  el.innerHTML='';

  // Stake-only roles don't have sacrament meetings
  if(role.scope==='stake'){
    const es=document.createElement('div');es.className='empty-state';
    es.innerHTML='<div style="font-size:32px;margin-bottom:12px;">📋</div><div>Sacrament Meeting agendas are ward-level.</div><div style="font-size:12px;color:#bbb;margin-top:6px;">This module is available to Bishopric members and ward leaders.</div>';
    el.appendChild(es);return;
  }

  const hdr=document.createElement('div');hdr.className='section-header';hdr.style.marginBottom='12px';
  const spacer=document.createElement('div');hdr.appendChild(spacer);
  if(canCreateSacramentAgenda(role)){
    const btn=document.createElement('button');btn.className='btn-primary';btn.textContent='+ New Agenda';
    btn.addEventListener('click',()=>{window._agendaDraft=null;state.view='new';render();});
    hdr.appendChild(btn);
  }
  el.appendChild(hdr);

  const agendas=state.agendas||[];
  // Filter to role's ward, sort by date descending
  const roleWard=getAgendaWard(role);
  const filtered=role.scope==='admin'?agendas:agendas.filter(a=>a.ward===roleWard);
  const sorted=[...filtered].sort((a,b)=>b.date.localeCompare(a.date));

  if(!sorted.length){
    const es=document.createElement('div');es.className='empty-state';
    es.innerHTML='<div style="font-size:32px;margin-bottom:12px;">📋</div><div>No agendas yet.</div><div style="font-size:12px;color:#bbb;margin-top:6px;">Click "+ New Agenda" to create your first sacrament meeting agenda.</div>';
    el.appendChild(es);return;
  }
  const table=document.createElement('table');table.className='agenda-table';
  const thead=document.createElement('thead');
  thead.innerHTML='<tr><th>Date</th><th>Ward</th><th>Type</th><th>Conducting</th><th>Presiding</th></tr>';
  table.appendChild(thead);
  const tbody=document.createElement('tbody');
  sorted.forEach(a=>{
    const tr=document.createElement('tr');
    const typeBadge=`<span class="agenda-type-badge${a.meetingType==='Fast & Testimony'?' fast':''}">${a.meetingType}</span>`;
    tr.innerHTML=`<td class="td-date">${fmtDate(a.date)}</td><td style="color:#888;font-size:12px;">${a.ward}</td><td>${typeBadge}</td><td>${a.conducting||'—'}</td><td>${a.presiding||'—'}</td>`;
    tr.addEventListener('click',()=>{state.detailId=a.id;state.view='detail';render();});
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);el.appendChild(table);
}

function dateInp(val,onChange){

  inp.type='date';

  inp.addEventListener('change',()=>{if(onChange)onChange(inp.value);});

function renderAgendaWizard(el,role,editingAgenda){
  el.innerHTML='';

  if(!canCreateSacramentAgenda(role)){
    el.innerHTML='<div class="empty-state">Only Bishopric members can create sacrament meeting agendas.</div>';return;
  }

  const ward=getAgendaWard(role)||'';
  const isEditing=!!editingAgenda;

  // Init draft from existing agenda or blank
  if(!window._agendaDraft){
    if(isEditing){
      window._agendaDraft=JSON.parse(JSON.stringify(editingAgenda));
    } else {
      // Auto-populate sustainings and releases from callings tracker
      const autoSustain=[];
      const autoRelease=[];
      (state.callings||[]).forEach(c=>{
        if(c.ward!==ward)return; // only this ward
        const steps=getSteps(c);
        const sustainIdx=steps.indexOf('Sustain over Pulpit');
        const sustainAltIdx=steps.indexOf('Sustain & Release over Pulpit');
        const isSustainReady=(sustainIdx>=0&&c.currentStep===sustainIdx)||
                             (sustainAltIdx>=0&&c.currentStep===sustainAltIdx);
        if(isSustainReady){
          autoSustain.push({member:c.name,calling:c.calling,_callingId:c.id,_auto:true});
          // Also add release if there's a current holder to release
          if(c.currentlyFilled&&c.releaseName){
            autoRelease.push({member:c.releaseName,calling:c.calling,_callingId:c.id,_auto:true});
          }
          // Add member's own release if they have prior callings to be released from
          if(c.memberNeedsRelease&&c.memberCallings&&c.memberCallings.length){
            c.memberCallings.forEach(mc=>{
              autoRelease.push({member:c.name,calling:mc,_callingId:c.id,_auto:true});
            });
          } else if(c.memberNeedsRelease&&c.memberCurrentCalling){
            // Fallback to single memberCurrentCalling field
            autoRelease.push({member:c.name,calling:c.memberCurrentCalling,_callingId:c.id,_auto:true});
          }
        }
      });

      window._agendaDraft={
        date:'',ward,meetingType:'Regular',
        conducting:'',presiding:'',highCounselor:'',stakeVisiting:false,
        chorister:'',accompanist:'',
        openingPrayer:'',closingPrayer:'',
        openingHymnNum:'',openingHymnTitle:'',
        sacramentHymnNum:'',sacramentHymnTitle:'',
        intermediateHymn:'',intermediateHymnTitle:'',
        closingHymnNum:'',closingHymnTitle:'',
        announcementList:[],
        newRecordsList:[],
        releases:autoRelease,sustainings:autoSustain,ordinations:[],
        babyBlessingsList:[],confirmationsList:[],
        speaker1:'',speaker1Topic:'',
        speaker2:'',speaker2Topic:'',
        finalSpeaker:'',finalSpeakerTopic:'',
      };
    }
  }
  const d=window._agendaDraft;
  // Always keep ward in sync with role
  if(!isEditing) d.ward=ward||d.ward;

  const hdr=document.createElement('div');hdr.className='detail-header';
  const bb=document.createElement('button');bb.className='back-btn';bb.innerHTML='&larr;';
  bb.addEventListener('click',()=>{window._agendaDraft=null;state.view=isEditing?'detail':'list';render();});
  const hdi=document.createElement('div');
  hdi.innerHTML=`<div class="detail-calling">${isEditing?'Edit Agenda':'New Sacrament Meeting Agenda'}</div>`;
  hdr.appendChild(bb);hdr.appendChild(hdi);el.appendChild(hdr);

  // ── Helpers ────────────────────────────────────────────────────────────────
  function inp(val,key,placeholder){
    const i=document.createElement('input');i.type='text';i.value=val||'';i.placeholder=placeholder||'';
    i.addEventListener('input',()=>{d[key]=i.value;});return i;
  }
  function selInp(options,val,key){
    const s=document.createElement('select');
    options.forEach(o=>{const op=document.createElement('option');op.value=o;op.textContent=o;if(o===val)op.selected=true;s.appendChild(op);});
    s.addEventListener('change',()=>{d[key]=s.value;if(key==='meetingType'){window._agendaDraft=d;render();}});return s;
  }
  function field(lbl,el2,hint){
    const w=document.createElement('div');w.className='agenda-field';
    const l=document.createElement('label');l.innerHTML=lbl;w.appendChild(l);
    if(hint){const h=document.createElement('div');h.className='hint';h.textContent=hint;w.appendChild(h);}
    w.appendChild(el2);return w;
  }
  function hymnRow(numKey,titleKey,lbl){
    const row=document.createElement('div');row.style.cssText='display:grid;grid-template-columns:90px 1fr;gap:8px;';
    const nf=document.createElement('div');nf.className='agenda-field';nf.style.marginBottom='0';
    nf.innerHTML='<label>Hymn #</label>';nf.appendChild(inp(d[numKey],numKey,'#'));
    const tf=document.createElement('div');tf.className='agenda-field';tf.style.marginBottom='0';
    tf.innerHTML='<label>Title (optional)</label>';tf.appendChild(inp(d[titleKey],titleKey,'Hymn title'));
    row.appendChild(nf);row.appendChild(tf);
    return field(lbl,row);
  }

  // ── Collapsible section builder ─────────────────────────────────────────────
  function collapsibleSection(title,buildFn,startOpen){
    const wrap=document.createElement('div');wrap.className='agenda-section';wrap.style.padding='0';
    const hd=document.createElement('div');
    hd.style.cssText='display:flex;align-items:center;justify-content:space-between;padding:13px 16px;cursor:pointer;user-select:none;border-radius:10px;transition:background 0.15s;';
    const ht=document.createElement('div');ht.className='agenda-section-title';ht.style.margin='0';ht.textContent=title;
    const arrow=document.createElement('span');arrow.style.cssText='font-size:12px;color:#aaa;transition:transform 0.2s;';
    arrow.textContent='▼';
    hd.appendChild(ht);hd.appendChild(arrow);wrap.appendChild(hd);

    const body=document.createElement('div');body.style.cssText='padding:0 16px 14px;';
    buildFn(body);
    wrap.appendChild(body);

    let open=startOpen!==false;
    function setOpen(o){
      open=o;
      body.style.display=open?'block':'none';
      arrow.style.transform=open?'':'rotate(-90deg)';
      hd.style.background=open?'':'';
    }
    setOpen(open);
    hd.addEventListener('click',()=>setOpen(!open));
    hd.addEventListener('mouseenter',()=>{hd.style.background='rgba(0,0,0,0.03)';});
    hd.addEventListener('mouseleave',()=>{hd.style.background='';});
    return wrap;
  }

  // Dynamic list builder helper
  function dynamicList(arr,renderRow,addLabel,addDefault){
    const wrap=document.createElement('div');
    function rebuild(){
      wrap.innerHTML='';
      arr.forEach((item,i)=>{ const row=renderRow(item,i,rebuild); wrap.appendChild(row); });
      const addBtn=document.createElement('button');addBtn.className='add-row-btn';addBtn.innerHTML=addLabel;
      addBtn.addEventListener('click',()=>{arr.push(addDefault());rebuild();});
      wrap.appendChild(addBtn);
    }
    rebuild();
    return wrap;
  }

  // ── SECTION: Meeting Basics ─────────────────────────────────────────────────
  el.appendChild(collapsibleSection('Meeting Basics', body=>{
    body.appendChild(field('Meeting Date<span class="req">*</span>',dateInp(d.date,v=>{d.date=v;})));

    const wardDisplay=document.createElement('input');wardDisplay.type='text';
    wardDisplay.value=isEditing?d.ward:ward;wardDisplay.readOnly=true;
    wardDisplay.style.cssText='width:100%;padding:8px 12px;border:1px solid rgba(0,0,0,0.1);border-radius:8px;font-size:14px;background:#f0f2f5;color:#555;cursor:default;';
    body.appendChild(field('Ward',wardDisplay));

    body.appendChild(field('Meeting Type',selInp(['Regular','Fast & Testimony'],d.meetingType,'meetingType')));
    body.appendChild(field('Conducting<span class="req">*</span>',inp(d.conducting,'conducting','Full name')));
    body.appendChild(field('Presiding<span class="req">*</span>',inp(d.presiding,'presiding','Full name')));

    const hcRow=document.createElement('div');hcRow.style.cssText='display:grid;grid-template-columns:1fr 140px;gap:10px;align-items:start;';
    const hcField=document.createElement('div');hcField.className='agenda-field';hcField.style.marginBottom='0';
    hcField.innerHTML='<label>High Counselor Visiting (optional)</label>';
    hcField.appendChild(inp(d.highCounselor,'highCounselor','Full name'));
    const stakeField=document.createElement('div');stakeField.className='agenda-field';stakeField.style.marginBottom='0';

    const stakeS=selInp(['No','Yes'],d.stakeVisiting?'Yes':'No','_sv');
    stakeS.style.width='100%';stakeS.addEventListener('change',()=>{d.stakeVisiting=stakeS.value==='Yes';});
    stakeField.appendChild(stakeS);
    hcRow.appendChild(hcField);hcRow.appendChild(stakeField);body.appendChild(hcRow);

    body.appendChild(field('Chorister',inp(d.chorister,'chorister','Full name')));
