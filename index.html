  // ── SECTION: Speakers ───────────────────────────────────────────────────────
  el.appendChild(collapsibleSection(d.meetingType==='Fast & Testimony'?'Fast & Testimony':'Speakers', body=>{
    if(d.meetingType==='Fast & Testimony'){
      body.appendChild(field('Meeting Notes (optional)',inp(d.speaker1Topic,'speaker1Topic','Any special notes for the meeting')));
    } else {
      function speakerRow(numLbl,nameKey,topicKey){
        const r=document.createElement('div');r.className='speaker-row';r.style.marginBottom='10px;';
        const nf=document.createElement('div');nf.className='agenda-field';nf.style.marginBottom='0';
        nf.innerHTML=`<label>${numLbl}</label>`;nf.appendChild(inp(d[nameKey],nameKey,'Full name'));
        const tf=document.createElement('div');tf.className='agenda-field';tf.style.marginBottom='0';
        tf.innerHTML='<label>Topic (optional)</label>';tf.appendChild(inp(d[topicKey],topicKey,'Topic'));
        r.appendChild(nf);r.appendChild(tf);return r;
      }
      body.appendChild(speakerRow('Speaker 1','speaker1','speaker1Topic'));
      const s2=speakerRow('Speaker 2 (optional)','speaker2','speaker2Topic');s2.style.marginTop='8px';body.appendChild(s2);
      const fs=speakerRow('Final Speaker (optional)','finalSpeaker','finalSpeakerTopic');fs.style.marginTop='8px';body.appendChild(fs);
    }
  }, false));

  // ── Required note + Save ────────────────────────────────────────────────────
  const reqNote=document.createElement('div');reqNote.style.cssText='font-size:11px;color:#707070;margin:12px 0 8px;';
  reqNote.innerHTML='<span class="req">*</span> Required field';el.appendChild(reqNote);

  const submitBtn=document.createElement('button');submitBtn.className='btn-primary';
  submitBtn.style.cssText='width:100%;padding:14px;font-size:15px;border-radius:10px;';
  submitBtn.textContent=isEditing?'Save Changes':'Save Agenda & Generate Script';
  submitBtn.addEventListener('click',()=>{
    if(!d.date){alert('Please enter a meeting date.');return;}
    if(!d.conducting){alert('Please enter who is conducting.');return;}
    if(!d.presiding){alert('Please enter who is presiding.');return;}
    pruneWardBusinessForDate();
    if(isEditing){
      // Update existing agenda in place
      Object.assign(editingAgenda,d);
      window._agendaDraft=null;
      state.view='detail';render();
      dbSaveAgenda(editingAgenda).then(id=>{
        if(!id){alert('⚠️ Your changes did NOT save — there was a database error. Please try again, and check your connection. (Open the browser console for details.)');return;}
        syncAgendaToSacRecord(editingAgenda);
      });
    } else {
      const tempId=Date.now();
      const agenda={id:tempId,...JSON.parse(JSON.stringify(d))};
      if(!state.agendas)state.agendas=[];
      state.agendas.push(agenda);
      window._agendaDraft=null;
      state.view='detail';state.detailId=tempId;render();
      dbSaveAgenda(agenda).then(realId=>{
        if(realId){
          const a=state.agendas.find(x=>x.id===tempId);
          if(a){a.id=realId;state.detailId=realId;}
          syncAgendaToSacRecord({...agenda,id:realId||tempId});
        } else {
          alert('⚠️ This agenda did NOT save to the database — there was an error. Please try again, and check your connection. (Open the browser console for details.)');
        }
      });
    }
  });
  el.appendChild(submitBtn);
}


// Auto-populate sacrament_meetings from a saved sacrament agenda
async function syncAgendaToSacRecord(agenda){
  if(!agenda.date) return;
  if((agenda.meetingCategory||'sacrament')!=='sacrament') return;

  // Build speakers array from agenda fields
  const speakers=[];
  if(agenda.speaker1) speakers.push({name:agenda.speaker1,topic:agenda.speaker1Topic||'',isYouth:false});
  if(agenda.speaker2) speakers.push({name:agenda.speaker2,topic:agenda.speaker2Topic||'',isYouth:false});

  // Check for existing record on this date+ward
  const existing=state.sacMeetings.find(m=>m.date===agenda.date&&m.ward===agenda.ward);

  const m={
    id: existing?.id||null,
    ward: agenda.ward||'',
    date: agenda.date,
    conducting: agenda.conducting||'',
    openingPrayer: agenda.openingPrayer||'',
    closingPrayer: agenda.closingPrayer||'',
    speakers,
    notes: '',
    meetingType: agenda.meetingType||'Regular',
    agendaId: agenda.id||null,
  };

  // Preserve manual notes if existing record has them
  if(existing?.notes) m.notes=existing.notes;

  await dbSaveSacMeeting(m);
}

// ── Build Script ──────────────────────────────────────────────────────────────
function buildScript(a){
  const blocks=[];
  // Helper: format "Title Name" — Counselor/Other → "Brother Name"
  function titledName(name,title){
    if(!name)return'[Name]';
    const t=title||'';
    if(t==='Counselor/Other')return`Brother ${name}`;
    if(t==='Elder'||t==='President'||t==='Bishop')return`${t} ${name}`;
    return name;
  }
  const conductingFull=titledName(a.conducting,a.conductingTitle);
  const presidingFull=a.presiding?titledName(a.presiding,a.presidingTitle):'';

  const ward=a.ward||'the ward';
  const date=fmtDate(a.date);
  const isFast=a.meetingType==='Fast & Testimony';

  // 1 — Welcome
  blocks.push({step:'Welcome',text:`Good ${date&&new Date(a.date+'T12:00:00').getHours()<12?'morning':'afternoon'} brothers and sisters.\nWe welcome you to the Church of Jesus Christ of Latter-day Saints!\n\nThis is the ${isFast?'Fast and Testimony Meeting':'Sacrament Meeting'} for the ${ward} on ${date}.`});

  // 2 — Introduction
  let intro=`My name is ${conductingFull}. ${presidingFull?`${presidingFull}, who presides at today's meeting, has asked that I conduct.`:''}`;
  if(a.highCounselor) intro+=`\n\nWe welcome ${a.highCounselor} from the stake high council who is visiting with us today${a.stakeVisiting?' to conduct stake business.':'.'}`;
  if(a.chorister||a.accompanist){
    intro+=`\n\nWe'd like to extend a special thank you to our Chorister ${a.chorister||'[Chorister]'} and our Accompanist ${a.accompanist||'[Accompanist]'} who will provide the music for today's meeting.`;
  }
  blocks.push({step:'Introduction',text:intro.trim()});

  // 3 — Opening Hymn & Prayer
  let hymnLine=a.openingHymnNum?`We will open by singing hymn number ${a.openingHymnNum}${a.openingHymnTitle?`, "${a.openingHymnTitle}"`:''}.`:'We will now sing our opening hymn.';
  hymnLine+=a.openingPrayer?`\n\nFollowing the hymn, ${a.openingPrayer} will offer our opening prayer.`:'\n\nFollowing the hymn we will have our opening prayer.';
  blocks.push({step:'Opening Hymn & Prayer',text:hymnLine});

  // 4 — Announcements
  const annList=a.announcementList?a.announcementList.filter(Boolean):a.announcements?a.announcements.split('\n').filter(Boolean):[];
  if(annList.length){
    const annText=annList.length===1
      ?annList[0]
      :annList.map((ann,i)=>`${i+1}. ${ann}`).join('\n');
    blocks.push({step:'Announcements',text:`By way of announcements:\n\n${annText}`});
  }

  // 5 — Ward Business (if any)
  const hasWB=(a.releases&&a.releases.some(r=>r.member))||
              (a.sustainings&&a.sustainings.some(s=>s.member))||
              (a.ordinations&&a.ordinations.some(o=>o.member))||
              (a.babyBlessingsList&&a.babyBlessingsList.some(Boolean))||a.babyBlessings||
              (a.confirmationsList&&a.confirmationsList.some(Boolean))||a.confirmations||
              (a.newRecordsList&&a.newRecordsList.some(Boolean))||a.newRecords;

  if(hasWB){
    blocks.push({step:'Ward Business',text:'Before we Continue with the Sacrament portion of our program, we have some Ward Business to take care of.'});

    const nrList=a.newRecordsList?a.newRecordsList.filter(Boolean):a.newRecords?[a.newRecords]:[];
  if(nrList.length){
      blocks.push({step:'New Records',text:`We'd like to welcome the following member(s) whose records have been received into our ward:\n\n${nrList.join('\n')}`});
    }

    const releases=a.releases?a.releases.filter(r=>r.member):[];
    if(releases.length){
      const plural=releases.length>1;
      let txt=plural
        ?'The following members have been released from their calling:\n\n'
        :'The following member has been released from his/her calling:\n\n';
      txt+=releases.map(r=>`${r.member}${r.calling?` as ${r.calling}`:''}`).join('\n');
      txt+=plural
        ?'\n\nWe propose that they be given a vote of thanks for their service. Those who wish to express their appreciation may manifest by the uplifted hand.'
        :'\n\nWe propose that he/she be given a vote of thanks for his/her service. Those who wish to express their appreciation may manifest by the uplifted hand.';
      blocks.push({step:'Release(s)',text:txt});
    }

    const sustainings=a.sustainings?a.sustainings.filter(s=>s.member):[];
    if(sustainings.length){
      let txt='';
      txt+=sustainings.map(s=>`${s.member}${s.calling?` as ${s.calling}`:''}`).join('\n');
      const plural2=sustainings.length>1;
      const header=plural2
        ?'The following members have been called. If they are here, will they please stand until after the vote is taken. We have called:\n\n'
        :'The following member has been called. If he/she is here, will he/she please stand until after the vote is taken. We have called:\n\n';
      const footer=plural2
        ?'\n\nWe propose that they be sustained. Those in favor may manifest it by the uplifted hand. [Pause briefly for the sustaining vote.] Those opposed, if any, may manifest it. [Pause briefly to allow for a dissenting vote, if any.] Thank you.'
        :'\n\nWe propose that he/she be sustained. Those in favor may manifest it by the uplifted hand. [Pause briefly for the sustaining vote.] Those opposed, if any, may manifest it. [Pause briefly to allow for a dissenting vote, if any.] Thank you.';
      txt=header+txt+footer;
      blocks.push({step:'Sustaining(s)',text:txt.trim()});
    }

    const ords=a.ordinations?a.ordinations.filter(o=>o.member):[];
    if(ords.length){
      let txt=ords.map(o=>`We will now proceed with the ordination of ${o.member} to the office of ${o.office} in the ${['Deacon','Teacher','Priest'].includes(o.office)?'Aaronic':'Melchizedek'} Priesthood.`).join('\n\n');
      blocks.push({step:'Ordination(s)',text:txt});
    }

    const bbList=a.babyBlessingsList?a.babyBlessingsList.filter(Boolean):a.babyBlessings?[a.babyBlessings]:[];
    if(bbList.length){
      blocks.push({step:'Baby Blessing(s)',text:`We will now proceed with the blessing of the following child${bbList.length>1?'ren':''}:\n\n${bbList.join('\n')}`});
    }

    const cfList=a.confirmationsList?a.confirmationsList.filter(Boolean):a.confirmations?[a.confirmations]:[];
    if(cfList.length){
      blocks.push({step:'Confirmation(s)',text:`We will now proceed with the confirmation of the following individual${cfList.length>1?'s':''}:\n\n${cfList.join('\n')}`});
    }
  }

  // 6 — Sacrament Hymn
  let sacLine=a.sacramentHymnNum?`We will prepare to partake of the Sacrament by singing hymn number ${a.sacramentHymnNum}${a.sacramentHymnTitle?`, "${a.sacramentHymnTitle}"`:''}.`:'We will now sing our Sacrament hymn.';
  blocks.push({step:'Sacrament Hymn',text:sacLine});

  // 7 — After Sacrament
  blocks.push({step:'After Sacrament',text:"We'd like to thank the Aaronic Priesthood for the reverent manner in which they administered the Sacrament."});

  // 8 — Program
  if(isFast){
    blocks.push({step:'Fast & Testimony',text:"We will now open the meeting for the bearing of testimonies. We invite all who feel so inclined to come to the podium and share their testimony."});
  } else {
    const speakers=[];
    if(a.speaker1) speakers.push({name:a.speaker1,topic:a.speaker1Topic});
    if(a.speaker2) speakers.push({name:a.speaker2,topic:a.speaker2Topic});

    let progText='The remainder of our program will go as follows:\n\n';
    speakers.forEach((s,i)=>{
      progText+=`- We will ${i===0?'first be privileged':'next be pleased'} to hear from ${s.name}.`;
      if(i<speakers.length-1) progText+='\n\n';
    });
    if(a.intermediateHymn||a.intermediateHymnTitle){
      progText+=`\n\n- Our Intermediate Hymn will be ${a.intermediateHymn?`#${a.intermediateHymn} `:''}${a.intermediateHymnTitle?`"${a.intermediateHymnTitle}"`:''}.`;
    }
    if(a.finalSpeaker){
      progText+=`\n\n- And our concluding speaker will be ${a.finalSpeaker}.`;
    }
    blocks.push({step:'Program Overview',text:progText});
  }

  // 9 — Closing
  let closingLine=a.closingHymnNum?`We will close by singing hymn number ${a.closingHymnNum}${a.closingHymnTitle?`, "${a.closingHymnTitle}"`:''}.`:'We will now sing our closing hymn.';
  closingLine+=a.closingPrayer?`\n\n${a.closingPrayer} will then offer our closing prayer.`:'\n\nWe will then have our closing prayer.';
  blocks.push({step:'Closing Hymn & Prayer',text:closingLine});
  blocks.push({step:'Dismissal',text:'This meeting is now dismissed.'});

  return blocks;
}

// ── Render Agenda Detail (Script View) ────────────────────────────────────────
// Escapes HTML, then turns bare URLs into clickable links.
function linkifyText(s){
  const esc=String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  return esc.replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]])/g,'<a href="$1" target="_blank" rel="noopener noreferrer" style="color:#185fa5;text-decoration:underline;word-break:break-all;">$1</a>');
}
function renderAgendaDetail(el,role){
  const a=state.agendas.find(x=>x.id===state.detailId);
  if(!a){el.innerHTML='<div class="empty-state">Agenda not found.</div>';return;}

  const hdr=document.createElement('div');hdr.className='detail-header';
  const bb=document.createElement('button');bb.className='back-btn';bb.innerHTML='&larr;';
  bb.addEventListener('click',()=>{state.view='list';state.detailId=null;render();});
  const hdi=document.createElement('div');
  const typeBadge=`<span class="agenda-type-badge${a.meetingType==='Fast & Testimony'?' fast':''}" style="font-size:12px;vertical-align:middle;margin-left:8px;">${a.meetingType}</span>`;
  hdi.innerHTML=`<div class="detail-calling">${fmtDate(a.date)}${typeBadge}</div><div class="detail-member">${a.ward} &middot; Conducting: ${a.conducting||'—'}</div>`;
  hdr.appendChild(bb);hdr.appendChild(hdi);el.appendChild(hdr);

  const actions=document.createElement('div');actions.className='script-actions';
  const refreshBtn=document.createElement('button');
  refreshBtn.style.cssText='background:#fff;border:1px solid rgba(0,0,0,0.15);color:#1c2537;padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;';
  refreshBtn.textContent='🔄 Refresh';
  async function refreshThisAgenda(){
    const origLabel=refreshBtn.textContent;refreshBtn.textContent='Refreshing…';refreshBtn.disabled=true;
    try{
      const{data,error}=await sb.from('agendas').select('*').eq('id',a.id).single();
      if(error)throw error;
      if(data){
        const idx=state.agendas.findIndex(x=>x.id===a.id);
        const fresh=agendaFromDb(data);
        if(idx>=0)state.agendas[idx]=fresh;else state.agendas.push(fresh);
        // Also pull the latest callings, since checkbox-driven step completions
        // (releases/sustainings marked in the script) live in that table.
        const{data:callingsData}=await sb.from('callings').select('*');
        if(callingsData)state.callings=callingsData.map(callingFromDb);
      }
      render();
    }catch(e){
      console.error('Refresh agenda error:',e);
      refreshBtn.textContent=origLabel;refreshBtn.disabled=false;
    }
  }
  refreshBtn.addEventListener('click',refreshThisAgenda);
  // Auto-refresh whenever this tab regains focus (e.g. it was left open on a
  // Chromebook before the meeting while edits were made elsewhere) — this is
  // in addition to manual refresh, not a replacement for it.
  if(window._agendaVisibilityHandler) document.removeEventListener('visibilitychange',window._agendaVisibilityHandler);
  window._agendaVisibilityHandler=()=>{if(!document.hidden&&state.tab==='agendas'&&state.view==='detail'&&state.detailId===a.id)refreshThisAgenda();};
  document.addEventListener('visibilitychange',window._agendaVisibilityHandler);

  actions.style.cssText='display:flex;align-items:center;gap:10px;';

  const printBtn=document.createElement('button');printBtn.className='btn-primary';
  printBtn.style.cssText='padding:10px 22px;font-size:13px;';
  printBtn.innerHTML='🖨 Print';printBtn.addEventListener('click',()=>openAgendaPrintView(a,role));

  // Spacer pushes Edit/Delete far away from Refresh/Print so a mis-tap on a
  // trackpad can't land on them by accident.
  const spacer=document.createElement('div');spacer.style.flex='1';

  // "More" menu — holds Edit and Delete behind one extra tap, well clear of
  // the buttons used constantly during a live meeting.
  const moreWrap=document.createElement('div');moreWrap.style.cssText='position:relative;';
  const moreBtn=document.createElement('button');
  moreBtn.title='More actions';
  moreBtn.style.cssText='width:40px;height:40px;background:#fff;border:1px solid rgba(0,0,0,0.15);color:#1c2537;border-radius:8px;font-size:18px;font-weight:700;cursor:pointer;line-height:1;';
  moreBtn.textContent='⋮';
  const moreMenu=document.createElement('div');
  moreMenu.style.cssText='display:none;position:absolute;top:calc(100% + 8px);right:0;background:#fff;border:1px solid rgba(0,0,0,0.1);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,0.15);min-width:160px;overflow:hidden;z-index:20;';
  const editItem=document.createElement('button');
  editItem.style.cssText='display:block;width:100%;text-align:left;padding:13px 16px;background:none;border:none;font-size:13px;font-weight:600;color:#1c2537;cursor:pointer;';
  editItem.textContent='✏ Edit';
  editItem.addEventListener('mouseenter',()=>editItem.style.background='#f5f6f8');
  editItem.addEventListener('mouseleave',()=>editItem.style.background='none');
  editItem.addEventListener('click',()=>{
    moreMenu.style.display='none';
    window._agendaDraft=JSON.parse(JSON.stringify(a));
    // Keep detailId set so the wizard can find the editing agenda
    state.view='new';
    render();
  });
  const menuDivider=document.createElement('div');menuDivider.style.cssText='border-top:1px solid rgba(0,0,0,0.08);';
  const deleteItem=document.createElement('button');
  deleteItem.style.cssText='display:block;width:100%;text-align:left;padding:13px 16px;background:none;border:none;font-size:13px;font-weight:600;color:#c62828;cursor:pointer;';
  deleteItem.textContent='🗑 Delete';
  deleteItem.addEventListener('mouseenter',()=>deleteItem.style.background='#fdecea');
  deleteItem.addEventListener('mouseleave',()=>deleteItem.style.background='none');
  deleteItem.addEventListener('click',()=>{
    moreMenu.style.display='none';
    if(confirm('Delete this agenda?')){
      const deletedId=a.id;
      state.agendas=state.agendas.filter(x=>x.id!==a.id);
      state.view='list';state.detailId=null;render();
      dbDeleteAgenda(deletedId);
    }
  });
  moreMenu.appendChild(editItem);moreMenu.appendChild(menuDivider);moreMenu.appendChild(deleteItem);

  function closeMoreMenu(e){
    if(!moreWrap.contains(e.target)){moreMenu.style.display='none';document.removeEventListener('click',closeMoreMenu);}
  }
  moreBtn.addEventListener('click',e=>{
    e.stopPropagation();
    const opening=moreMenu.style.display==='none';
    moreMenu.style.display=opening?'block':'none';
    if(opening) setTimeout(()=>document.addEventListener('click',closeMoreMenu),0);
  });
  moreWrap.appendChild(moreBtn);moreWrap.appendChild(moreMenu);

  actions.appendChild(refreshBtn);actions.appendChild(printBtn);actions.appendChild(spacer);actions.appendChild(moreWrap);
  el.appendChild(actions);

  const isSacramentMeeting=(a.meetingCategory==='sacrament'||!a.meetingCategory);

  // ── Pulpit-ready banner ────────────────────────────────────────────────────
  if(isSacramentMeeting){
    try{
      const ward=a.ward;
      const missing={sustain:[],release:[]};
      function safeArr(v){if(Array.isArray(v))return v;if(!v)return[];try{const p=JSON.parse(v);return Array.isArray(p)?p:[];}catch(e){return[];}}
      const aReleases=safeArr(a.releases);
      const aSustainings=safeArr(a.sustainings);

    (state.callings||[]).filter(c=>c.ward===ward).forEach(c=>{
      const steps=getSteps(c);
      const nextStep=steps[Math.min(c.currentStep,steps.length-1)];
      if(nextStep==='Sustain over Pulpit'||nextStep==='Sustain & Release over Pulpit'){
        const already=aSustainings.some(s=>s.member===c.name&&s.calling===c.calling);
        if(!already) missing.sustain.push({member:c.name,calling:c.calling,_callingId:c.id});
        if(nextStep==='Sustain & Release over Pulpit'&&c.currentlyFilled&&c.releaseName){
          const alreadyRel=aReleases.some(r=>r.member===c.releaseName&&r.calling===c.calling);
          if(!alreadyRel) missing.release.push({member:c.releaseName,calling:c.calling,_callingId:c.id});
        }
      }
      if(nextStep==='Release over Pulpit'){
        const name=c.releaseName||c.name;
        const already=aReleases.some(r=>r.member===name&&r.calling===c.calling);
        if(!already) missing.release.push({member:name,calling:c.calling,_callingId:c.id});
      }
    });

    const totalMissing=missing.sustain.length+missing.release.length;
    if(totalMissing>0){
      const banner=document.createElement('div');
      banner.style.cssText='background:#fef9ed;border:1px solid #f5c842;border-radius:10px;padding:12px 16px;margin-bottom:16px;max-width:760px;';

      const bannerHdr=document.createElement('div');bannerHdr.style.cssText='display:flex;align-items:center;justify-content:space-between;gap:12px;';
      const bannerTitle=document.createElement('div');
      bannerTitle.style.cssText='font-size:13px;font-weight:600;color:#92400e;';
      const items=[
        ...missing.sustain.map(s=>`${s.member} as ${s.calling}`),
        ...missing.release.map(r=>`Release ${r.member} from ${r.calling}`),
      ];
      bannerTitle.innerHTML=`⚠ <strong>${totalMissing} calling${totalMissing>1?'s':''} ready for the pulpit</strong> not yet on this agenda`;
      bannerHdr.appendChild(bannerTitle);

      const addBtn=document.createElement('button');
      addBtn.style.cssText='background:#1c2537;color:#fff;border:none;padding:7px 16px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;';
      addBtn.textContent='Add to Agenda';
      addBtn.addEventListener('click',async()=>{
        addBtn.disabled=true;addBtn.textContent='Adding…';
        try{
          const newSustainings=[...aSustainings,...missing.sustain.map(s=>({member:s.member,calling:s.calling}))];
          const newReleases=[...aReleases,...missing.release.map(r=>({member:r.member,calling:r.calling}))];
          const{error}=await sb.from('agendas').update({
            sustainings:JSON.stringify(newSustainings),
            releases:JSON.stringify(newReleases),
          }).eq('id',a.id);
          if(error)throw error;
          a.sustainings=newSustainings;a.releases=newReleases;
          // Refresh from DB
          const{data}=await sb.from('agendas').select('*').eq('id',a.id).single();
          if(data){
            const idx=state.agendas.findIndex(x=>x.id===a.id);
            if(idx>=0)state.agendas[idx]=agendaFromDb(data);
          }
          render();
        }catch(e){
          alert('Error: '+e.message);
          addBtn.disabled=false;addBtn.textContent='Add to Agenda';
        }
      });
      bannerHdr.appendChild(addBtn);
      banner.appendChild(bannerHdr);

      // List the missing items
      const bannerList=document.createElement('div');bannerList.style.cssText='margin-top:8px;font-size:12px;color:#92400e;';
      items.forEach(item=>{
        const line=document.createElement('div');line.style.cssText='padding:2px 0;';line.textContent='• '+item;
        bannerList.appendChild(line);
      });
      banner.appendChild(bannerList);
      el.appendChild(banner);
    }
    }catch(e){console.error('Banner error:',e);}
  }
  if(!isSacramentMeeting){
    const doc=buildGenericAgendaDoc(a, role);
    el.appendChild(doc);

    // Live notes panel (uses speaker1Topic as storage for non-sacrament)
    const notesPanel=document.createElement('div');notesPanel.className='live-notes-panel';

    // Header + status
    const notesHdr=document.createElement('div');notesHdr.className='live-notes-header';
    const notesTitle=document.createElement('div');notesTitle.className='live-notes-title';notesTitle.textContent='Meeting Notes';
    const notesStatusWrap=document.createElement('div');notesStatusWrap.className='live-notes-status';
    const notesDot=document.createElement('div');notesDot.className='live-notes-dot';
    const notesStatusTxt=document.createElement('span');notesStatusTxt.textContent='Connecting…';
    notesStatusWrap.appendChild(notesDot);notesStatusWrap.appendChild(notesStatusTxt);
    notesHdr.appendChild(notesTitle);notesHdr.appendChild(notesStatusWrap);
    notesPanel.appendChild(notesHdr);

    // ── Rich text toolbar ────────────────────────────────────────────────────
    const toolbar=document.createElement('div');toolbar.className='rte-toolbar';

    function rteBtn(label,title,cmd,val){
      const btn=document.createElement('button');btn.className='rte-btn';
      btn.innerHTML=label;btn.title=title;btn.type='button';
      btn.addEventListener('mousedown',e=>{
        e.preventDefault(); // prevent editor blur
        document.execCommand(cmd,false,val||null);
        editor.focus();
        updateToolbarState();
      });
      return btn;
    }
    function sep(){const s=document.createElement('div');s.className='rte-sep';return s;}

    const btnBold=rteBtn('<b>B</b>','Bold (Ctrl+B)','bold');
    const btnItalic=rteBtn('<i>I</i>','Italic (Ctrl+I)','italic');
    const btnUnderline=rteBtn('<u>U</u>','Underline (Ctrl+U)','underline');
    toolbar.appendChild(btnBold);toolbar.appendChild(btnItalic);toolbar.appendChild(btnUnderline);
    toolbar.appendChild(sep());
    const btnUL=rteBtn('• List','Bullet list','insertUnorderedList');
    const btnOL=rteBtn('1. List','Numbered list','insertOrderedList');
    toolbar.appendChild(btnUL);toolbar.appendChild(btnOL);
    toolbar.appendChild(sep());
    const btnClear=rteBtn('✕ Clear','Remove formatting','removeFormat');
    toolbar.appendChild(btnClear);
    notesPanel.appendChild(toolbar);

    // ── Contenteditable editor ───────────────────────────────────────────────
    const editor=document.createElement('div');editor.className='rte-editor';
    editor.contentEditable='true';
    editor.setAttribute('data-placeholder','Type meeting notes here — bold, bullets, and live sync supported…');
    editor.innerHTML=a.speaker1Topic||'';
    notesPanel.appendChild(editor);

    // Highlight active toolbar buttons based on cursor position
    function updateToolbarState(){
      btnBold.classList.toggle('active',document.queryCommandState('bold'));
      btnItalic.classList.toggle('active',document.queryCommandState('italic'));
      btnUnderline.classList.toggle('active',document.queryCommandState('underline'));
      btnUL.classList.toggle('active',document.queryCommandState('insertUnorderedList'));
      btnOL.classList.toggle('active',document.queryCommandState('insertOrderedList'));
    }
    editor.addEventListener('keyup',updateToolbarState);
    editor.addEventListener('mouseup',updateToolbarState);
    editor.addEventListener('selectionchange',updateToolbarState);

    const notesFooter=document.createElement('div');notesFooter.className='live-notes-footer';
    notesFooter.textContent='Notes are shared live. Last edit wins if two people type simultaneously.';
    notesPanel.appendChild(notesFooter);
    el.appendChild(notesPanel);

    // ── Realtime sync ────────────────────────────────────────────────────────
    if(window._agendaNotesChannel){try{sb.removeChannel(window._agendaNotesChannel);}catch(e){}window._agendaNotesChannel=null;}
    let saveTimer=null;
    let lastTyped=0; // timestamp of last local keypress
    const TYPING_COOLDOWN=2000; // don't apply remote updates while actively typing

    function setStatus(label,dotClass){notesStatusTxt.textContent=label;notesDot.className='live-notes-dot'+(dotClass?' '+dotClass:'');}

    try{
      const channel=sb.channel(`agenda-notes-${a.id}`,{config:{broadcast:{self:false}}});

      channel.on('broadcast',{event:'notes-update'},payload=>{
        if(!payload.payload?.notes) return;
        const timeSinceTyping=Date.now()-lastTyped;
        if(timeSinceTyping<TYPING_COOLDOWN) return; // user is actively typing, skip
        const html=payload.payload.notes;
        if(editor.innerHTML!==html) editor.innerHTML=html;
        a.speaker1Topic=html;
        setStatus('Live','live');
      });

      channel.subscribe(s=>{
        if(s==='SUBSCRIBED')setStatus('Live','live');
        else if(s==='CHANNEL_ERROR'||s==='TIMED_OUT')setStatus('Offline','');
      });

      window._agendaNotesChannel=channel;

      editor.addEventListener('input',()=>{
        lastTyped=Date.now();
        setStatus('Saving…','saving');
        clearTimeout(saveTimer);
        saveTimer=setTimeout(async()=>{
          const html=editor.innerHTML;
          channel.send({type:'broadcast',event:'notes-update',payload:{notes:html}});
          try{
            await sb.from('agendas').update({speaker1_topic:html}).eq('id',a.id);
            a.speaker1Topic=html;
            setStatus('Saved ✓','');
            setTimeout(()=>setStatus('Live','live'),1500);
          }catch(e){setStatus('Save failed','');}
        },700);
      });

    }catch(e){
      setStatus('Auto-save only','');
      editor.addEventListener('input',()=>{
        lastTyped=Date.now();
        clearTimeout(saveTimer);
        saveTimer=setTimeout(async()=>{
          const html=editor.innerHTML;
          await sb.from('agendas').update({speaker1_topic:html}).eq('id',a.id);
          a.speaker1Topic=html;
          setStatus('Saved ✓','');
        },800);
      });
    }
    return;
  }

  const doc=buildSacramentScriptDoc(a, role, true);
  el.appendChild(doc);

}

  // Header row: logo | text | spacer
  const docHdr=document.createElement('div');
  docHdr.style.cssText='display:flex;align-items:flex-start;gap:20px;margin-bottom:8px;';
  const logoWrap=document.createElement('div');logoWrap.style.cssText='width:60px;flex-shrink:0;margin-top:-14px;';
  logoWrap.innerHTML=LOGO_SVG;
  const hdrText=document.createElement('div');hdrText.style.cssText='flex:1;text-align:center;';
  hdrText.innerHTML=`
    <div style="font-size:12px;font-weight:700;letter-spacing:0.05em;color:#1c2537;margin-bottom:3px;">THE CHURCH OF JESUS CHRIST OF LATTER-DAY SAINTS</div>
    <div style="font-size:17px;font-weight:700;color:#1c2537;">${a.ward}</div>
    <div style="font-size:14px;font-weight:600;margin-top:2px;color:#333;">Sacrament Meeting — ${a.meetingType==='Fast & Testimony'?'Fast &amp; Testimony':'Regular'}</div>
    <div style="font-size:13px;margin-top:3px;color:#555;">${fmtDate(a.date)}</div>`;
  const logoSpacer=document.createElement('div');logoSpacer.style.width='60px';
  docHdr.appendChild(logoWrap);docHdr.appendChild(hdrText);docHdr.appendChild(logoSpacer);
  doc.appendChild(docHdr);

  const hr1=document.createElement('hr');hr1.style.cssText='border:none;border-top:2px solid #1c2537;margin:12px 0 16px;';doc.appendChild(hr1);

  // Meta lines
  function metaLine(lbl,val){
    if(!val)return;
    const row=document.createElement('div');row.className='sac-item-row';row.style.marginBottom='5px';
    const l=document.createElement('span');l.className='sac-item-label';l.style.minWidth='110px';l.innerHTML=lbl+':';
    const v=document.createElement('span');v.style.color='#333';v.textContent=val;
    row.appendChild(l);row.appendChild(v);doc.appendChild(row);
  }
  metaLine('Presiding',a.presiding);
  metaLine('Conducting',a.conducting);
  if(a.highCounselor)metaLine('Visiting HC',a.highCounselor+(a.stakeVisiting?' (Stake Business)':''));
  metaLine('Chorister',a.chorister);
  metaLine('Accompanist',a.accompanist);

  const hr2=document.createElement('hr');hr2.style.cssText='border:none;border-top:1px solid #ccc;margin:14px 0 16px;';doc.appendChild(hr2);

  // Helpers
  function agendaItem(lbl,val){
    const row=document.createElement('div');row.className='sac-item-row';
    const l=document.createElement('span');l.className='sac-item-label';l.textContent=lbl+':';
    const v=document.createElement('span');v.style.color='#333';v.innerHTML=val;
    row.appendChild(l);row.appendChild(v);doc.appendChild(row);
  }
  function scriptPara(txt){
    if(!txt||!txt.trim())return;
    const p=document.createElement('p');
    p.style.cssText='font-size:13px;line-height:1.75;color:#555;font-style:italic;margin:8px 0 14px 0;padding-left:14px;border-left:3px solid #ddd;white-space:pre-wrap;';
    p.textContent=txt;doc.appendChild(p);
  }
  function sectionDiv(lbl){
    const d2=document.createElement('div');
    d2.style.cssText='font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#636363;margin:18px 0 10px;';
    d2.textContent=lbl;doc.appendChild(d2);
  }

  const isFast=a.meetingType==='Fast & Testimony';

  // Welcome
  scriptPara(`Good afternoon brothers and sisters. We welcome you to the ${isFast?'Fast and Testimony Meeting':'Sacrament Meeting'} for the ${a.ward} of the Church of Jesus Christ of Latter-day Saints.`);

  // Introduction
  function titledName2(name,title){if(!name)return'[Name]';const t=title||'';if(t==='Counselor/Other')return`Brother ${name}`;if(t==='Elder'||t==='President'||t==='Bishop')return`${t} ${name}`;return name;}
  const conductingFull2=titledName2(a.conducting,a.conductingTitle);
  const presidingFull2=a.presiding?titledName2(a.presiding,a.presidingTitle):'';
  let intro=`My name is ${conductingFull2}. ${presidingFull2?`${presidingFull2}, who presides at today's meeting, has asked that I conduct.`:''}`;
  if(a.highCounselor)intro+=`\n\nWe welcome ${a.highCounselor} from the Stake High Council on the stand with us today.`;
  if(a.chorister||a.accompanist)intro+=`\n\nWe'd like to extend a special thank you to our Chorister ${a.chorister||'[Chorister]'} and our Accompanist ${a.accompanist||'[Accompanist]'} who will provide the music for today's meeting.`;
  scriptPara(intro.trim());

  // Announcements
  const annList=a.announcementList?a.announcementList.filter(Boolean):[];
  if(annList.length){
    sectionDiv('Announcements');
    scriptPara('By way of announcements:\n\n'+annList.map((x,i)=>annList.length>1?`${i+1}. ${x}`:x).join('\n'));
  }

  // Opening Hymn & Prayer
  scriptPara(`Our opening hymn will be hymn number ${a.openingHymnNum||'[hymn number]'}${a.openingHymnTitle?`, "${a.openingHymnTitle}"`:''}.  After the conclusion of the hymn ${a.openingPrayer||'[opening prayer]'} will offer our opening prayer.`);
  if(a.openingHymnNum||a.openingHymnTitle)
    agendaItem('Opening Hymn',`#${a.openingHymnNum||'—'}${a.openingHymnTitle?`, "${a.openingHymnTitle}"`:''}`);
  if(a.openingPrayer)agendaItem('Invocation',a.openingPrayer);

  // Stake Business
  if(a.highCounselor&&a.stakeVisiting){
    sectionDiv('Stake Business');
    scriptPara(`We'll now turn the time over to ${a.highCounselor} for some stake business.`);
    agendaItem('Stake Business',a.highCounselor);
  }

  // Ward Business
  const releases=a.releases?a.releases.filter(r=>r.member):[];
  const sustainings=a.sustainings?a.sustainings.filter(s=>s.member):[];
  const ords=a.ordinations?a.ordinations.filter(o=>o.member):[];
  const blessings=a.babyBlessingsList?a.babyBlessingsList.filter(Boolean):[];
  const confs=a.confirmationsList?a.confirmationsList.filter(Boolean):[];
  const newRecs=a.newRecordsList?a.newRecordsList.filter(Boolean):[];
  const hasWB=releases.length||sustainings.length||ords.length||blessings.length||confs.length||newRecs.length;

  if(hasWB){
    sectionDiv('Ward Business');
    scriptPara('Before we Continue with the Sacrament portion of our program, we have some Ward Business to take care of.');
    if(newRecs.length){
      scriptPara(`We'd like to welcome the following member${newRecs.length>1?'s':''} whose records have been received into our ward:`);
      agendaItem('New Record(s)',newRecs.join('<br>'));
    }
    if(releases.length){
      const pl=releases.length>1;
      scriptPara(`The following member${pl?'s have':' has'} been released from ${pl?'their':'his/her'} calling:`);

      // Release agenda items with optional "mark complete" checkbox for linked callings
      const relDiv=document.createElement('div');relDiv.style.cssText='margin-bottom:8px;';
      const relLblEl=document.createElement('span');relLblEl.style.cssText='font-weight:700;min-width:130px;font-size:13px;color:#1c2537;display:inline-block;';relLblEl.textContent='Release(s):';
      relDiv.appendChild(relLblEl);
      releases.forEach(r=>{
        const rrow=document.createElement('div');rrow.className='sac-cal-row';
        const rname=document.createElement('span');rname.className='sac-cal-name';rname.textContent=`${r.member}${r.calling?` — ${r.calling}`:''}`;
        rrow.appendChild(rname);
        if(interactive&&(r._callingId||r.member)){
          const linkedC=r._callingId
            ? state.callings.find(c=>c.id===r._callingId)
            : state.callings.find(c=>c.ward===a.ward&&(c.releaseName===r.member||c.name===r.member)&&c.calling===r.calling);
          if(linkedC){
            const steps=getSteps(linkedC);
            const relIdx=Math.max(steps.indexOf('Extend Release'),steps.indexOf('Release Current'),steps.indexOf('Release over Pulpit'));
            const alreadyDone=relIdx>=0&&linkedC.currentStep>relIdx;
            const cb=document.createElement('input');cb.type='checkbox';cb.checked=alreadyDone;
            cb.title='Mark Release as complete in Callings';
            cb.style.cssText='width:16px;height:16px;cursor:pointer;accent-color:#1c7a45;';
            const cblbl=document.createElement('span');cblbl.style.cssText='font-size:11px;color:#5a5a5a;white-space:nowrap;';cblbl.textContent='Mark released';
            cb.addEventListener('change',async()=>{
              if(cb.checked){
                if(relIdx>=0){linkedC.stepDates[relIdx]=today();linkedC.currentStep=Math.max(linkedC.currentStep,relIdx+1);}
              } else {
                if(relIdx>=0){linkedC.stepDates[relIdx]=undefined;if(linkedC.currentStep===relIdx+1)linkedC.currentStep=relIdx;}
              }
              cb.disabled=true;
              await dbSaveCalling(linkedC);
              cb.disabled=false;
            });
            rrow.appendChild(cb);rrow.appendChild(cblbl);
          }
        }
        relDiv.appendChild(rrow);
      });
      doc.appendChild(relDiv);

      scriptPara(`We propose that ${pl?'they':'he/she'} be given a vote of thanks for ${pl?'their':'his/her'} service. Those who wish to express their appreciation may manifest by the uplifted hand.`);
    }
    if(sustainings.length){
      const pl=sustainings.length>1;
      scriptPara(`The following member${pl?'s have':' has'} been called. If ${pl?'they are':'he/she is'} here, will ${pl?'they':'he/she'} please stand until after the vote is taken. We have called:`);

      // Sustaining agenda items with optional "mark complete" checkbox for linked callings
      const susDiv=document.createElement('div');susDiv.style.cssText='margin-bottom:8px;';
      const susLblEl=document.createElement('span');susLblEl.style.cssText='font-weight:700;min-width:130px;font-size:13px;color:#1c2537;display:inline-block;';susLblEl.textContent='Sustaining(s):';
      susDiv.appendChild(susLblEl);
      sustainings.forEach(s=>{
        const srow=document.createElement('div');srow.className='sac-cal-row';
        const sname=document.createElement('span');sname.className='sac-cal-name';sname.textContent=`${s.member}${s.calling?` — ${s.calling}`:''}`;
        srow.appendChild(sname);
        if(interactive&&(s._callingId||s.member)){
          const linkedC=s._callingId
            ? state.callings.find(c=>c.id===s._callingId)
            : state.callings.find(c=>c.ward===a.ward&&c.name===s.member&&c.calling===s.calling);
          if(linkedC){
            const steps=getSteps(linkedC);
            const sustainIdx=Math.max(steps.indexOf('Sustain over Pulpit'),steps.indexOf('Sustain & Release over Pulpit'));
            const alreadyDone=sustainIdx>=0&&linkedC.currentStep>sustainIdx;
            const cb=document.createElement('input');cb.type='checkbox';cb.checked=alreadyDone;
            cb.title='Mark Sustain over Pulpit as complete in Callings';
            cb.style.cssText='width:16px;height:16px;cursor:pointer;accent-color:#1c7a45;';
            const cblbl=document.createElement('span');cblbl.style.cssText='font-size:11px;color:#5a5a5a;white-space:nowrap;';cblbl.textContent='Mark sustained';
            cb.addEventListener('change',async()=>{
              if(cb.checked){
                if(sustainIdx>=0){linkedC.stepDates[sustainIdx]=today();linkedC.currentStep=Math.max(linkedC.currentStep,sustainIdx+1);}
              } else {
                if(sustainIdx>=0){linkedC.stepDates[sustainIdx]=undefined;if(linkedC.currentStep===sustainIdx+1)linkedC.currentStep=sustainIdx;}
              }
              cb.disabled=true;
              await dbSaveCalling(linkedC);
              cb.disabled=false;
            });
            srow.appendChild(cb);srow.appendChild(cblbl);
          }
        }
        susDiv.appendChild(srow);
      });
      doc.appendChild(susDiv);

      scriptPara(`We propose that ${pl?'they':'he/she'} be sustained. Those in favor may manifest it by the uplifted hand. [Pause briefly for the sustaining vote.] Those opposed, if any, may manifest it. [Pause briefly to allow for a dissenting vote, if any.] Thank you.`);
    }
    if(ords.length){
      ords.forEach(o=>scriptPara(`We will now proceed with the ordination of ${o.member} to the office of ${o.office} in the ${['Deacon','Teacher','Priest'].includes(o.office)?'Aaronic':'Melchizedek'} Priesthood.`));
      agendaItem('Ordination(s)',ords.map(o=>`${o.member} — ${o.office}`).join('<br>'));
    }
    if(blessings.length){
      scriptPara(`We will now proceed with the blessing of the following child${blessings.length>1?'ren':''}:`);
      agendaItem('Baby Blessing(s)',blessings.join('<br>'));
    }
    if(confs.length){
      scriptPara(`We will now proceed with the confirmation of the following individual${confs.length>1?'s':''}:`);
      agendaItem('Confirmation(s)',confs.join('<br>'));
    }
  }

  // Sacrament
  sectionDiv('Sacrament');
  scriptPara(`We will now prepare for the partaking of the Sacrament by singing hymn #${a.sacramentHymnNum||'[hymn number]'}${a.sacramentHymnTitle?`, "${a.sacramentHymnTitle}"`:''}.  Following the hymn, the Sacrament will be administered by the Aaronic Priesthood.`);
  if(a.sacramentHymnNum||a.sacramentHymnTitle)
    agendaItem('Sacrament Hymn',`#${a.sacramentHymnNum||'—'}${a.sacramentHymnTitle?`, "${a.sacramentHymnTitle}"`:''}`);
  agendaItem('Administration','Sacrament administered by the Aaronic Priesthood');

  // Sacrament prayers — exact wording, for reference at the sacrament table
  function prayerBlock(label,text,scripture){
    const box=document.createElement('div');
    box.style.cssText='margin:10px 0 14px;padding:12px 16px;background:#f8f9fb;border:1px solid rgba(0,0,0,0.08);border-radius:8px;';
    const lbl=document.createElement('div');lbl.style.cssText='font-weight:700;font-size:12px;color:#1c2537;margin-bottom:4px;';
    lbl.textContent=`${label} (${scripture})`;
    const txt=document.createElement('div');txt.style.cssText='font-size:12.5px;color:#444;line-height:1.65;font-style:italic;';
    txt.textContent=text;
    box.appendChild(lbl);box.appendChild(txt);doc.appendChild(box);
  }
  prayerBlock('Prayer on the Bread','O God, the Eternal Father, we ask thee in the name of thy Son, Jesus Christ, to bless and sanctify this bread to the souls of all those who partake of it, that they may eat in remembrance of the body of thy Son, and witness unto thee, O God, the Eternal Father, that they are willing to take upon them the name of thy Son, and always remember him and keep his commandments which he has given them; that they may always have his Spirit to be with them. Amen.','D&C 20:77');
  prayerBlock('Prayer on the Water','O God, the Eternal Father, we ask thee in the name of thy Son, Jesus Christ, to bless and sanctify this water to the souls of all those who drink of it, that they may do it in remembrance of the blood of thy Son, which was shed for them; that they may witness unto thee, O God, the Eternal Father, that they do always remember him, that they may have his Spirit to be with them. Amen.','D&C 20:79');

  // Program
  sectionDiv(isFast?'Fast & Testimony':'Program');
  if(isFast){
    scriptPara('We will now open the meeting for the bearing of testimonies. We invite all who feel so inclined to come to the podium and share their testimony.');
  } else {
    const spk=[];
    if(a.speaker1)spk.push({name:a.speaker1,topic:a.speaker1Topic});
    if(a.speaker2)spk.push({name:a.speaker2,topic:a.speaker2Topic});
    if(spk.length||a.finalSpeaker){
      let prog="We'd like to thank the Aaronic Priesthood for the reverent manner in which they administered the Sacrament.\n\nThe remainder of our program will go as follows:\n\n";
      if(spk.length>0) prog+=`- We will first be privileged to hear from ${spk[0].name}.`;
      if(spk.length>1) prog+=`\n\n- Following ${spk[0].name}'s remarks we will be pleased to hear from ${spk[1].name}.`;
      if(a.intermediateHymn||a.intermediateHymnTitle) prog+=`\n\n- Our Intermediate Hymn will be ${a.intermediateHymn?`#${a.intermediateHymn}`:''}${a.intermediateHymn&&a.intermediateHymnTitle?', ':''}${a.intermediateHymnTitle||''}.`;
      if(a.finalSpeaker) prog+=`\n\n- And our concluding speaker will be ${a.finalSpeaker}.`;
      scriptPara(prog.trim());
    }
    spk.forEach(s=>{
      agendaItem('Speaker',s.name);
    });
    if(a.intermediateHymn||a.intermediateHymnTitle){
      agendaItem('Intermediate',`${a.intermediateHymn?`#${a.intermediateHymn} `:''}${a.intermediateHymnTitle?`"${a.intermediateHymnTitle}"`:''}` );
    }
    if(a.finalSpeaker){
      agendaItem('Final Speaker',a.finalSpeaker);
    }
  }

  // Closing
  sectionDiv('Closing');
  scriptPara(`I'd like to thank our speakers for the spirit that was felt here today.\n\nOur closing hymn will be hymn #${a.closingHymnNum||'[hymn number]'}${a.closingHymnTitle?`, "${a.closingHymnTitle}"`:''}.\n\nAfter the hymn the closing prayer will be offered by ${a.closingPrayer||'[closing prayer]'}.`);
  if(a.closingHymnNum||a.closingHymnTitle)
    agendaItem('Closing Hymn',`#${a.closingHymnNum||'—'}${a.closingHymnTitle?`, "${a.closingHymnTitle}"`:''}`);
  if(a.closingPrayer)agendaItem('Benediction',a.closingPrayer);

  return doc;
}

function buildGenericAgendaDoc(a, role){
  const doc=document.createElement('div');
  doc.style.cssText='background:#fff;border:1px solid rgba(0,0,0,0.08);border-radius:12px;padding:28px 32px;max-width:760px;';

  function sectionHeader(label,icon){
    const h=document.createElement('div');h.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:14px;';
    h.innerHTML=`<span style="font-size:14px;">${icon}</span><span style="font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:#1c2537;">${label}</span>`;
    return h;
  }

  // Meeting title + date
  const titleRow=document.createElement('div');titleRow.style.cssText='margin-bottom:20px;padding-bottom:16px;border-bottom:2px solid #1c2537;';
  const types=getMeetingTypes(role);
  const mt=types.find(t=>t.key===a.meetingCategory)||{label:a.meetingCategory};
  titleRow.innerHTML=`<div style="font-size:19px;font-weight:700;color:#1c2537;">${mt.label}</div><div style="font-size:14px;color:#5a5a5a;margin-top:3px;">${a.ward} · ${fmtDate(a.date)}</div>`;
  doc.appendChild(titleRow);

  // Summary rows helper
  function row(lbl,val){
    if(!val)return;
    const r=document.createElement('div');r.style.cssText='display:flex;gap:20px;margin-bottom:12px;font-size:14px;align-items:baseline;';
    const l=document.createElement('span');l.style.cssText='font-weight:700;min-width:160px;color:#1c2537;flex-shrink:0;';l.textContent=lbl+':';
    const v=document.createElement('span');v.style.color='#262626';v.textContent=val;
    r.appendChild(l);r.appendChild(v);doc.appendChild(r);
  }

  row('Conducting',a.conducting);
  row('Opening Prayer',a.openingPrayer);
  if(a.openingHymnNum||a.openingHymnTitle)
    row('Opening Hymn',`#${a.openingHymnNum||'—'}${a.openingHymnTitle?' — '+a.openingHymnTitle:''}`);
  if(a.spiritualThought)
    row(a.meetingType&&a.meetingType!=='Regular'&&a.meetingType!=='Spiritual Thought'?a.meetingType:'Spiritual Thought',a.spiritualThought);

  // Minutes from last meeting (stored in final_speaker_topic)
  if(a.finalSpeakerTopic){
    const sec=document.createElement('div');sec.style.cssText='margin-top:22px;padding-top:18px;border-top:1px solid rgba(0,0,0,0.08);';
    sec.appendChild(sectionHeader('Minutes from Last Meeting','📝'));
    const minText=document.createElement('div');minText.style.cssText='font-size:14px;color:#262626;line-height:1.7;white-space:pre-wrap;';minText.textContent=a.finalSpeakerTopic;
    sec.appendChild(minText);
    doc.appendChild(sec);
  }

  // Agenda items from announcement_list — group each main item with the
  // sub-items that follow it, so they render as one connected block instead
  // of a flat, hard-to-scan list.
  if(a.announcementList&&a.announcementList.length){
    const sec=document.createElement('div');sec.style.cssText='margin-top:22px;padding-top:18px;border-top:1px solid rgba(0,0,0,0.08);';
    sec.appendChild(sectionHeader('Agenda Items','📋'));
    doc.appendChild(sec);

    const groups=[];
    let cur=null;
    a.announcementList.filter(l=>typeof l==='string'&&l.replace(/^\t+/,'').trim()!=='').forEach(item=>{
      const isSub=item.startsWith('\t');
      const text=item.replace(/^\t+/,'');
      if(isSub){
        if(!cur){cur={text:'',subs:[]};groups.push(cur);}
        cur.subs.push(text);
      } else {
        cur={text,subs:[]};groups.push(cur);
      }
    });

    groups.forEach((g,i)=>{
      const itemRow=document.createElement('div');
      itemRow.style.cssText=`display:flex;gap:14px;align-items:flex-start;padding:${i===0?'0':'14px'} 0 14px;${i<groups.length-1?'border-bottom:1px solid rgba(0,0,0,0.06);':''}`;
      const badge=document.createElement('div');
      badge.style.cssText='width:24px;height:24px;border-radius:50%;background:#1c2537;color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;';
      badge.textContent=String(i+1);
      const content=document.createElement('div');content.style.cssText='flex:1;min-width:0;';
      const mainText=document.createElement('div');mainText.style.cssText='font-size:14.5px;color:#1c2537;font-weight:600;line-height:1.5;';
      mainText.innerHTML=linkifyText(g.text);
      content.appendChild(mainText);
      if(g.subs.length){
        const subsWrap=document.createElement('div');subsWrap.style.cssText='margin-top:8px;padding-left:14px;border-left:2px solid rgba(28,37,55,0.14);display:flex;flex-direction:column;gap:6px;';
        g.subs.forEach(s=>{
          const sp=document.createElement('div');sp.style.cssText='font-size:13.5px;color:#444;line-height:1.5;';
          sp.innerHTML=linkifyText(s);
          subsWrap.appendChild(sp);
        });
        content.appendChild(subsWrap);
      }
      itemRow.appendChild(badge);itemRow.appendChild(content);
      doc.appendChild(itemRow);
    });
  }

  if(a.closingHymnNum||a.closingHymnTitle)
    row('Closing Hymn',`#${a.closingHymnNum||'—'}${a.closingHymnTitle?' — '+a.closingHymnTitle:''}`);
  row('Closing Prayer',a.closingPrayer);

  // ── Pending Callings — live from callings tracker (bishopric only) ────────
  if(a.meetingCategory==='bishopric'){
    const ward=a.ward;
    const pendingCallings=(state.callings||[])
      .filter(c=>c.ward===ward&&c.currentStep<getSteps(c).length-1||!branchesAllDone(c))
      .filter(c=>c.ward===ward);

    if(pendingCallings.length){
      // Sort by current step index so earliest steps appear first
      pendingCallings.sort((a,b)=>a.currentStep-b.currentStep);

      const sec=document.createElement('div');sec.style.cssText='margin-top:22px;padding-top:18px;border-top:1px solid rgba(0,0,0,0.08);';
      sec.appendChild(sectionHeader('Pending Callings','📌'));
      doc.appendChild(sec);

      pendingCallings.forEach((c,i)=>{
        const steps=getSteps(c);
        const clampedStep=Math.min(c.currentStep,steps.length-1);
        const nextStep=clampedStep>=steps.length-1
          ?(branchesAllDone(c)?'Complete':pendingBranchLabel(c))
          :steps[clampedStep];

        // Build the label with full context — same bold/non-bold treatment as the Callings page
        const dim='font-weight:400;color:#707070;';
        const strong='font-weight:700;color:#1c2537;';
        const name=strong;
        let label='';
        if(c.action==='Release Only'||c.action==='Release'){
          label=`<span style="${dim}">Release</span> <span style="${name}">${c.releaseName||c.name}</span> <span style="${dim}">from</span> <span style="${strong}">${c.calling}</span>`;
        } else {
          label=`<span style="${dim}">Call</span> <span style="${name}">${c.name}</span> <span style="${dim}">as</span> <span style="${strong}">${c.calling}</span>`;
          const releaseLines=[];
          // Someone currently in this position needs releasing
          if(c.currentlyFilled&&c.releaseName){
            releaseLines.push(`<span style="${dim}">releasing</span> <span style="${name}">${c.releaseName}</span> <span style="${dim}">from</span> <span style="${strong}">${c.calling}</span>`);
          }
          // Member being called also needs releasing from their current calling
          if(c.memberNeedsRelease){
            if(c.memberCallings&&c.memberCallings.filter(Boolean).length){
              c.memberCallings.filter(Boolean).forEach(mc=>releaseLines.push(`<span style="${dim}">releasing</span> <span style="${name}">${c.name}</span> <span style="${dim}">from</span> <span style="${strong}">${mc}</span>`));
            } else if(c.memberCurrentCalling){
              releaseLines.push(`<span style="${dim}">releasing</span> <span style="${name}">${c.name}</span> <span style="${dim}">from</span> <span style="${strong}">${c.memberCurrentCalling}</span>`);
            }
          }
          if(releaseLines.length) label+=`<span style="${dim}"> — </span>`+releaseLines.join('<span style="'+dim+'">; </span>');
        }

        const item=document.createElement('div');
        item.style.cssText=`display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start;padding:${i===0?'0':'10px'} 0 10px;${i<pendingCallings.length-1?'border-bottom:1px solid rgba(0,0,0,0.06);':''}`;
        const labelEl=document.createElement('span');labelEl.style.cssText='font-size:14px;line-height:1.5;';labelEl.innerHTML=label;
        const stepEl=document.createElement('span');stepEl.style.cssText='font-size:11.5px;font-weight:600;color:#8a5a06;background:#fdf1dc;padding:3px 10px;border-radius:20px;white-space:nowrap;flex-shrink:0;';stepEl.textContent=nextStep;
        item.appendChild(labelEl);item.appendChild(stepEl);
        sec.appendChild(item);
      });
    }
  }

  return doc;
}

// ── Branch steps — parallel tasks that run off the main flow ────────────────
// Branches attach to trigger steps and must all be done for Complete to unlock.
// Stored in c.stepMeta.branches = { lcrSustain: bool, setApart: bool, lcrSetApart: bool }
function getBranches(c){
  const action=c.action||'';
  const isCalling=action==='Calling Only'||action==='Calling & Release'||action==='Calling';
  const isRelease=action==='Release Only'||action==='Calling & Release'||action==='Release';
  const hasCurrentHolder=!!(c.currentlyFilled&&c.releaseName);
  const steps=getSteps(c);
  const sustainStep=['Sustain over Pulpit','Sustain & Release over Pulpit','Release over Pulpit'].find(s=>steps.includes(s));
  if(!sustainStep) return [];

  const isStakeCalling=c.level==='Stake'||c.level==='Stake Issued';
  const isBishopCalling=!!(c.calling&&c.calling.toLowerCase().includes('bishop'));
  const isStakeIssuedShared=c.level==='Stake Issued'&&!isBishopCalling;

  const clerkTag=isStakeIssuedShared?'S. Clerk / W. Clerk':isStakeCalling?'Stake Clerk':'Clerk';
  const setApartTag=isStakeCalling?'SP / High Council':'Bishopric';

  const branches=[];
  const sustainDate=c.stepDates[steps.indexOf(sustainStep)]||'';

  if(isCalling){
    branches.push({
      key:'lcrSustain',
      trigger:sustainStep,
      label:`Record Sustaining — ${c.name} as ${c.calling}${sustainDate?' ('+fmt(sustainDate)+')':''}`,
      sub:'Enter the new calling with sustained date in LCR',
      tag:clerkTag,
    });
  }
  if(isRelease||(isCalling&&hasCurrentHolder)){
    const relName=c.releaseName||c.name;
    branches.push({
      key:'lcrRelease',
      trigger:sustainStep,
      label:`Record Release — ${relName} from ${c.calling}`,
      sub:'Remove the calling from LCR',
      tag:clerkTag,
    });
  }
  if(isCalling){
    branches.push({
      key:'setApart',
      trigger:sustainStep,
      label:`Set Apart — ${c.name}`,
      sub:'Perform the setting apart blessing',
      tag:setApartTag,
    });
    branches.push({
      key:'lcrSetApart',
      trigger:'setApart',
      label:'Record Set Apart in LCR',
      sub:'Check the Set Apart checkbox in LCR',
      tag:clerkTag,
    });
  }
  return branches;
}

function branchesAllDone(c){
  const branches=getBranches(c);
  if(!branches.length) return true;
  const meta=c.stepMeta?.branches||{};
  return branches.every(b=>!!meta[b.key]);
}

function pendingBranchLabel(c){
  const branches=getBranches(c);
  const meta=c.stepMeta?.branches||{};
  const pending=branches.filter(b=>!meta[b.key]);
  if(!pending.length) return '—';

  // If a non-clerk action is the next pending branch (Set Apart blessing), show it first
  const firstSetApart=pending.find(b=>b.key==='setApart');
  if(firstSetApart&&pending.indexOf(firstSetApart)===0) return 'Set Apart';

  // Gather which LCR (clerk) records are still pending
  const lcrPending=pending.filter(b=>b.key==='lcrSustain'||b.key==='lcrRelease'||b.key==='lcrSetApart');
  const hasSustain=lcrPending.some(b=>b.key==='lcrSustain');
  const hasRelease=lcrPending.some(b=>b.key==='lcrRelease');
  const hasSetApart=lcrPending.some(b=>b.key==='lcrSetApart');

  // If a Set Apart blessing is still pending (not yet performed), the set-apart LCR
  // record can't happen yet — describe what's actionable now.
  const setApartStillPending=pending.some(b=>b.key==='setApart');

  // Build a concise LCR label.
  // Core = Sustaining and/or Set Apart joined with " & "; Release appended with " + ".
  if(lcrPending.length){
    const core=[];
    if(hasSustain) core.push('Sustaining');
    if(hasSetApart&&!setApartStillPending) core.push('Set Apart');
    let label=core.join(' & ');
    if(hasRelease) label=label?label+' + Release':'Release';
    if(label) return 'Record in LCR: '+label;
    // Only the set-apart LCR remains but the blessing hasn't been done yet
    if(hasSetApart&&setApartStillPending) return 'Set Apart';
  }

  // Fallback to first pending branch's short label
  const first=pending[0];
  if(first.key==='setApart') return 'Set Apart';
  return first.label.split('—')[0].trim();
}

// Canonical lifecycle order of every possible "Next Step" label, used to sort
// the Next Step column. LCR variants are ordered explicitly per ward workflow.
const NEXT_STEP_ORDER=[
  'Presidency Approval','Stake Presidency Approval','Q12 Approval',"Bishop's Approval",'Sustain in HC',
  'Set Appt to Extend','Set Appt to Release','Set Appts to Extend & Release Current',
  'Extend Calling','Extend Release','Release Current/Call to New','Release Current',
  'Sustain over Pulpit','Sustain & Release over Pulpit','Release over Pulpit',
  'Record in LCR: Sustaining',
  'Record in LCR: Sustaining + Release',
  'Set Apart',
  'Record in LCR',
  'Record in LCR: Sustaining & Set Apart',
  'Record in LCR: Sustaining & Set Apart + Release',
  'Record in LCR: Set Apart',
  'Record in LCR: Release',
  '\u2014',
];
// The label currently shown in the Next Step column for a calling.
function currentNextStepLabel(c){
  const steps=getSteps(c);
  const clamped=Math.min(c.currentStep,steps.length-1);
  const mainDone=clamped>=steps.length-1;
  return mainDone ? (branchesAllDone(c)?'\u2014':pendingBranchLabel(c)) : (steps[c.currentStep]||'\u2014');
}
// Numeric rank for sorting the Next Step column by lifecycle position.
function nextStepRank(c){
  const i=NEXT_STEP_ORDER.indexOf(currentNextStepLabel(c));
  return i===-1 ? 900+Math.min(c.currentStep,getSteps(c).length-1) : i;
}


// Get HC names from roster for assignment dropdown
function getHCRosterNames(){
  const names=[];
  (state.hcRoster||[]).forEach(row=>{
    if(!row||!row.profile_id) return;
    const p=(state.profiles||[]).find(x=>x.id===row.profile_id);
    if(p&&p.full_name) names.push(p.full_name);
  });
  return names;
}

    miHTML+=`<div><div class="info-cell-label">Callings to Release</div><div class="info-cell-value">${callingsDisplay}</div></div>`;

  if(c.spouseCalling){miHTML+=`<div><div class="info-cell-label">Spouse's Calling</div><div class="info-cell-value">${c.spouseCalling}</div></div>`;}
  if(miHTML){mi.innerHTML=miHTML;el.appendChild(mi);}

  if(c.currentlyFilled&&c.releaseName){
    const rb=document.createElement('div');rb.className='currently-filled-box';rb.style.margin='12px 0';
    rb.innerHTML=`<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:#7a5400;margin-bottom:6px;">Current Holder — To Be Released</div><div style="font-size:14px;font-weight:600;color:#1c2537">${c.releaseName}</div><div style="font-size:12px;color:#666;margin-top:2px">${c.calling}</div>`;
